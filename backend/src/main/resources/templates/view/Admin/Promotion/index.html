<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:fragment="extra_css">
        <style>
            .admin-card {
                border-radius: 8px;
                box-shadow: 0 5px 20px rgba(15, 41, 66, 0.1);
                overflow: hidden;
                border: 0;
            }
        </style>
    </th:block>
</head>
<body>
<div th:fragment="body_content">
    <div class="container py-4">
        <!-- Alert -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        
        <div class="admin-card">
            <div class="admin-header d-flex justify-content-between align-items-center gap-3 p-3" style="background-color: #0F2942; border-bottom: 3px solid #C5A017;">
                <h3 class="fw-bold text-uppercase mb-0 text-white" style="letter-spacing: 1px;">
                    <i class="bi bi-gift-fill me-2" style="color: #C5A017;"></i>Quản Lý Khuyến Mãi
                </h3>
                <a href="#" class="btn px-4 shadow-sm text-white" style="background: #C5A017; font-weight: 600;">
                    <i class="bi bi-plus-circle-fill me-1"></i> Thêm Khuyến Mãi
                </a>
            </div>

            <div class="table-responsive" style="min-height: 400px; background-color: #fff;">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-header-navy" style="background-color: #0F2942; color: white;">
                    <tr>
                        <th class="py-3 text-center text-uppercase small text-white fw-bold">Mã Khuyến Mãi</th>
                        <th class="text-center text-uppercase small text-white fw-bold">Mô tả</th>
                        <th class="text-center text-uppercase small text-white fw-bold">Giá trị giảm</th>
                        <th class="text-center text-uppercase small text-white fw-bold">Trạng thái</th>
                        <th class="text-center text-uppercase small text-white fw-bold">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="5" class="text-center py-5 text-muted">
                                <i class="bi bi-cone-striped fs-1 d-block mb-3 text-warning"></i>
                                Tính năng đang trong quá trình hoàn thiện dựa theo thiết kế.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
