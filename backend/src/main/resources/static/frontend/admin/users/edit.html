<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cập Nhật Người Dùng</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="index.css">
    <style>
        .form-label { font-weight: 600; color: var(--navy-color, #0F2942); font-size: 0.9rem; }
        .form-control, .form-select { border-radius: 8px; border: 1px solid #dee2e6; padding: 0.6rem 1rem; }
        .form-control:focus, .form-select:focus { border-color: var(--gold-color, #C5A017); box-shadow: 0 0 0 0.25rem rgba(197, 160, 23, 0.25); }
    </style>

  <!-- CÁC FILE CSS ĐƯỢC CHÈN SẴN ĐỂ TRÁNH FOUC (FLASH OF UNSTYLED CONTENT) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../../style.css" />
  <style>
    .navbar-nav .nav-link.active-menu {
      font-weight: 700 !important;
      color: #d4af37 !important; /* Màu vàng Gold */
      background-color: rgba(212, 175, 55, 0.1); /* Nền mờ */
      border-radius: 8px; /* Bo tròn góc */
      padding: 8px 16px !important; /* Tạo khoảng trống xung quanh chữ */
      transition: 0.3s all ease-in-out;
    }
  </style>

</head>
<body>

<div class="main-content">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0 admin-card">
                    <div class="admin-header d-flex justify-content-between align-items-center">
                        <h3 class="fw-bold text-uppercase mb-0 text-navy">
                            <i class="bi bi-pencil-square me-2 text-gold"></i>Cập Nhật Thông Tin
                        </h3>
                    </div>

                    <form onsubmit="event.preventDefault(); window.location.href='index.html';" class="card-body p-4 p-md-5 bg-white">
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Tên đăng nhập</label>
                            <input type="text" id="tenDangNhap" class="form-control" value="nguyenvan_a" readonly />
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Họ và tên</label>
                            <input type="text" id="hoTen" class="form-control" value="Nguyễn Văn A" required />
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Vai trò</label>
                            <select id="roleID" class="form-select">
                                <option value="1">Quản Trị Viên</option>
                                <option value="2">Nhân Viên</option>
                                <option value="3" selected>Khách Hàng</option>
                            </select>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Số điện thoại</label>
                            <input type="text" id="soDienThoai" class="form-control" value="0987654321" />
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Quốc tịch</label>
                            <input type="text" id="quocTich" class="form-control" value="Việt Nam" />
                        </div>

                        <div class="col-md-12 mb-4">
                            <label class="form-label">Địa chỉ</label>
                            <textarea id="diaChi" class="form-control" rows="3">123 Trần Duy Hưng, Hà Nội</textarea>
                        </div>
                    </div>

                    <div class="d-flex gap-3 justify-content-end mt-4 pt-4 border-top">
                        <a href="index.html" class="btn btn-outline-secondary px-4 rounded-pill fw-bold">Hủy bỏ</a>
                        <button type="submit" class="btn btn-gold px-5 shadow-sm text-white rounded-pill fw-bold" style="background: linear-gradient(135deg, #C5A017, #d4af37);">
                            <i class="bi bi-check-circle-fill me-1"></i> CẬP NHẬT
                        </button>
                    </div>
                </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Layout chung -->
<script src="../../layout.js"></script>
<script src="../../app.js"></script>
</body>
</html>
