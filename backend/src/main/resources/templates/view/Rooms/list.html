<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAY HOTEL - Danh Sách Phòng</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <!-- Bootstrap Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  
  <th:block th:fragment="extra_css">
    <link rel="stylesheet" th:href="@{/style.css}" />
    <link rel="stylesheet" th:href="@{/css/list.css}">
    <style>
        .navbar-nav .nav-link.active-menu {
          font-weight: 700 !important;
          color: #d4af37 !important; /* Màu vàng Gold */
          background-color: rgba(212, 175, 55, 0.1); /* Nền mờ */
          border-radius: 8px; /* Bo tròn góc */
          padding: 8px 16px !important; /* Tạo khoảng trống xung quanh chữ */
          transition: 0.3s all ease-in-out;
        }
    </style>
  </th:block>
</head>
<body>
<div th:fragment="body_content">

    <div class="container py-4">
        <div class="admin-card mb-4">
            <div class="admin-header d-flex justify-content-center align-items-center">
                <h3 class="fw-bold text-uppercase mb-0">
                    <i class="bi bi-grid-fill me-2"></i>Danh Sách Phòng Nghỉ
                </h3>
            </div>
            
            <div class="card-body p-4">
                <div class="card shadow-sm mb-4 border-0 bg-light">
                    <div class="card-body p-4">
                        <form id="search-form" th:action="@{/rooms}" method="get">
                            <div class="row gx-3 align-items-center justify-content-center">
                                <div class="col-md-8">
                                    <div class="input-group">
                                        <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                                        <input type="text" name="searchString" th:value="${searchString}" class="form-control border-start-0 py-2" placeholder="Tìm theo tên phòng..." />
                                        <button type="submit" class="btn btn-search fw-bold text-uppercase" style="background-color: #C5A017; color: white;">TÌM KIẾM</button>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-3 order-md-1 order-2 mt-4 mt-md-0">
                        <!-- Form Tìm Phòng Trống -->
                        <div class="filter-card mb-4 shadow-sm" style="background-color: #0F2942; border: none; overflow: hidden; border-radius: 8px;">
                            <div class="filter-header text-gold fw-bold" style="background-color: rgba(0,0,0,0.2); color: #C5A017; border-bottom: 1px solid rgba(255,255,255,0.1);"><i class="bi bi-calendar-check me-2"></i>TÌM PHÒNG TRỐNG</div>
                            <div class="card-body p-3">
                                <form id="sidebarSearchForm">
                                    <div class="mb-3">
                                        <label class="text-white small fw-bold mb-1">Ngày nhận phòng <span class="text-danger">*</span></label>
                                        <input type="date" class="form-control form-control-sm py-2" id="sbCheckinDate" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="text-white small fw-bold mb-1">Ngày trả phòng <span class="text-danger">*</span></label>
                                        <input type="date" class="form-control form-control-sm py-2" id="sbCheckoutDate" required>
                                    </div>
                                    <div class="row g-2 mb-4">
                                        <div class="col-6">
                                            <label class="text-white small fw-bold mb-1">Người lớn</label>
                                            <input type="number" class="form-control form-control-sm py-2" id="sbAdults" min="1" value="2" required>
                                        </div>
                                        <div class="col-6">
                                            <label class="text-white small fw-bold mb-1">Trẻ em</label>
                                            <input type="number" class="form-control form-control-sm py-2" id="sbChildren" min="0" value="0">
                                        </div>
                                    </div>
                                    <button type="submit" class="btn btn-gold w-100 fw-bold text-uppercase py-2 shadow-sm" style="background-color: #C5A017; color: white; border: none; font-size: 0.9rem;">ÁP DỤNG</button>
                                </form>
                            </div>
                        </div>

                        <div class="filter-card mb-4 shadow-sm">
                            <div class="filter-header"><i class="bi bi-bookmark-star-fill me-2"></i>Loại Phòng</div>
                            <div class="list-group list-group-flush" id="category-filter">
                                <a th:href="@{/rooms}" th:classappend="${currentMaLoai == null} ? 'active' : ''" class="list-group-item list-group-item-action">Tất cả</a>
                                <a th:each="loai : ${listLoai}" th:href="@{/rooms(maLoai=${loai.id})}" th:text="${loai.name}" th:classappend="${currentMaLoai == loai.id} ? 'active' : ''" class="list-group-item list-group-item-action"></a>
                            </div>
                        </div>

                        <div class="filter-card shadow-sm">
                            <div class="filter-header"><i class="bi bi-cash-stack me-2"></i>Khoảng Giá</div>
                            <div class="list-group list-group-flush" id="price-filter">
                                <a th:href="@{/rooms(maLoai=${currentMaLoai}, priceRange='')}" th:classappend="${currentPriceRange == '' or currentPriceRange == null} ? 'active' : ''" class="list-group-item list-group-item-action">Tất cả mức giá</a>
                                <a th:href="@{/rooms(maLoai=${currentMaLoai}, priceRange='lt500')}" th:classappend="${currentPriceRange == 'lt500'} ? 'active' : ''" class="list-group-item list-group-item-action">Dưới 500k</a>
                                <a th:href="@{/rooms(maLoai=${currentMaLoai}, priceRange='500-1000')}" th:classappend="${currentPriceRange == '500-1000'} ? 'active' : ''" class="list-group-item list-group-item-action">Từ 500k - 1 Triệu</a>
                                <a th:href="@{/rooms(maLoai=${currentMaLoai}, priceRange='gt2000')}" th:classappend="${currentPriceRange == 'gt2000'} ? 'active' : ''" class="list-group-item list-group-item-action">Trên 2 triệu</a>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-9 order-md-2 order-1">
                        <div id="search-criteria-alert" class="alert d-none shadow-sm border-0 mb-4 fw-bold" style="background-color: rgba(197, 160, 23, 0.1); color: #0F2942; border-left: 4px solid #C5A017 !important;">
                            <!-- JS sẽ điền tiêu chí vào đây -->
                        </div>
                        <div class="row gx-4 gy-4" id="room-list">
                            <!-- Danh sách phòng render bằng Thymeleaf -->
                            <div class="col-lg-4 col-md-6 mb-4" th:each="lp : ${listPhong}">
                                <div class="card h-100 room-card shadow-sm border" style="border-radius: 8px;">
                                    <div class="room-img-wrapper position-relative">
                                        <span th:if="${lp.phongsTrong.size() > 0}" class="badge bg-danger position-absolute top-0 start-0 m-3 px-2 py-1"><i class="bi bi-fire me-1"></i> HOT DEAL</span>
                                        <a th:href="@{/rooms/detail/{id}(id=${lp.maLoai})}">
                                            <img th:src="@{'/images/' + ${!#strings.isEmpty(lp.imageUrl) ? lp.imageUrl : 'a1.jpg'}}" class="card-img-top room-img w-100" style="height: 220px; object-fit: cover;" alt="Room Image">
                                        </a>
                                    </div>
                                    <div class="card-body d-flex flex-column text-center p-4">
                                        <small class="text-muted text-uppercase fw-bold mb-3" style="font-size: 0.75rem;">
                                            <i class="bi bi-people-fill me-1 text-secondary"></i> Sức chứa: <span th:text="${lp.soNguoi}"></span> người
                                        </small>
                                        <h5 class="card-title fw-bold mb-3">
                                            <a th:href="@{/rooms/detail/{id}(id=${lp.maLoai})}" class="text-decoration-none" style="color: var(--navy-color);" th:text="${lp.name}">Tên Loại Phòng</a>
                                        </h5>
                                        <p class="mb-4">
                                            <span class="fw-bold fs-5" style="color: #dc3545;" th:text="${#numbers.formatDecimal(lp.price, 0, 'COMMA', 0, 'POINT')}"></span>
                                            <small class="text-muted fw-normal ms-1">đ/ đêm</small>
                                        </p>
                                        <div class="mt-auto row g-2 align-items-stretch">
                                            <div class="col-6">
                                                <a th:href="@{/rooms/detail/{id}(id=${lp.maLoai})}" class="btn btn-outline-dark fw-bold w-100 h-100 d-flex align-items-center justify-content-center text-uppercase" style="border-radius: 4px; font-size: 0.85rem; min-height: 42px;">
                                                    Chi tiết
                                                </a>
                                            </div>
                                            <div class="col-6">
                                                <a th:href="@{/booking/book(maLoai=${lp.maLoai})}" class="btn btn-gold text-white fw-bold w-100 h-100 d-flex align-items-center justify-content-center text-uppercase" style="background-color: #C5A017; border: none; border-radius: 4px; font-size: 0.85rem; min-height: 42px;">
                                                    <i class="bi bi-calendar-check-fill me-1"></i> Đặt ngay
                                                </a>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div id="no-results" class="text-center py-5" th:if="${listPhong.isEmpty()}">
                            <i class="bi bi-search display-1 text-muted opacity-25"></i>
                            <h3 class="mt-3 text-muted">Không tìm thấy phòng phù hợp.</h3>
                            <a th:href="@{/rooms}" class="btn btn-outline-secondary mt-2" id="btn-clear-filter">Xóa bộ lọc</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom JS -->
    <script th:src="@{/js/list.js}"></script>
</div>
</body>
</html>
