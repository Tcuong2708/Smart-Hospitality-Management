spring.application.name=mayhotel

# Cau hinh bi mat nam ngoai repository.
# Tren VPS, dat MAYHOTEL_LOCAL_CONFIG thanh duong dan tuyet doi cua file chi user dich vu duoc doc.
spring.config.import=optional:file:${MAYHOTEL_LOCAL_CONFIG:D:/Document/KhoaLuanCuNhan/Projects/application.properties}

# Bảo đảm dữ liệu tiếng Việt không bị biến thành dấu hỏi trong HTTP và log.
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
logging.charset.console=UTF-8
logging.charset.file=UTF-8

# ==========================================
# MONGODB (Sử dụng URI và 127.0.0.1 để tránh lỗi phân giải DNS IPv6 gây delay 10-20s)
# ==========================================
spring.data.mongodb.uri=${MONGO_URI:mongodb://127.0.0.1:27017/MayHotelDB}

# Access token cho cac API mobile can phan quyen. Tren VPS phai dat MOBILE_JWT_SECRET.
mobile.auth.jwt-secret=${MOBILE_JWT_SECRET:}

# ==========================================
# Xác thực OTP dùng mật khẩu ứng dụng và email của Google
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# Cấu hình Đường dẫn AI API Server
# Dùng để Backend Java gọi qua AI kiểm tra CCCD, No-show
# ==========================================
ai.server.url=${AI_SERVER_URL:http://127.0.0.1:5000}
chatbot.internal.token=${CHATBOT_INTERNAL_TOKEN:}

# Identity verification: secrets must be provided through VPS environment variables.
identity.hash-pepper=${IDENTITY_HASH_PEPPER:}
identity.face-match-threshold=${FACE_MATCH_THRESHOLD:60}
nfc.demo.public-key-base64=${NFC_DEMO_PUBLIC_KEY_BASE64:}
mobile.identity.legacy-client-results-enabled=${MOBILE_IDENTITY_LEGACY_ENABLED:false}

# Tính năng tích hợp bên ngoài được tắt mặc định. Chỉ bật khi VPS đã cấp đủ biến môi trường.
app.features.vnpay.enabled=${VNPAY_ENABLED:false}
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNPAY_RETURN_URL:}
app.features.backup.enabled=${BACKUP_ENABLED:false}
app.features.backup.restore-enabled=${BACKUP_RESTORE_ENABLED:false}
app.backup.directory=${BACKUP_DIRECTORY:./backups}
app.backup.database=${BACKUP_DATABASE:MayHotelDB}

# ==========================================
# TỐI ƯU HÓA SERVER YẾU (1GB RAM) VÀ TĂNG TỐC TẢI TRANG
# ==========================================
# 1. Bật nén GZIP để giảm dung lượng tải xuống (Tải web nhanh hơn đáng kể)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# 2. Giới hạn số luồng (Threads) của Tomcat để tiết kiệm RAM
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=5
server.tomcat.max-connections=500
server.tomcat.accept-count=50

# 3. Bật Cache Thymeleaf (Tránh việc render lại HTML mỗi lần load gây tốn CPU)
spring.thymeleaf.cache=true

# 4. Khởi tạo trễ (Lazy Init) giúp giảm RAM tiêu thụ khi khởi động
spring.main.lazy-initialization=true

# 5. Tối ưu hóa Cache cho tài nguyên tĩnh (Static resources như CSS, JS, Image)
spring.web.resources.cache.period=31536000
spring.web.resources.cache.cachecontrol.max-age=31536000
spring.web.resources.cache.cachecontrol.must-revalidate=true

# 6. Tối ưu bộ đệm (Buffer) cho các truy vấn DB và Response HTTP
server.tomcat.max-http-form-post-size=2MB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Ngăn Tomcat giải ngược DNS gây treo 20s
server.tomcat.remote-ip-header=x-forwarded-for
server.tomcat.protocol-header=x-forwarded-proto
server.forward-headers-strategy=native

# ==========================================
# CẤU HÌNH PHIÊN ĐĂNG NHẬP (SESSION PERSISTENCE)
# Giúp giữ nguyên trạng thái đăng nhập khi khởi động lại ứng dụng
# ==========================================
server.servlet.session.persistent=true
server.servlet.session.store-dir=./session-data
