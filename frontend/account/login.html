<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập hệ thống - MAY HOTEL</title>
    <link rel="stylesheet" href="css/login.css" />

  <!-- CÁC FILE CSS ĐƯỢC CHÈN SẴN ĐỂ TRÁNH FOUC (FLASH OF UNSTYLED CONTENT) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../style.css" />
  <style>
    .navbar-nav .nav-link.active-menu {
      font-weight: 700 !important;
      color: #d4af37 !important; /* Màu vàng Gold */
      background-color: rgba(212, 175, 55, 0.1); /* Nền mờ */
      border-radius: 8px; /* Bo tròn góc */
      padding: 8px 16px !important; /* Tạo khoảng trống xung quanh chữ */
      transition: 0.3s all ease-in-out;
    }
  </style>

</head>
<body>

    <div class="login-wrapper fade-in-box">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-5">
                    <div class="card card-login shadow-lg border-0">

                        <div class="card-header-login text-center py-4 bg-navy text-white">
                            <h2 class="fw-bold">Đăng nhập</h2>
                            <p class="mb-0 small opacity-75">Chào mừng bạn trở lại với MAY HOTEL</p>
                        </div>

                        <div class="card-body p-4 p-md-5">

                            <div id="error-message" class="alert alert-danger text-center mb-4" role="alert" style="display: none;">
                                <i class="bi bi-exclamation-circle-fill me-2"></i>
                                <span>Thông báo lỗi ở đây</span>
                            </div>

                            <form id="login-form">

                                <div class="mb-3">
                                    <label class="form-label fw-bold text-navy">Email hoặc Số điện thoại <span class="text-danger">*</span></label>
                                    <input type="text" id="username" class="form-control form-control-lg"
                                           placeholder="Nhập email hoặc số điện thoại" required />
                                </div>

                                <div class="mb-4">
                                    <label class="form-label fw-bold text-navy">Mật khẩu</label>
                                    <input type="password" id="password" class="form-control form-control-lg"
                                           placeholder="Nhập mật khẩu" required />
                                </div>

                                <div class="form-check m-0">
                                    <input type="checkbox" class="form-check-input" id="rememberMe">
                                    <label class="form-check-label small text-navy fw-bold" for="rememberMe" style="cursor: pointer;">
                                        Ghi nhớ đăng nhập
                                    </label>
                                </div>

                                <div class="d-flex justify-content-end mb-3">
                                    <a href="find_account.html" class="small fw-bold text-decoration-none"
                                       style="color: #d4af37;">
                                        Quên mật khẩu?
                                    </a>
                                </div>

                                <button type="submit" class="btn btn-login w-100 py-3 fw-bold shadow-sm" id="btn-submit">
                                    <i class="bi bi-box-arrow-in-right me-2"></i> ĐĂNG NHẬP
                                </button>

                                <!-- Nút đăng nhập Google -->
                                <div class="d-flex align-items-center my-4">
                                    <hr class="flex-grow-1 border-secondary opacity-25">
                                    <span class="mx-3 text-secondary small fw-bold">HOẶC</span>
                                    <hr class="flex-grow-1 border-secondary opacity-25">
                                </div>

                                <button type="button" class="btn btn-outline-dark w-100 py-2 fw-bold d-flex justify-content-center align-items-center" id="btn-google-login" style="border-radius: 12px; transition: all 0.3s ease;">
                                    <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google Logo" style="width: 22px; height: 22px;" class="me-2">
                                    Đăng nhập bằng Google
                                </button>
                            </form>

                            <div class="login-footer text-center mt-4">
                                <p class="mb-1">Chưa có tài khoản? <a href="register.html" class="fw-bold">Đăng ký ngay</a></p>
                                <p class="mt-2">
                                    <a href="../index.html" class="small text-muted text-decoration-none">
                                        <i class="bi bi-arrow-left me-1"></i> Quay về trang chủ
                                    </a>
                                </p>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script src="../layout.js"></script>
<script src="../app.js"></script>
<script src="js/login.js"></script>
</body>
</html>
