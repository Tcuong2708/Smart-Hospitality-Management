<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiểm Thử API Phòng - MAY HOTEL</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/index.css" />

  <!-- CÁC FILE CSS ĐƯỢC CHÈN SẴN ĐỂ TRÁNH FOUC (FLASH OF UNSTYLED CONTENT) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../../style.css" />
  <style>
    .navbar-nav .nav-link.active-menu {
      font-weight: 700 !important;
      color: #d4af37 !important; /* Màu vàng Gold */
      background-color: rgba(212, 175, 55, 0.1); /* Nền mờ */
      border-radius: 8px; /* Bo tròn góc */
      padding: 8px 16px !important; /* Tạo khoảng trống xung quanh chữ */
      transition: 0.3s all ease-in-out;
    }
  </style>

</head>
<body>
    <div class="container py-5">
        <div class="card shadow-sm border-0 rounded-3 overflow-hidden mb-5 admin-card">
            <div class="admin-header d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
                <h3 class="fw-bold text-uppercase mb-0">
                    <i class="bi bi-code-slash me-2"></i>GIAO DIỆN KIỂM THỬ API PHÒNG
                </h3>
                <div class="d-flex gap-2">
                    <a href="http://localhost:8080/admin/api/rooms/json" target="_blank" class="btn btn-outline-light fw-bold px-3">
                        <i class="bi bi-filetype-json me-1"></i> Bấm Xem JSON Bản Thô
                    </a>
                    <button type="button" class="btn btn-gold px-4 shadow-sm text-white" style="background: #C5A017;" onclick="handleAddNewRoomPOST()">
                        <i class="bi bi-plus-circle-fill me-1"></i> Thêm Phòng (POST)
                    </button>
                </div>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-header-navy" style="background-color: #0F2942; color: white;">
                        <tr>
                            <th class="py-3 ps-4 text-uppercase small text-white" style="width: 120px;">Mã số (ID)</th>
                            <th class="text-uppercase small text-white">Tên phòng</th>
                            <th class="text-uppercase small text-white">Giá niêm yết / Đêm</th>
                            <th class="text-uppercase small text-white">Tên file ảnh</th>
                            <th class="text-center text-uppercase small text-white" style="width: 150px;">Trạng thái</th>
                            <th class="text-center text-uppercase small text-white" style="width: 200px;">Hành động (API)</th>
                        </tr>
                        </thead>
                        <tbody id="apiRoomTableBody">
                            <tr>
                                <td colspan="6" class="text-center py-5 text-muted">
                                    <div class="spinner-border spinner-border-sm text-warning me-2" role="status"></div>
                                    Hệ thống đang kết nối luồng API dữ liệu phòng...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom JS -->
    <script src="js/index.js"></script>
<script src="../../layout.js"></script>
<script src="../../app.js"></script>
</body>
</html>
