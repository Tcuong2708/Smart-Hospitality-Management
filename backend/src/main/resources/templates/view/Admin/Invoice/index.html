<div th:fragment="body_content" xmlns:th="http://www.thymeleaf.org" class="manager-page-shell receptionist-page">

    <div class="container-fluid py-4 manager-fill-page">
        <div id="alert-container"></div>

        <div class="card shadow-sm border-0 admin-card manager-fill-card receptionist-data-card">
            <div class="admin-header receptionist-page-header d-flex align-items-center">
                <h3 class="fw-bold text-uppercase text-white mb-0">
                    <i class="bi bi-receipt-cutoff me-2"></i>Quản lý hóa đơn
                </h3>
            </div>
            <div class="card-body p-0 manager-fill-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-header-navy" style="background-color: #0F2942; color: white;">
                        <tr>
                            <th class="py-3 text-center text-uppercase small text-white">Mã HĐ</th>
                            <th class="text-center text-uppercase small text-white">Khách hàng</th>
                            <th class="text-center text-uppercase small text-white">Ngày đặt</th>
                            <th class="text-center text-uppercase small text-white">Thời gian lưu trú</th>
                            <th class="text-center text-uppercase small text-white">Tổng tiền</th>
                            <th class="text-center text-uppercase small text-white">Trạng thái</th>
                            <th class="text-center text-uppercase small text-white">Thao tác</th>
                        </tr>
                        </thead>
                        <tbody id="invoice-table-body">
                            <tr>
                                <td colspan="7" class="text-center py-5 text-muted">
                                    <div class="spinner-border text-primary" role="status">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

<th:block th:fragment="extra_css">
<link rel="stylesheet" th:href="@{/css/Admin/Invoice/index.css(v=20261027-1)}" />
</th:block>
<th:block th:fragment="extra_js">
<script th:inline="javascript">
window.ADM_PAGE_MODULE = 'invoice';
window.mockInvoices = /*[[${invoices}]]*/ [];
</script>
<script th:src="@{/js/Admin/Invoice/index.js(v=20261027-1)}"></script>
</th:block>
</div>
