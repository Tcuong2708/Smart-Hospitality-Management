<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}">
<head>
    <title th:text="${pageTitle}">Cổng Thanh Toán - MAY HOTEL</title>
</head>
<body class="bg-light">

<th:block th:fragment="extra_css">
    <link rel="stylesheet" th:href="@{/frontend/home/booking/payment_gate.css}">
</th:block>

<div th:fragment="body_content">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-5">
                <div class="card shadow border-0 overflow-hidden" style="border-radius: 15px;">
                    <div class="card-header bg-navy text-white text-center py-3">
                        <h5 class="mb-0 fw-bold"><i class="bi bi-shield-lock-fill text-gold me-2"></i>Thanh toán trực tuyến An Toàn</h5>
                    </div>
                    <div class="card-body p-4 text-center">
                        <div class="mb-4">
                            <span class="badge bg-danger fs-6 mb-2 px-3 py-2" id="countdown">10:00</span>
                            <p class="text-muted small mt-2">Vui lòng quét mã QR để hoàn tất thanh toán.<br>Giao dịch sẽ tự động hủy nếu quá thời gian.</p>
                        </div>
                        
                        <div class="qr-box mx-auto mb-4">
                            <!-- Hiển thị QR Code có chứa Số Tiền động để mô phỏng chân thực hơn -->
                            <img loading="lazy" th:src="'https://api.vietqr.io/image/970415-0999999999-Ewv4X8M.jpg?amount=' + ${#numbers.formatDecimal(invoice.totalAmount, 0, 'NONE', 0, 'POINT')} + '&addInfo=MAYHOTEL' + ${invoice.id}" class="img-fluid rounded" alt="QR Code">
                        </div>

                        <div class="bg-light rounded p-3 text-start mb-4 border border-secondary-subtle">
                            <div class="d-flex justify-content-between mb-2">
                                <span class="text-muted">Mã đơn đặt:</span>
                                <span class="fw-bold">#[[${invoice.id}]]</span>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span class="text-muted">Chủ tài khoản:</span>
                                <span class="fw-bold">MAY HOTEL VN</span>
                            </div>
                            <div class="d-flex justify-content-between mt-3 pt-2 border-top">
                                <span class="text-muted">Số tiền:</span>
                                <span class="fw-bold text-danger fs-4" th:text="${#numbers.formatDecimal(invoice.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</span>
                            </div>
                        </div>

                        <form th:action="@{/booking/complete-online-payment}" method="post">
                            <input type="hidden" name="maHD" th:value="${invoice.id}" />
                            <button type="submit" id="btn-confirm-payment" class="btn btn-gold w-100 py-3 fw-bold text-uppercase shadow-sm">
                                <i class="bi bi-check-circle-fill me-2"></i>Đã thanh toán (Mô phỏng)
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block th:fragment="extra_js">
    <script>
        // Countdown Logic (Simulated)
        var time = 600; // 10 minutes
        setInterval(function() {
            time--;
            if(time <= 0) {
                alert("Hết thời gian giao dịch!");
                window.location.href = "/";
            } else {
                var min = Math.floor(time / 60);
                var sec = time % 60;
                document.getElementById('countdown').innerText = (min < 10 ? '0' : '') + min + ":" + (sec < 10 ? '0' : '') + sec;
            }
        }, 1000);
    </script>
</th:block>

</body>
</html>
