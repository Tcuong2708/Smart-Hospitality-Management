<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Chính Sách Tích Điểm - Bộ phận Quản lý</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../style.css" />
    <style>
      .navbar-nav .nav-link.active-menu { font-weight: 700 !important; color: #d4af37 !important; background-color: rgba(212, 175, 55, 0.1); border-radius: 8px; padding: 8px 16px !important; transition: 0.3s all ease-in-out; }
      .admin-card { background: white; border-radius: 8px; box-shadow: 0 5px 20px rgba(15,41,66,0.1); overflow: hidden; }
      .admin-header { background-color: var(--primary-color, #0F2942); color: white; padding: 20px 25px; border-bottom: 3px solid var(--accent-color, #C5A017); }
      .table-header-navy th { background-color: var(--primary-color, #0F2942) !important; color: white !important; border-bottom: 2px solid var(--accent-color, #C5A017) !important; padding: 15px 10px !important; text-transform: uppercase; font-size: 0.85rem; vertical-align: middle; }
    </style>
</head>
<body>

<div class="main-content">
    <div class="container py-5">
        <div class="card shadow-sm border-0 admin-card mb-4">
            <div class="admin-header d-flex justify-content-between align-items-center">
                <h3 class="fw-bold text-uppercase mb-0 text-white">
                    <i class="bi bi-star-fill me-2" style="color: var(--accent-color);"></i>Cấu hình Tích điểm & Thăng hạng
                </h3>
            </div>
            <div class="card-body p-4 bg-light">
                <div class="row text-center">
                    <div class="col-md-4">
                        <div class="p-4 bg-white rounded shadow-sm border-start border-4 border-warning">
                            <h5 class="fw-bold text-navy">Tỉ lệ quy đổi (Tích điểm)</h5>
                            <p class="fs-4 fw-bold text-danger mb-0">100.000 VNĐ = 1 Điểm</p>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="p-4 bg-white rounded shadow-sm border-start border-4 border-success">
                            <h5 class="fw-bold text-navy">Tỉ lệ thanh toán (Đổi điểm)</h5>
                            <p class="fs-4 fw-bold text-success mb-0">1 Điểm = 1.000 VNĐ</p>
                        </div>
                    </div>
                    <div class="col-md-4 d-flex align-items-center justify-content-center">
                        <button class="btn btn-lg btn-navy text-white fw-bold shadow-sm" style="background-color: var(--navy-color);"><i class="bi bi-gear-fill me-2"></i>Thay đổi quy định</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0 admin-card">
            <div class="admin-header d-flex flex-wrap justify-content-between align-items-center gap-3">
                <h4 class="fw-bold text-uppercase mb-0 text-white">
                    <i class="bi bi-award-fill me-2" style="color: var(--accent-color);"></i>Chính sách Hạng Thành Viên
                </h4>
                
                <div class="d-flex flex-wrap align-items-center gap-3 flex-grow-1 justify-content-end">
                    <div class="input-group shadow-sm" style="max-width: 250px;">
                        <span class="input-group-text bg-white border-0"><i class="bi bi-search text-muted"></i></span>
                        <input type="text" class="form-control border-0" id="searchLoyalty" placeholder="Tìm hạng...">
                    </div>

                    <a href="#" class="btn btn-gold px-4 shadow-sm text-white" data-bs-toggle="modal" data-bs-target="#loyaltyModal" style="background: #C5A017;">
                        <i class="bi bi-plus-circle-fill me-1"></i> Thêm Hạng
                    </a>
                </div>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-header-navy">
                        <tr>
                            <th class="text-center text-uppercase small text-white">
                                Hạng Thành Viên
                                <div class="dropdown d-inline-block ms-1">
                                    <i class="bi bi-funnel-fill text-warning" style="cursor: pointer;" data-bs-toggle="dropdown" data-bs-auto-close="outside" title="Lọc Tên Hạng"></i>
                                    <ul class="dropdown-menu p-2 shadow-sm text-dark" id="thFilterLoyaltyName" style="min-width: 200px; max-height: 250px; overflow-y: auto;">
                                        <!-- JS load -->
                                    </ul>
                                </div>
                            </th>
                            <th class="text-center text-uppercase small text-white">Điểm Yêu Cầu</th>
                            <th class="text-center text-uppercase small text-white">Quyền lợi nổi bật</th>
                            <th class="text-center text-uppercase small text-white">Trạng thái</th>
                            <th class="text-center text-uppercase small text-white">Thao tác</th>
                        </tr>
                        </thead>
                        <tbody id="table-body">
                            <tr>
                                <td colspan="5" class="text-center py-5 text-muted">
                                    <div class="spinner-border text-primary"></div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal Thêm/Cập nhật Hạng Thành Viên -->
<div class="modal fade" id="loyaltyModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-header text-white" style="background-color: #0F2942; border-bottom: 4px solid #C5A017; border-top-left-radius: calc(0.3rem - 1px); border-top-right-radius: calc(0.3rem - 1px);">
                <h5 class="modal-title fw-bold text-uppercase d-flex align-items-center" style="letter-spacing: 1px;">
                    <span class="d-inline-flex justify-content-center align-items-center me-2" style="background-color: #C5A017; color: #0F2942; width: 24px; height: 24px; border-radius: 4px; font-size: 18px; font-weight: 900; line-height: 1;">+</span>
                    <span id="loyaltyModalTitle">Thêm Hạng Thành Viên</span>
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <form id="loyaltyForm">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Tên Hạng Thành Viên <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="form-loyalty-name" placeholder="VD: Hạng Vàng (Gold)" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Mức Điểm Yêu Cầu <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="form-loyalty-points" placeholder="VD: 5000 - 9999" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Quyền Lợi Nổi Bật</label>
                        <textarea class="form-control" id="form-loyalty-perks" rows="3" placeholder="Mô tả các quyền lợi của hạng thẻ này..."></textarea>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Màu Sắc Thẻ</label>
                            <select class="form-select" id="form-loyalty-color">
                                <option value="bg-secondary">Màu Đồng / Xám (Secondary)</option>
                                <option value="bg-info">Màu Bạc (Info)</option>
                                <option value="bg-warning text-dark">Màu Vàng (Warning)</option>
                                <option value="bg-primary">Màu Xanh / Kim cương (Primary)</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Trạng Thái</label>
                            <select class="form-select" id="form-loyalty-status">
                                <option value="Áp dụng">Áp dụng</option>
                                <option value="Ngưng áp dụng">Ngưng áp dụng</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer bg-light border-top-0">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                <button type="button" class="btn btn-gold text-white fw-bold px-4" id="btn-save-loyalty" style="background: #C5A017;">Lưu Thông Tin</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="index.js"></script>
<script src="../../layout.js"></script>
<script src="../../app.js"></script>
</body>
</html>
