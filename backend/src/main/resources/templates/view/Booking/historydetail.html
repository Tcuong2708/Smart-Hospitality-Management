<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}">
<head>
    <title th:text="${pageTitle}">Chi Tiết Đơn - MAY HOTEL</title>
</head>
<body class="bg-light">

<th:block th:fragment="extra_css">
    <link rel="stylesheet" th:href="@{/frontend/home/booking/history.css}">
</th:block>

<div th:fragment="body_content">
    <div class="container py-5">
        <a th:href="@{/booking/history}" class="text-decoration-none text-muted mb-4 d-inline-block">
            <i class="bi bi-arrow-left me-1"></i> Trở về Lịch sử
        </a>

        <div class="card shadow-sm border-0 p-4 p-md-5 mx-auto" style="max-width: 800px; border-radius: 15px;">
            <div id="detail-content">
                <div class="text-center border-bottom pb-4 mb-4">
                    <h3 class="fw-bold text-navy text-uppercase mb-2">Chi Tiết Đơn Đặt Phòng</h3>
                    <div class="text-muted fs-5">Mã số: <span class="fw-bold text-dark">#[[${hoaDon.id}]]</span></div>
                    
                    <div class="mt-3">
                        <span th:if="${hoaDon.invoiceStatus == 'Reserved' && hoaDon.isPaid == false}" class="badge bg-warning text-dark px-3 py-2 fs-6 rounded-pill"><i class="bi bi-hourglass-split me-1"></i>Chờ nhận phòng</span>
                        <span th:if="${hoaDon.invoiceStatus == 'Reserved' && hoaDon.isPaid == true}" class="badge bg-info text-dark px-3 py-2 fs-6 rounded-pill"><i class="bi bi-check2-circle me-1"></i>Đã thanh toán Online</span>
                        <span th:if="${hoaDon.invoiceStatus == 'Completed'}" class="badge bg-success px-3 py-2 fs-6 rounded-pill"><i class="bi bi-check-circle me-1"></i>Hoàn thành</span>
                        <span th:if="${hoaDon.invoiceStatus == 'Cancelled'}" class="badge bg-secondary px-3 py-2 fs-6 rounded-pill"><i class="bi bi-x-circle me-1"></i>Đã hủy</span>
                    </div>
                </div>

                <div class="row g-4 mb-4">
                    <div class="col-md-6">
                        <h6 class="fw-bold text-navy border-bottom pb-2 mb-3">Thông tin Khách Hàng</h6>
                        <div class="small text-muted mb-2">Họ tên: <strong class="text-dark" th:text="${hoaDon.guestName}"></strong></div>
                        <div class="small text-muted mb-2">SĐT: <strong class="text-dark" th:text="${hoaDon.phone}"></strong></div>
                        <div class="small text-muted mb-2">Ngày đặt: <strong class="text-dark" th:text="${#dates.format(hoaDon.bookedAt, 'dd/MM/yyyy HH:mm')}"></strong></div>
                    </div>
                    <div class="col-md-6">
                        <h6 class="fw-bold text-navy border-bottom pb-2 mb-3">Thông tin Lưu Trú</h6>
                        <div class="small text-muted mb-2">Phòng: 
                            <strong class="text-dark" th:if="${phong != null}" th:text="${phong.name}"></strong>
                            <strong class="text-dark" th:unless="${phong != null}">Không xác định</strong>
                        </div>
                        <div class="small text-muted mb-2">Ngày nhận: <strong class="text-dark" th:text="${#dates.format(hoaDon.checkInDate, 'dd/MM/yyyy')}"></strong></div>
                        <div class="small text-muted mb-2">Ngày trả: <strong class="text-dark" th:text="${#dates.format(hoaDon.checkOutDate, 'dd/MM/yyyy')}"></strong></div>
                    </div>
                </div>

                <div class="bg-light p-3 rounded mb-4 border border-secondary-subtle">
                    <h6 class="fw-bold text-navy mb-3">Ghi chú & Yêu cầu đặc biệt</h6>
                    <p class="small text-muted m-0 fst-italic lh-lg" th:text="${hoaDon.note != null && !hoaDon.note.isEmpty() ? hoaDon.note : 'Không có ghi chú.'}"></p>
                </div>

                <div class="d-flex justify-content-between align-items-center border-top pt-4">
                    <span class="text-muted fw-bold">TỔNG TIỀN THANH TOÁN:</span>
                    <span class="fs-3 fw-bold text-danger" th:text="${#numbers.formatDecimal(hoaDon.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</span>
                </div>
                
                <div class="text-end mt-2">
                    <small class="text-muted">Phương thức: <span class="fw-bold text-navy" th:text="${hoaDon.paymentMethod == 'ONLINE' ? 'Thanh toán trực tuyến' : 'Thanh toán tại quầy'}"></span></small>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block th:fragment="extra_js">
</th:block>

</body>
</html>
