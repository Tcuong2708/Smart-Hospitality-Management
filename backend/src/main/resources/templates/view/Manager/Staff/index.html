<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<th:block th:fragment="extra_css"><style>
.staff-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}.staff-summary article{background:#fff;border:1px solid #e2e7ec;border-radius:10px;padding:17px 20px;box-shadow:0 4px 14px rgba(15,41,66,.06)}.staff-summary span{display:block;color:#70808d;font-size:.78rem;font-weight:700;text-transform:uppercase}.staff-summary strong{font-size:1.65rem;color:#0f2942}.staff-table td{vertical-align:middle}.staff-table small{display:block;color:#7d8993}.staff-page .admin-card{background:#fff;border-radius:10px;box-shadow:0 5px 20px rgba(15,41,66,.08);overflow:hidden}.staff-page .admin-header{background:#0f2942;border-bottom:3px solid #c5a017;padding:18px 22px}.staff-page .modal-dialog{max-width:760px}@media(max-width:700px){.staff-summary{grid-template-columns:1fr}.staff-page .admin-header{align-items:stretch!important}.staff-page .admin-header>div{width:100%}}
</style></th:block>
</head>
<body>
<div th:fragment="body_content" class="manager-page-shell">
<div class="container py-4 staff-page manager-fill-page">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show"><span th:text="${success}"></span><button class="btn-close" data-bs-dismiss="alert"></button></div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show"><span th:text="${error}"></span><button class="btn-close" data-bs-dismiss="alert"></button></div>
    <div class="staff-summary">
        <article><span>Tổng nhân viên</span><strong th:text="${staffs.size()}"></strong></article>
        <article><span>Đang hoạt động</span><strong th:text="${#lists.size(staffs.?[status == 1])}"></strong></article>
        <article><span>Tài khoản bị khóa</span><strong th:text="${#lists.size(staffs.?[status != 1])}"></strong></article>
    </div>
    <div class="admin-card manager-fill-card">
        <div class="admin-header d-flex justify-content-between align-items-center gap-3 flex-wrap">
            <h3 class="m-0 text-white fw-bold text-uppercase"><i class="bi bi-person-vcard-fill me-2 text-warning"></i>Quản lý nhân viên</h3>
            <div class="d-flex gap-2 flex-wrap">
                <div class="input-group" style="width:280px"><span class="input-group-text bg-white"><i class="bi bi-search"></i></span><input id="search-input" class="form-control" placeholder="Tìm tên, bộ phận, số điện thoại"></div>
                <button class="btn btn-gold" id="btnCreate"><i class="bi bi-person-plus-fill me-1"></i>Thêm nhân viên</button>
            </div>
        </div>
        <div class="table-responsive manager-fill-body">
            <table class="table table-hover mb-0 staff-table">
                <thead class="table-dark"><tr><th class="text-center">Mã</th><th>Nhân viên</th><th>Bộ phận</th><th>Liên hệ</th><th class="text-end">Lương cơ bản</th><th class="text-center">Trạng thái</th><th class="text-center">Thao tác</th></tr></thead>
                <tbody>
                <tr th:if="${staffs.isEmpty()}"><td colspan="7" class="text-center py-5 text-muted">Chưa có nhân viên</td></tr>
                <tr th:each="nv : ${staffs}" class="staff-row">
                    <td class="text-center fw-bold" th:text="${nv.id}"></td>
                    <td><strong class="staff-name" th:text="${nv.name}"></strong><small th:text="${nv.username}"></small></td>
                    <td><span class="badge bg-info text-dark staff-dept" th:text="${nv.dept}"></span></td>
                    <td><span class="staff-phone" th:text="${nv.phone}"></span><small th:text="${nv.email}"></small></td>
                    <td class="text-end fw-bold" th:text="${#numbers.formatDecimal(nv.salary,0,'COMMA',0,'POINT')} + ' đ'"></td>
                    <td class="text-center"><span class="badge rounded-pill" th:classappend="${nv.status == 1 ? 'bg-success':'bg-secondary'}" th:text="${nv.status == 1 ? 'Hoạt động':'Bị khóa'}"></span></td>
                    <td class="text-center text-nowrap">
                        <button type="button" class="btn btn-action btn-edit"
                                th:attr="data-id=${nv.id},data-name=${nv.name},data-phone=${nv.phone},data-email=${nv.email},data-position=${nv.dept},data-salary=${nv.salary},data-role=${nv.roleId}"><i class="bi bi-pencil"></i></button>
                        <form class="d-inline" th:action="@{/manager/staff/{id}/status(id=${nv.id})}" method="post"><button class="btn btn-action" th:classappend="${nv.status == 1 ? 'btn-state-locked' : 'btn-state-active'}" title="Khóa/Mở khóa"><i class="bi" th:classappend="${nv.status == 1 ? 'bi-lock-fill' : 'bi-unlock-fill'}"></i></button></form>
                        <form class="d-inline" th:action="@{/manager/staff/{id}/delete(id=${nv.id})}" method="post" onsubmit="return confirm('Xóa nhân viên này?')"><button class="btn btn-action btn-delete"><i class="bi bi-trash"></i></button></form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="employeeModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content border-0 shadow-lg">
    <div class="modal-header text-white" style="background:#0f2942;border-bottom:4px solid #c5a017"><h5 class="modal-title fw-bold" id="employeeModalTitle">Thêm nhân viên</h5><button class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
    <form id="employeeForm" method="post" th:action="@{/manager/staff/create}"><input type="hidden" name="id" id="form-id">
        <div class="modal-body p-4"><div class="row g-3">
            <div class="col-md-6"><label class="form-label fw-bold">Họ và tên *</label><input name="fullName" id="form-name" class="form-control" maxlength="100" required></div>
            <div class="col-md-6"><label class="form-label fw-bold">Số điện thoại *</label><input name="phone" id="form-phone" class="form-control" pattern="\+?[0-9]{9,15}" required></div>
            <div class="col-md-6"><label class="form-label fw-bold">Email *</label><input type="email" name="email" id="form-email" class="form-control" required></div>
            <div class="col-md-6"><label class="form-label fw-bold">Chức vụ/Bộ phận *</label><input name="position" id="form-position" class="form-control" maxlength="100" required></div>
            <div class="col-md-6"><label class="form-label fw-bold">Lương cơ bản *</label><input type="number" name="baseSalary" id="form-salary" class="form-control" min="0" max="1000000000" value="0" required></div>
            <div class="col-md-6"><label class="form-label fw-bold">Vai trò *</label><select name="roleId" id="form-role" class="form-select" required><option value="3">Lễ tân</option><option value="4">Buồng phòng</option><option value="6">Nhân viên dịch vụ</option><option value="7">Kế toán</option></select></div>
            <div class="col-md-6 create-only"><label class="form-label fw-bold">Tên đăng nhập *</label><input name="username" id="form-username" class="form-control" minlength="4" maxlength="50"></div>
            <div class="col-md-6"><label class="form-label fw-bold">Mật khẩu <span class="create-only">*</span></label><input type="password" name="password" id="form-password" class="form-control" minlength="8"><small class="text-muted edit-only d-none">Để trống nếu không đổi mật khẩu.</small></div>
        </div></div>
        <div class="modal-footer bg-light"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button><button type="submit" class="btn btn-gold">Lưu thông tin</button></div>
    </form>
</div></div></div>
</div>
<th:block th:fragment="extra_js"><script>
document.addEventListener('DOMContentLoaded',()=>{
 const modalEl=document.getElementById('employeeModal'), modal=new bootstrap.Modal(modalEl), form=document.getElementById('employeeForm');
 const field=id=>document.getElementById(id);
 function createMode(){form.reset();field('form-id').value='';form.action='/manager/staff/create';field('employeeModalTitle').textContent='Thêm nhân viên';field('form-username').required=true;field('form-password').required=true;document.querySelectorAll('.create-only').forEach(e=>e.classList.remove('d-none'));document.querySelectorAll('.edit-only').forEach(e=>e.classList.add('d-none'));modal.show()}
 document.getElementById('btnCreate').addEventListener('click',createMode);
 document.querySelectorAll('.btn-edit').forEach(btn=>btn.addEventListener('click',()=>{form.reset();form.action='/manager/staff/edit';field('employeeModalTitle').textContent='Cập nhật nhân viên';field('form-id').value=btn.dataset.id;field('form-name').value=btn.dataset.name||'';field('form-phone').value=btn.dataset.phone||'';field('form-email').value=btn.dataset.email||'';field('form-position').value=btn.dataset.position||'';field('form-salary').value=btn.dataset.salary||0;field('form-role').value=btn.dataset.role||3;field('form-username').required=false;field('form-password').required=false;document.querySelectorAll('.create-only').forEach(e=>e.classList.add('d-none'));document.querySelectorAll('.edit-only').forEach(e=>e.classList.remove('d-none'));modal.show()}));
 document.getElementById('search-input').addEventListener('input',e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('.staff-row').forEach(row=>row.style.display=row.innerText.toLowerCase().includes(q)?'':'none')});
});
</script></th:block>
</body></html>
