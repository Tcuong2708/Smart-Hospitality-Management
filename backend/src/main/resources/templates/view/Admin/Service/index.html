<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:fragment="extra_css">
        <style>
            .admin-card {
                border-radius: 8px;
                box-shadow: 0 5px 20px rgba(15, 41, 66, 0.1);
                overflow: hidden;
                border: 0;
            }
        </style>
    </th:block>
</head>
<body>
<div th:fragment="body_content">
    <div class="container py-4">
        <!-- Alert -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="card border-0 shadow-sm admin-card">
            <!-- Header mới được cải tiến từ frontend -->
            <div class="admin-header d-flex flex-wrap justify-content-between align-items-center gap-3 p-3" style="background-color: #0F2942; border-bottom: 3px solid #C5A017;">
                <h3 class="fw-bold text-uppercase mb-0 text-white" style="letter-spacing: 1px;">
                    <i class="bi bi-briefcase-fill me-2" style="color: #C5A017;"></i>Danh sách Dịch vụ
                </h3>
                
                <div class="d-flex flex-wrap align-items-center gap-3 flex-grow-1 justify-content-end">
                    <div class="input-group shadow-sm" style="max-width: 250px;">
                        <span class="input-group-text bg-white border-0"><i class="bi bi-search text-muted"></i></span>
                        <input type="text" class="form-control border-0" id="searchService" placeholder="Tìm dịch vụ..." onkeyup="filterServiceTable()">
                    </div>

                    <a href="#" data-bs-toggle="modal" data-bs-target="#serviceModal" class="btn px-4 shadow-sm text-white" style="background: #C5A017; font-weight: 600;">
                        <i class="bi bi-plus-circle me-2"></i>Thêm dịch vụ mới
                    </a>
                </div>
            </div>
            
            <div class="card-body p-0">
                <div class="table-responsive" style="background-color: #fff;">
                    <table class="table table-hover align-middle mb-0" id="serviceTable">
                        <thead class="table-header-navy" style="background-color: #0F2942; color: white;">
                        <tr>
                            <th class="py-3 text-center text-uppercase small text-white fw-bold">Mã Dịch vụ</th>
                            <th class="text-center text-uppercase small text-white fw-bold">Tên Dịch vụ <i class="bi bi-funnel-fill text-warning ms-1"></i></th>
                            <th class="text-center text-uppercase small text-white fw-bold">Đơn giá</th>
                            <th class="text-center text-uppercase small text-white fw-bold">Đơn vị tính</th>
                            <th class="text-center text-uppercase small text-white fw-bold" style="width: 150px;">Thao tác</th>
                        </tr>
                        </thead>
                        <tbody id="service-table-body">
                            <tr th:if="${services == null or services.isEmpty()}">
                                <td colspan="5" class="text-center py-5 text-muted">Không có dữ liệu.</td>
                            </tr>
                            <tr th:each="s : ${services}" class="service-row">
                                <td class="text-center fw-bold text-secondary" th:text="${s.id}"></td>
                                <td class="text-center fw-bold service-name" style="color: #0F2942;" th:text="${s.name}"></td>
                                <td class="text-center text-danger fw-bold" th:text="${#numbers.formatDecimal(s.price, 0, 'COMMA', 0, 'POINT') + ' VNĐ'}"></td>
                                <td class="text-center text-muted" th:text="${s.unit}"></td>
                                <td class="text-center">
                                    <a href="#" data-bs-toggle="modal" th:data-bs-target="'#editModal' + ${s.id}" class="btn btn-sm btn-warning text-white shadow-sm" title="Sửa"><i class="bi bi-pencil"></i></a>
                                    <a href="#" data-bs-toggle="modal" th:data-bs-target="'#deleteModal' + ${s.id}" class="btn btn-sm btn-danger shadow-sm ms-1" title="Xóa"><i class="bi bi-trash"></i></a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Modals cho từng hàng (Sửa, Xóa) -->
    <th:block th:each="s : ${services}">
        <!-- Delete Modal -->
        <div class="modal fade" th:id="'deleteModal' + ${s.id}" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content border-0 shadow-lg">
                    <div class="modal-header text-white bg-danger border-0">
                        <h5 class="modal-title fw-bold"><i class="bi bi-exclamation-triangle-fill me-2"></i>Xác Nhận Xóa</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body p-4 text-center">
                        <p class="fs-5 mb-1">Bạn có chắc chắn muốn xóa dịch vụ này?</p>
                        <p class="text-danger fw-bold fs-4 mb-0" th:text="${s.name}"></p>
                    </div>
                    <div class="modal-footer bg-light border-0 justify-content-center">
                        <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">Hủy</button>
                        <a th:href="@{/manager/services/delete/{id}(id=${s.id})}" class="btn btn-danger px-4 fw-bold">Xóa Ngay</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Edit Modal -->
        <div class="modal fade" th:id="'editModal' + ${s.id}" tabindex="-1">
            <div class="modal-dialog modal-lg modal-dialog-centered">
                <div class="modal-content border-0 shadow-lg">
                    <div class="modal-header text-white" style="background-color: #0F2942; border-bottom: 4px solid #C5A017;">
                        <h5 class="modal-title fw-bold text-uppercase d-flex align-items-center" style="letter-spacing: 1px;">
                            <i class="bi bi-pencil-square me-2" style="color: #C5A017;"></i> Sửa Dịch Vụ: <span th:text="${s.name}" class="ms-1"></span>
                        </h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <form th:action="@{/manager/services/edit}" method="post">
                        <input type="hidden" name="id" th:value="${s.id}" />
                        <div class="modal-body p-4">
                            <div class="row g-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Tên Dịch Vụ <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" name="name" th:value="${s.name}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Đơn Giá (VNĐ) <span class="text-danger">*</span></label>
                                    <input type="number" class="form-control" name="price" th:value="${s.price}" required min="0">
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-bold">Đơn Vị Tính <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" name="unit" th:value="${s.unit}" required>
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer bg-light border-top-0">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                            <button type="submit" class="btn btn-gold text-white fw-bold px-4" style="background: #C5A017; border:none;">Cập Nhật</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </th:block>

    <!-- Modal Thêm/Cập nhật Service -->
    <div class="modal fade" id="serviceModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header text-white" style="background-color: #0F2942; border-bottom: 4px solid #C5A017; border-top-left-radius: calc(0.3rem - 1px); border-top-right-radius: calc(0.3rem - 1px);">
                    <h5 class="modal-title fw-bold text-uppercase d-flex align-items-center" style="letter-spacing: 1px;">
                        <span class="d-inline-flex justify-content-center align-items-center me-2" style="background-color: #C5A017; color: #0F2942; width: 24px; height: 24px; border-radius: 4px; font-size: 18px; font-weight: 900; line-height: 1;">+</span>
                        <span id="serviceModalTitle">Thêm Dịch Vụ Mới</span>
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form th:action="@{/manager/services/create}" method="post" th:object="${serviceObj}">
                    <div class="modal-body p-4">
                        <div class="row g-4">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Tên Dịch Vụ <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" th:field="*{name}" required placeholder="Ví dụ: Giặt là">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Đơn Giá (VNĐ) <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" th:field="*{price}" required placeholder="Ví dụ: 50000" min="0">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Đơn Vị Tính <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" th:field="*{unit}" required placeholder="Ví dụ: Lần, Chiếc, Bữa...">
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer bg-light border-top-0">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="submit" class="btn btn-gold text-white fw-bold px-4" style="background: #C5A017; border:none;">Lưu Thông Tin</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- JS script -->
    <script>
        function filterServiceTable() {
            let input = document.getElementById("searchService").value.toLowerCase();
            let rows = document.querySelectorAll(".service-row");
            
            rows.forEach(row => {
                let name = row.querySelector(".service-name").innerText.toLowerCase();
                if (name.includes(input)) {
                    row.style.display = "";
                } else {
                    row.style.display = "none";
                }
            });
        }
        
        // Fix z-index modal for all modals
        (function() {
            const modals = document.querySelectorAll('.modal');
            modals.forEach(modal => {
                if (modal) {
                    document.body.appendChild(modal);
                }
            });
        })();
    </script>
</div>
</body>
</html>
