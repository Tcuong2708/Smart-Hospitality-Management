<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sao lưu Phục hồi - May Hotel</title>
</head>
<body>
<div th:fragment="body_content">
    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold text-uppercase" style="color: var(--navy-color);">
                <i class="bi bi-database-down me-2 text-gold"></i>Sao Lưu & Phục Hồi
            </h3>
        </div>

        <div class="card shadow-sm border-0 admin-card">
            <div class="card-body p-5 text-center">
                <i class="bi bi-cloud-check display-1 text-success mb-3 d-block"></i>
                <h4 class="fw-bold text-navy">Hệ thống Backup tự động đang hoạt động tốt</h4>
                <p class="text-muted">Tính năng sao lưu thủ công sẽ được cung cấp trong phiên bản nâng cấp tiếp theo.</p>
                <button class="btn btn-gold mt-3 px-4 shadow-sm text-white" style="background: #C5A059;">
                    <i class="bi bi-cloud-arrow-down-fill me-1"></i> Tải bản sao lưu gần nhất
                </button>
            </div>
        </div>
    </div>
</div>
</body>
</html>
