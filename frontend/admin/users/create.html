<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm Người Dùng</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="admin-user-form.css">
    <style>
        .btn-gold { background: #C5A059; color: white; border: none; }
        .btn-gold:hover { background: #A68546 !important; color: white; }
        .form-label { font-weight: 500; color: #444; }
    </style>

  <!-- CÁC FILE CSS ĐƯỢC CHÈN SẴN ĐỂ TRÁNH FOUC (FLASH OF UNSTYLED CONTENT) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../../style.css" />
  <style>
    .navbar-nav .nav-link.active-menu {
      font-weight: 700 !important;
      color: #d4af37 !important; /* Màu vàng Gold */
      background-color: rgba(212, 175, 55, 0.1); /* Nền mờ */
      border-radius: 8px; /* Bo tròn góc */
      padding: 8px 16px !important; /* Tạo khoảng trống xung quanh chữ */
      transition: 0.3s all ease-in-out;
    }
  </style>

</head>
<body>

<div class="main-content">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 admin-card-custom shadow-sm p-0" style="background: white; border-radius: 15px; overflow: hidden;">

                <div class="admin-header-navy" style="background: #003366; color: white; padding: 20px;">
                    <h3 class="fw-bold text-uppercase mb-0 text-center">Thêm Người Dùng Mới</h3>
                </div>

                <form onsubmit="event.preventDefault(); window.location.href='index.html';" class="card-body p-4">
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Tên đăng nhập</label>
                            <input type="text" id="tenDangNhap" class="form-control" required />
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Mật khẩu</label>
                            <input type="password" id="matKhau" class="form-control" required />
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Họ và tên</label>
                            <input type="text" id="hoTen" class="form-control" required />
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Vai trò</label>
                            <select id="roleID" class="form-select">
                                <option value="1">Quản Trị Viên</option>
                                <option value="2">Nhân Viên</option>
                                <option value="3" selected>Khách Hàng</option>
                            </select>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Số điện thoại</label>
                            <input type="text" id="soDienThoai" class="form-control" />
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Quốc tịch</label>
                            <input type="text" id="quocTich" class="form-control" />
                        </div>

                        <div class="col-md-12 mb-3">
                            <label class="form-label">Địa chỉ</label>
                            <textarea id="diaChi" class="form-control" rows="2"></textarea>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between mt-4 pt-3 border-top">
                        <a href="index.html" class="btn btn-outline-secondary px-4">Quay lại</a>
                        <button type="submit" class="btn btn-gold px-4 shadow-sm text-white">THÊM MỚI</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Layout chung -->
<script src="../../layout.js"></script>
<script src="../../app.js"></script>
</body>
</html>
