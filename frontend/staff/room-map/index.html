<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sơ Đồ Phòng Nghỉ Trực Quan - MAY HOTEL</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/index.css" />

  <!-- CÁC FILE CSS ĐƯỢC CHÈN SẴN ĐỂ TRÁNH FOUC (FLASH OF UNSTYLED CONTENT) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../../style.css" />
  <style>
    .navbar-nav .nav-link.active-menu {
      font-weight: 700 !important;
      color: #d4af37 !important; /* Màu vàng Gold */
      background-color: rgba(212, 175, 55, 0.1); /* Nền mờ */
      border-radius: 8px; /* Bo tròn góc */
      padding: 8px 16px !important; /* Tạo khoảng trống xung quanh chữ */
      transition: 0.3s all ease-in-out;
    }
  </style>

</head>
<body>
    <div class="container-fluid py-4">
        <div class="admin-card mb-4">
            <div class="admin-header d-flex justify-content-between align-items-center">
                <h3 class="fw-bold text-uppercase mb-0">
                    <i class="bi bi-grid-3x3-gap-fill me-2"></i>Sơ đồ phòng nghỉ trực quan
                </h3>
                <a href="../../admin/check-in/index.html" class="btn btn-gold px-4 shadow-sm text-white" style="background: #C5A017;">
                    <i class="bi bi-journal-bookmark-fill me-2"></i>Xem danh sách Chờ Check-in
                </a>
            </div>
            
            <div class="card-body p-4">
                <div class="d-flex gap-4 p-3 bg-white rounded shadow-sm border mb-4" style="font-size: 0.9rem;">
                    <span class="fw-bold"><i class="bi bi-square-fill text-success me-1"></i>Phòng trống</span>
                    <span class="fw-bold"><i class="bi bi-square-fill text-danger me-1"></i>Đang ở (Check-in)</span>
                    <span class="fw-bold"><i class="bi bi-square-fill text-warning me-1"></i>Chờ dọn dẹp (Sau Check-out)</span>
                </div>

                <div id="loading-spinner" class="text-center py-5">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="text-muted mt-2">Đang tải sơ đồ phòng...</p>
                </div>

                <div id="room-map-container">
                    <!-- Room map structured by floors will be rendered here by JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/index.js"></script>
<script src="../../layout.js"></script>
<script src="../../app.js"></script>
</body>
</html>
