<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:fragment="extra_css">
        <style>
            .admin-card {
                border-radius: 8px;
                box-shadow: 0 5px 20px rgba(15, 41, 66, 0.1);
                overflow: hidden;
                border: 0;
            }
            .table-header-navy th { 
                background-color: var(--primary-color, #0F2942) !important; 
                color: white !important; 
                border-bottom: 2px solid var(--accent-color, #C5A017) !important; 
                padding: 15px 10px !important; 
                text-transform: uppercase; 
                font-size: 0.85rem; 
                vertical-align: middle; 
            }
        </style>
    </th:block>
</head>
<body>
<div th:fragment="body_content">
    <div class="container py-4">
        <!-- Alert -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Thông số cấu hình chung -->
        <div class="card shadow-sm border-0 admin-card mb-4">
            <div class="admin-header d-flex justify-content-between align-items-center p-3" style="background-color: #0F2942; border-bottom: 3px solid #C5A017;">
                <h4 class="fw-bold text-uppercase mb-0 text-white">
                    <i class="bi bi-star-fill me-2" style="color: #C5A017;"></i>Cấu hình Tích điểm & Thăng hạng
                </h4>
            </div>
            <div class="card-body p-4 bg-light">
                <form th:action="@{/manager/loyalty/update}" method="post">
                    <div class="row mb-3">
                        <div class="col-md-3">
                            <label class="form-label fw-bold">Tỉ lệ Tích điểm (VNĐ = 1 điểm)</label>
                            <input type="number" class="form-control" name="moneyPerPoint" th:value="${policy.moneyPerPoint}" required min="1">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold text-secondary">Mốc lên Bạc (điểm)</label>
                            <input type="number" class="form-control" name="silverThreshold" th:value="${policy.silverThreshold}" required min="0">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold text-warning">Mốc lên Vàng (điểm)</label>
                            <input type="number" class="form-control" name="goldThreshold" th:value="${policy.goldThreshold}" required min="0">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold text-info">Mốc lên Bạch Kim (điểm)</label>
                            <input type="number" class="form-control" name="platinumThreshold" th:value="${policy.platinumThreshold}" required min="0">
                        </div>
                    </div>
                    <div class="text-end">
                        <button type="submit" class="btn btn-gold fw-bold text-white shadow-sm" style="background-color: #C5A017;">
                            <i class="bi bi-save me-1"></i> Cập nhật Thông số & Phân hạng lại
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Danh sách khách hàng và điểm -->
        <div class="admin-card">
            <div class="admin-header d-flex justify-content-between align-items-center gap-3 p-3" style="background-color: #0F2942; border-bottom: 3px solid #C5A017;">
                <h4 class="fw-bold text-uppercase mb-0 text-white" style="letter-spacing: 1px;">
                    <i class="bi bi-people-fill me-2" style="color: #C5A017;"></i>Tra cứu Hạng Khách Hàng
                </h4>
            </div>

            <div class="table-responsive" style="min-height: 400px; background-color: #fff;">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-header-navy">
                    <tr>
                        <th class="py-3 text-center">ID</th>
                        <th>Họ Tên</th>
                        <th>SĐT</th>
                        <th class="text-center">Điểm Tích Lũy</th>
                        <th class="text-center">Hạng Hiện Tại</th>
                    </tr>
                    </thead>
                    <tbody>
                        <tr th:each="cus : ${customers}">
                            <td class="text-center fw-bold text-muted" th:text="${cus.id}">1</td>
                            <td class="fw-bold text-navy" th:text="${cus.fullName}">Nguyễn Văn A</td>
                            <td th:text="${cus.phone}">0912345678</td>
                            <td class="text-center fw-bold text-success" th:text="${cus.points != null ? cus.points : 0}">150</td>
                            <td class="text-center">
                                <span th:if="${cus.tierId == 4}" class="badge bg-info text-dark px-3 py-2 rounded-pill"><i class="bi bi-gem me-1"></i>Bạch Kim</span>
                                <span th:if="${cus.tierId == 3}" class="badge bg-warning text-dark px-3 py-2 rounded-pill"><i class="bi bi-star-fill me-1"></i>Vàng</span>
                                <span th:if="${cus.tierId == 2}" class="badge bg-secondary px-3 py-2 rounded-pill"><i class="bi bi-shield-fill me-1"></i>Bạc</span>
                                <span th:if="${cus.tierId == null or cus.tierId == 1}" class="badge bg-light text-dark border px-3 py-2 rounded-pill">Đồng</span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(customers)}">
                            <td colspan="5" class="text-center py-5 text-muted">
                                <i class="bi bi-inbox fs-1 d-block mb-3 opacity-50"></i>
                                Chưa có dữ liệu khách hàng.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
