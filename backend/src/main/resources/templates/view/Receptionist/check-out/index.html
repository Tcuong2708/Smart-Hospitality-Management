<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nghiệp vụ Trả phòng (Check-out) - MAY HOTEL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<th:block th:fragment="extra_css">
    <link rel="stylesheet" th:href="@{/frontend/receptionist/check-out/css/index.css}" />
    <link rel="stylesheet" th:href="@{/frontend/style.css}" />
</th:block>
</head>
<body>
    <div th:fragment="body_content">
    <div class="container py-5">
        <div id="alert-container"></div>

        <div class="card shadow-sm border-0 rounded-3 overflow-hidden admin-card">
            <div class="admin-header d-flex flex-wrap gap-3 justify-content-between align-items-center p-4" style="background-color: #0F2942; color: white;">
                <h3 class="fw-bold text-uppercase mb-0 text-white">
                    <i class="bi bi-box-arrow-left me-2 text-gold" style="color: #C5A017;"></i>Nghiệp vụ Trả phòng & Kết toán (Check-out)
                </h3>
                <form id="searchBookingForm" class="d-flex shadow-sm rounded" onsubmit="event.preventDefault(); alert('Đã tra cứu mã: ' + document.getElementById('bookingCodeInput').value);" style="min-width: 300px;">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                        <input type="text" id="bookingCodeInput" class="form-control border-start-0 ps-0" placeholder="Nhập mã đặt phòng..." required autocomplete="off">
                        <button class="btn btn-gold fw-bold px-3 text-white" type="submit" style="background: linear-gradient(135deg, #C5A017, #d4af37); border: none;">Tra cứu</button>
                    </div>
                </form>
            </div>

            <div th:if="${success}" class="alert alert-success border-0 shadow-sm text-center m-3" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger border-0 shadow-sm text-center m-3" th:text="${error}"></div>

            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-header-navy" style="background-color: #0F2942; color: white;">
                            <tr>
                                <th class="ps-4 py-3 text-uppercase small text-white">Mã HD</th>
                                <th class="text-uppercase small text-white">Khách lưu trú</th>
                                <th class="text-center text-uppercase small text-white">Số phòng giải phóng</th>
                                <th class="text-uppercase small text-white">Thời gian ở</th>
                                <th class="text-center text-uppercase small text-white" style="width: 320px;">Tất toán & Phụ thu tại quầy</th>
                            </tr>
                        </thead>
                        <tbody id="checkout-table-body">
                            <tr th:if="${invoices == null or #lists.isEmpty(invoices)}">
                                <td colspan="5" class="text-center py-5 text-muted">
                                    <i class="bi bi-door-open fs-2 d-block mb-2 opacity-50"></i>
                                    Hiện tại không có phòng nào đang trong trạng thái lưu trú cần làm thủ tục trả phòng.
                                </td>
                            </tr>
                            <tr th:unless="${invoices == null or #lists.isEmpty(invoices)}" th:each="item : ${invoices}">
                                <td class="ps-4 fw-bold text-navy" th:text="'#' + ${item.id}">#1</td>
                                <td class="fw-bold text-secondary">
                                    <span th:text="${item.hoTen}">Tên khách</span>
                                    <span th:if="${item.ghiChu != null && item.ghiChu.contains('CHATBOT')}" class="badge bg-light text-success border small ms-1" style="font-size: 0.65rem;">Đặt qua Bot</span>
                                </td>
                                <td class="text-center">
                                    <span class="badge bg-danger px-3 py-2 rounded-pill fw-bold" th:text="${#strings.startsWith(item.tenPhong, 'Phòng') ? item.tenPhong : 'Phòng ' + item.tenPhong}">Phòng 101</span>
                                </td>
                                <td>
                                    <small class="d-block text-muted">Từ ngày: <span class="text-dark fw-bold" th:text="${item.ngayCheckIn}">01/01</span></small>
                                    <small class="d-block text-muted">Đến ngày: <span class="text-dark fw-bold" th:text="${item.ngayCheckOut}">02/01</span></small>
                                </td>
                                <td class="text-center">
                                    <form th:action="@{/receptionist/checkout-room/execute}" method="post" class="d-flex gap-2 align-items-center justify-content-center p-2 rounded bg-light border mx-auto" style="max-width: 300px;">
                                        <input type="hidden" name="maHD" th:value="${item.id}" />
                                        <div class="input-group input-group-sm" style="width: 130px;">
                                            <input type="number" name="phuThu" class="form-control text-center text-danger fw-bold" value="0" min="0" step="10000" placeholder="0 đ" required />
                                            <span class="input-group-text bg-white text-muted small">đ</span>
                                        </div>
                                        <button type="submit" class="btn btn-gold btn-sm rounded-pill fw-bold text-nowrap py-1 px-3 text-white" style="background: linear-gradient(135deg, #C5A017, #d4af37); border: none;" onclick="return confirm('Xác nhận thu tiền phụ thu, cập nhật ngày ở thực tế và giải phóng phòng về trạng thái TRỐNG?')">
                                            <i class="bi bi-calculator me-1"></i> Trả phòng
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    </div>
</body>
</html>
