<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Đơn - MAY HOTEL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="history.css">

  <!-- CÁC FILE CSS ĐƯỢC CHÈN SẴN ĐỂ TRÁNH FOUC (FLASH OF UNSTYLED CONTENT) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../../style.css" />
  <style>
    .navbar-nav .nav-link.active-menu {
      font-weight: 700 !important;
      color: #d4af37 !important; /* Màu vàng Gold */
      background-color: rgba(212, 175, 55, 0.1); /* Nền mờ */
      border-radius: 8px; /* Bo tròn góc */
      padding: 8px 16px !important; /* Tạo khoảng trống xung quanh chữ */
      transition: 0.3s all ease-in-out;
    }
    .text-navy { color: #0F2942 !important; }
    .text-gold { color: #C5A017 !important; }
  </style>

</head>
<body class="bg-light">
    <div class="container py-5">
        <a href="history.html" class="btn btn-outline-secondary btn-sm mb-4 fw-bold px-3 shadow-sm rounded-pill">
            <i class="bi bi-arrow-left me-1"></i> Trở về Lịch sử
        </a>

        <div class="card shadow-sm border-0 p-4 p-md-5 mx-auto" style="max-width: 800px; border-radius: 15px;">
            <div id="loading" class="text-center py-5"><div class="spinner-border text-warning"></div></div>
            
            <div id="detail-content" class="d-none">
                <div class="text-center pb-3 mb-4 position-relative">
                    <h3 class="fw-bold text-navy text-uppercase mb-2" style="font-family: 'Playfair Display', serif; letter-spacing: 1px;">Chi Tiết Đơn Đặt Phòng</h3>
                    <div style="width: 60px; height: 3px; background-color: #C5A017; margin: 10px auto;"></div>
                    <div class="text-muted small fw-medium" id="dt-invoice-id">#0000</div>
                    <div class="mt-3" id="dt-status"></div>
                </div>

                <div class="row g-4 mb-4">
                    <div class="col-md-6">
                        <h6 class="fw-bold text-navy border-bottom pb-2 mb-3"><i class="bi bi-person-badge text-gold me-2 fs-5 align-middle"></i>Thông tin Khách Hàng</h6>
                        <div class="small text-muted mb-2">Họ tên: <strong class="text-dark fs-6" id="dt-name"></strong></div>
                        <div class="small text-muted mb-2">SĐT: <strong class="text-dark fs-6" id="dt-phone"></strong></div>
                    </div>
                    <div class="col-md-6">
                        <h6 class="fw-bold text-navy border-bottom pb-2 mb-3"><i class="bi bi-calendar-check text-gold me-2 fs-5 align-middle"></i>Thông tin Lưu Trú</h6>
                        <div class="small text-muted mb-2">Ngày nhận: <strong class="text-dark fs-6" id="dt-checkin"></strong></div>
                        <div class="small text-muted mb-2">Ngày trả: <strong class="text-dark fs-6" id="dt-checkout"></strong></div>
                    </div>
                </div>

                <div class="p-3 rounded-3 mb-4" style="background-color: rgba(197, 160, 23, 0.05); border: 1px dashed rgba(197, 160, 23, 0.4);">
                    <h6 class="fw-bold text-navy mb-3"><i class="bi bi-journal-text text-gold me-2 fs-5 align-middle"></i>Ghi chú & Dịch vụ</h6>
                    <p class="small text-muted m-0 fst-italic lh-lg" id="dt-note"></p>
                </div>

                <div class="d-flex flex-column flex-md-row justify-content-between align-items-center rounded-3 p-4 mb-3 shadow-sm" style="background: linear-gradient(135deg, rgba(15,41,66,0.03) 0%, rgba(197,160,23,0.08) 100%); border-left: 5px solid #0F2942;">
                    <span class="text-navy fw-bold text-uppercase mb-2 mb-md-0" style="letter-spacing: 1px;">Tổng tiền thanh toán:</span>
                    <span class="fs-2 fw-bold text-danger" id="dt-total">0 đ</span>
                </div>
                
                <div class="text-end">
                    <small class="text-muted"><i class="bi bi-credit-card-2-front text-gold me-1"></i>Phương thức: <span id="dt-method" class="fw-bold text-navy"></span></small>
                </div>
            </div>
        </div>
    </div>
    <script src="historydetail.js"></script>
<script src="../../layout.js"></script>
<script src="../../app.js"></script>
</body>
</html>
