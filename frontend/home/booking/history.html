<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Sử Đặt Phòng - MAY HOTEL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="history.css">

  <!-- CÁC FILE CSS ĐƯỢC CHÈN SẴN ĐỂ TRÁNH FOUC (FLASH OF UNSTYLED CONTENT) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../../style.css" />
  <style>
    .navbar-nav .nav-link.active-menu {
      font-weight: 700 !important;
      color: #d4af37 !important; /* Màu vàng Gold */
      background-color: rgba(212, 175, 55, 0.1); /* Nền mờ */
      border-radius: 8px; /* Bo tròn góc */
      padding: 8px 16px !important; /* Tạo khoảng trống xung quanh chữ */
      transition: 0.3s all ease-in-out;
    }
  </style>

</head>
<body class="bg-light">
    <div class="container py-5">
        <a href="../rooms/list.html" class="text-decoration-none text-muted mb-4 d-inline-block">
            <i class="bi bi-arrow-left me-1"></i> Trở về Danh sách phòng
        </a>

        <div class="text-center mb-5">
            <h2 class="fw-bold text-uppercase" style="color: var(--navy-color); letter-spacing: 1px;">
                <i class="bi bi-clock-history me-2" style="color: var(--gold-color);"></i>Lịch sử giao dịch
            </h2>
            <div style="width: 60px; height: 3px; background-color: var(--gold-color); margin: 10px auto;"></div>
        </div>

        <div class="card shadow-sm border-0" style="border-radius: 12px;">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="bg-navy text-white">
                            <tr>
                                <th class="py-3 px-4">Mã Đơn</th>
                                <th class="py-3 px-4">Ngày Đặt</th>
                                <th class="py-3 px-4">Ngày Nhận / Trả</th>
                                <th class="py-3 px-4 text-end">Tổng Tiền</th>
                                <th class="py-3 px-4 text-center">Trạng Thái</th>
                                <th class="py-3 px-4 text-center">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="history-list">
                            <tr><td colspan="6" class="text-center py-5"><div class="spinner-border text-warning"></div></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="history.js"></script>
<script src="../../layout.js"></script>
<script src="../../app.js"></script>
</body>
</html>
