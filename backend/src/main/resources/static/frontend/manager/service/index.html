<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Dịch Vụ - MAY HOTEL</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/index.css" />

  <!-- CÁC FILE CSS ĐƯỢC CHÈN SẴN ĐỂ TRÁNH FOUC (FLASH OF UNSTYLED CONTENT) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../../style.css" />
  <style>
    .navbar-nav .nav-link.active-menu {
      font-weight: 700 !important;
      color: #d4af37 !important; /* Màu vàng Gold */
      background-color: rgba(212, 175, 55, 0.1); /* Nền mờ */
      border-radius: 8px; /* Bo tròn góc */
      padding: 8px 16px !important; /* Tạo khoảng trống xung quanh chữ */
      transition: 0.3s all ease-in-out;
    }
  </style>

</head>
<body>
    <div class="container py-4">
        <div id="alert-container"></div>

        <div class="card border-0 shadow-sm admin-card">
            <div class="admin-header d-flex flex-wrap justify-content-between align-items-center gap-3">
                <h3 class="fw-bold text-uppercase mb-0 text-white">
                    <i class="bi bi-briefcase-fill me-2" style="color: var(--accent-color);"></i>Danh sách Dịch vụ
                </h3>
                
                <div class="d-flex flex-wrap align-items-center gap-3 flex-grow-1 justify-content-end">
                    <div class="input-group shadow-sm" style="max-width: 250px;">
                        <span class="input-group-text bg-white border-0"><i class="bi bi-search text-muted"></i></span>
                        <input type="text" class="form-control border-0" id="searchService" placeholder="Tìm dịch vụ...">
                    </div>

                    <a href="#" data-bs-toggle="modal" data-bs-target="#serviceModal" class="btn btn-gold px-4 shadow-sm text-white" style="background: #C5A017;">
                        <i class="bi bi-plus-circle me-2"></i>Thêm dịch vụ mới
                    </a>
                </div>
            </div>
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-header-navy" style="background-color: #0F2942; color: white;">
                        <tr>
                            <th class="py-3 text-center text-uppercase small text-white">
                                Tên Dịch vụ
                                <div class="dropdown d-inline-block ms-1">
                                    <i class="bi bi-funnel-fill text-warning" style="cursor: pointer;" data-bs-toggle="dropdown" data-bs-auto-close="outside" title="Lọc Tên Dịch Vụ"></i>
                                    <ul class="dropdown-menu p-2 shadow-sm text-dark" id="thFilterServiceName" style="min-width: 200px; max-height: 250px; overflow-y: auto;">
                                        <!-- JS load -->
                                    </ul>
                                </div>
                            </th>
                            <th class="text-center text-uppercase small text-white">Đơn giá</th>
                            <th class="text-center text-uppercase small text-white">Đơn vị tính</th>
                            <th class="text-center text-uppercase small text-white" style="width: 150px;">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="service-table-body">
                        <tr>
                            <td colspan="4" class="text-center py-5 text-muted">
                                <div class="spinner-border text-primary" role="status"></div>
                                <p class="mt-2">Đang tải danh sách dịch vụ...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Thêm/Cập nhật Service -->
    <div class="modal fade" id="serviceModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header text-white" style="background-color: #0F2942; border-bottom: 4px solid #C5A017; border-top-left-radius: calc(0.3rem - 1px); border-top-right-radius: calc(0.3rem - 1px);">
                    <h5 class="modal-title fw-bold text-uppercase d-flex align-items-center" style="letter-spacing: 1px;">
                        <span class="d-inline-flex justify-content-center align-items-center me-2" style="background-color: #C5A017; color: #0F2942; width: 24px; height: 24px; border-radius: 4px; font-size: 18px; font-weight: 900; line-height: 1;">+</span>
                        <span id="serviceModalTitle">Thêm Dịch Vụ Mới</span>
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="serviceForm">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Tên Dịch Vụ <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="form-srv-name" placeholder="Ví dụ: Giặt là" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Đơn Giá (VNĐ) <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" id="form-srv-price" placeholder="Ví dụ: 50000" required min="0">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Đơn Vị Tính <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="form-srv-unit" placeholder="Ví dụ: Lần, Chiếc, Bữa..." required>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer bg-light border-top-0">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-gold text-white fw-bold px-4" id="btn-save-service" style="background: #C5A017;">Lưu Thông Tin</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/index.js"></script>
<script src="../../layout.js"></script>
<script src="../../app.js"></script>
</body>
</html>
