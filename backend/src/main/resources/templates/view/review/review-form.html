<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<head>
    <title>Đánh giá kỳ nghỉ</title>
</head>

<body>
    <section layout:fragment="content">

        <div class="mh-rv-form-page">

            <div class="mh-rv-form-wrap">

                <!-- Breadcrumb nhỏ -->
                <a th:href="@{/booking/history/detail(id=${bookingId})}" class="mh-rv-form-back">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Quay lại đơn đặt phòng</span>
                </a>

                <!-- Card chính -->
                <div class="mh-rv-form-card">

                    <!-- Header -->
                    <div class="mh-rv-form-head">
                        <div class="mh-rv-form-icon">
                            <i class="fa-solid fa-star"></i>
                        </div>
                        <div>
                            <span class="mh-rv-form-eyebrow">CHIA SẺ TRẢI NGHIỆM</span>
                            <h1>Bạn thấy kỳ nghỉ thế nào?</h1>
                            <p>
                                Đơn đặt phòng
                                <strong th:text="'#' + ${bookingId}">#1</strong>
                                — đánh giá của bạn giúp khách khác chọn phòng.
                            </p>
                        </div>
                    </div>

                    <!-- Error -->
                    <div th:if="${error}" class="mh-rv-form-error">
                        <i class="fa-solid fa-circle-exclamation"></i>
                        <span th:text="${error}"></span>
                    </div>

                    <!-- Form -->
                    <form th:action="@{/review/create}" method="post" id="rvForm" class="mh-rv-form">
                        <input type="hidden" name="bookingId" th:value="${bookingId}">
                        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}"
                            th:value="${_csrf.token}">

                        <!-- Star picker -->
                        <label class="mh-rv-form-label">
                            Đánh giá của bạn <span class="mh-rv-form-req">*</span>
                        </label>
                        <div class="mh-rv-star-picker" role="radiogroup" aria-label="Số sao">
                            <input type="radio" id="st5" name="rating" value="5">
                            <label for="st5" title="Tuyệt vời"><i class="fa-solid fa-star"></i></label>

                            <input type="radio" id="st4" name="rating" value="4">
                            <label for="st4" title="Rất tốt"><i class="fa-solid fa-star"></i></label>

                            <input type="radio" id="st3" name="rating" value="3">
                            <label for="st3" title="Tốt"><i class="fa-solid fa-star"></i></label>

                            <input type="radio" id="st2" name="rating" value="2">
                            <label for="st2" title="Tạm được"><i class="fa-solid fa-star"></i></label>

                            <input type="radio" id="st1" name="rating" value="1">
                            <label for="st1" title="Chưa hài lòng"><i class="fa-solid fa-star"></i></label>
                        </div>
                        <div class="mh-rv-form-hint" id="rvHint">Chọn số sao để đánh giá</div>

                        <!-- Textarea -->
                        <label for="rvContent" class="mh-rv-form-label">
                            Nhận xét chi tiết
                            <small>(không bắt buộc)</small>
                        </label>
                        <textarea id="rvContent" name="content" maxlength="1000"
                            placeholder="Chia sẻ cảm nhận của bạn về phòng, dịch vụ, nhân viên..."></textarea>
                        <div class="mh-rv-form-counter">
                            <span id="rvCounter">0</span>/1000 ký tự
                        </div>

                        <!-- Actions -->
                        <div class="mh-rv-form-actions">
                            <button type="submit" class="mh-rv-form-btn" id="rvSubmit" disabled>
                                <i class="fa-solid fa-paper-plane"></i>
                                <span>Gửi đánh giá</span>
                            </button>
                            <a class="mh-rv-form-cancel" th:href="@{/booking/history/detail(id=${bookingId})}">
                                Để sau
                            </a>
                        </div>
                    </form>
                </div>

                <!-- Note -->
                <div class="mh-rv-form-note">
                    <i class="fa-solid fa-circle-info"></i>
                    <p>
                        Đánh giá của bạn sẽ được hiển thị công khai tại
                        <a th:href="@{/review}">trang Đánh giá</a>
                        và giúp khách hàng khác có lựa chọn tốt hơn.
                    </p>
                </div>

            </div>
        </div>

        <script>
            (function () {
                'use strict';

                var HINTS = {
                    5: 'Tuyệt vời — Chúng tôi rất vui vì bạn hài lòng!',
                    4: 'Rất tốt — Cảm ơn bạn đã tin tưởng May Hotel!',
                    3: 'Tốt — Chúng tôi sẽ cố gắng hơn!',
                    2: 'Tạm được — Hãy cho chúng tôi biết điểm chưa ổn nhé.',
                    1: 'Chưa hài lòng — Chúng tôi thành thật xin lỗi và sẽ cải thiện.'
                };

                var hint = document.getElementById('rvHint');
                var btn = document.getElementById('rvSubmit');
                var textarea = document.getElementById('rvContent');
                var counter = document.getElementById('rvCounter');

                // Star picker
                document.querySelectorAll('input[name=rating]').forEach(function (input) {
                    input.addEventListener('change', function () {
                        var text = HINTS[input.value] || 'Chọn số sao để đánh giá';
                        hint.textContent = text;
                        hint.classList.add('is-active');
                        btn.disabled = false;
                    });
                });

                // Character counter
                if (textarea && counter) {
                    textarea.addEventListener('input', function () {
                        counter.textContent = this.value.length;
                    });
                }
            })();
        </script>

    </section>
</body>

</html>
