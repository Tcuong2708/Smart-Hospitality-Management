<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<head>
    <title>Đặt lại mật khẩu - MAY HOTEL</title>
</head>

<body>

    <th:block layout:fragment="additional-css">
        <link rel="stylesheet" th:href="@{/css/auth.css}" />
    </th:block>

    <div layout:fragment="content">

        <section class="mh-auth mh-auth--narrow">
            <aside class="mh-auth-visual">
                <div class="mh-auth-visual-overlay"></div>
                <div class="mh-auth-visual-content">
                    <div class="mh-auth-ornament">✦ ❦ ✦</div>
                    <h2>Đặt lại<br>mật khẩu</h2>
                    <div class="mh-auth-rule"></div>
                    <p>Nhập mã OTP đã nhận và mật khẩu mới để khôi phục quyền truy cập tài khoản May Hotel.</p>
                </div>
            </aside>

            <div class="mh-auth-form-wrap">
                <div class="mh-auth-form-inner">

                    <a th:href="@{/}" class="mh-auth-logo">
                        <img th:src="@{/images/logo-web.png}" alt="MAY HOTEL">
                    </a>

                    <header class="mh-auth-header">
                        <span class="mh-auth-eyebrow">Bảo mật</span>
                        <h1>Xác nhận & đổi mật khẩu</h1>
                        <p>Kiểm tra email/SĐT để lấy mã OTP 6 chữ số.</p>
                    </header>

                    <div th:if="${error != null}" class="mh-auth-alert error">
                        <i class="fa-solid fa-circle-exclamation"></i>
                        <span th:text="${error}"></span>
                    </div>

                    <form th:action="@{/account/verify_otp}" method="post" class="mh-auth-form">
                        <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}"
                            th:value="${_csrf.token}" />
                        <input type="hidden" name="keyword" th:value="${keyword}" />

                        <div class="mh-field">
                            <label for="otp">Mã OTP</label>
                            <div class="mh-field-input">
                                <i class="fa-solid fa-key"></i>
                                <input id="otp" type="text" name="otp" required maxlength="6" pattern="\d{6}"
                                    autocomplete="one-time-code" inputmode="numeric" placeholder="• • • • • •"
                                    class="mh-input-otp" />
                            </div>
                        </div>

                        <div class="mh-field">
                            <label for="newpassword">Mật khẩu mới</label>
                            <div class="mh-field-input">
                                <i class="fa-solid fa-lock"></i>
                                <input id="newpassword" type="password" name="newpassword" required minlength="8"
                                    pattern="(?=.*[A-Za-z])(?=.*\d).{8,100}"
                                    placeholder="Ít nhất 8 ký tự, gồm chữ và số" />
                            </div>
                        </div>

                        <button type="submit" class="mh-auth-submit">
                            <i class="fa-solid fa-check"></i>
                            Xác nhận đổi mật khẩu
                        </button>
                    </form>

                    <div class="mh-auth-extra-row">
                        <form th:action="@{/account/find_account}" method="post"
                            onsubmit="return confirm('Gửi lại mã OTP mới?');">
                            <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}"
                                th:value="${_csrf.token}" />
                            <input type="hidden" name="keyword" th:value="${keyword}" />
                            <button type="submit" class="mh-auth-link-btn">
                                <i class="fa-solid fa-rotate-right"></i> Gửi lại mã OTP
                            </button>
                        </form>
                    </div>

                    <p class="mh-auth-back">
                        <a th:href="@{/account/login}">
                            <i class="fa-solid fa-arrow-left"></i> Quay lại đăng nhập
                        </a>
                    </p>
                </div>
            </div>
        </section>

    </div>

</body>

</html>
