<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiểm Duyệt Đánh Giá - Admin</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        .bg-navy { background-color: #0F2942 !important; }
        .text-navy { color: #0F2942 !important; }
        .text-gold { color: #C5A017 !important; }
    </style>

  <!-- CÁC FILE CSS ĐƯỢC CHÈN SẴN ĐỂ TRÁNH FOUC (FLASH OF UNSTYLED CONTENT) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../../style.css" />
  <style>
    .navbar-nav .nav-link.active-menu {
      font-weight: 700 !important;
      color: #d4af37 !important; /* Màu vàng Gold */
      background-color: rgba(212, 175, 55, 0.1); /* Nền mờ */
      border-radius: 8px; /* Bo tròn góc */
      padding: 8px 16px !important; /* Tạo khoảng trống xung quanh chữ */
      transition: 0.3s all ease-in-out;
    }
  </style>

</head>
<body>

<div class="main-content">
    <div class="container py-5">
        <div class="card shadow-sm border-0 admin-card">
            <div class="admin-header d-flex flex-wrap justify-content-between align-items-center gap-3">
                <h3 class="fw-bold text-uppercase mb-0 text-white">
                    <i class="bi bi-chat-square-heart-fill me-2" style="color: var(--accent-color);"></i>Kiểm duyệt Đánh giá phản hồi
                </h3>
                
                <div class="d-flex flex-wrap align-items-center gap-3 flex-grow-1 justify-content-end">
                    <div class="input-group shadow-sm" style="max-width: 250px;">
                        <span class="input-group-text bg-white border-0"><i class="bi bi-search text-muted"></i></span>
                        <input type="text" class="form-control border-0" id="searchReview" placeholder="Tìm đánh giá...">
                    </div>
                </div>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-header-navy" style="background-color: #0F2942; color: white;">
                        <tr>
                            <th class="py-3 text-center text-uppercase small text-white">Mã đơn</th>
                            <th class="text-center text-uppercase small text-white">Tên phòng / Dịch vụ</th>
                            <th class="text-center text-uppercase small text-white">Mức xếp hạng</th>
                            <th class="text-center text-uppercase small text-white" style="max-width: 350px;">Nội dung phản hồi</th>
                            <th class="text-center text-uppercase small text-white">
                                Trạng thái
                                <div class="dropdown d-inline-block ms-1">
                                    <i class="bi bi-funnel-fill text-warning" style="cursor: pointer;" data-bs-toggle="dropdown" data-bs-auto-close="outside" title="Lọc Trạng Thái"></i>
                                    <ul class="dropdown-menu p-2 shadow-sm text-dark" id="thFilterReviewStatusDropdown" style="min-width: 200px; max-height: 250px; overflow-y: auto;">
                                        <!-- JS load -->
                                    </ul>
                                </div>
                            </th>
                            <th class="text-center text-uppercase small text-white" style="width: 180px;">Thao tác kiểm duyệt</th>
                        </tr>
                        </thead>
                        <tbody id="review-table-body">
                            <!-- JS load -->
                            <tr>
                                <td colspan="6" class="text-center py-5 text-muted">
                                    <div class="spinner-border text-primary"></div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal Phản hồi đánh giá -->
<div class="modal fade" id="replyModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header text-white" style="background-color: #0F2942; border-bottom: 4px solid #C5A017; border-top-left-radius: calc(0.3rem - 1px); border-top-right-radius: calc(0.3rem - 1px);">
                <h5 class="modal-title fw-bold text-uppercase d-flex align-items-center" style="letter-spacing: 1px;">
                    <span class="d-inline-flex justify-content-center align-items-center me-2" style="background-color: #C5A017; color: #0F2942; width: 24px; height: 24px; border-radius: 4px; font-size: 14px; font-weight: 900; line-height: 1;"><i class="bi bi-reply-all-fill"></i></span>
                    Phản hồi từ Khách sạn
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <div class="p-3 bg-light rounded border mb-3">
                    <small class="text-muted fw-bold text-uppercase d-block mb-1">Nội dung đánh giá:</small>
                    <p class="mb-0 text-dark fst-italic" id="reply-review-content">"..."</p>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Nhập nội dung phản hồi <span class="text-danger">*</span></label>
                    <textarea class="form-control" id="reply-content" rows="4" placeholder="VD: Cảm ơn quý khách đã tin tưởng và sử dụng dịch vụ..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                <button type="button" class="btn btn-gold fw-bold px-4" id="btn-submit-reply">Gửi phản hồi</button>
            </div>
        </div>
    </div>
</div>

<script src="index.js"></script>

<!-- Layout chung -->
<script src="../../layout.js"></script>
<script src="../../app.js"></script>
</body>
</html>
