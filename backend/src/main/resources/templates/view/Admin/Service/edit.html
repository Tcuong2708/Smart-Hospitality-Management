<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<th:block th:fragment="extra_css">
    <link rel="stylesheet" th:href="@{/css/Admin/Service/edit.css}" />
</th:block>

<div th:fragment="body_content">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card border-0 shadow-lg form-card">
                    <div class="card-header bg-navy text-white py-3 d-flex justify-content-between align-items-center">
                        <h4 class="mb-0 fw-bold text-uppercase fs-5">
                            <i class="bi bi-pencil-square me-2"></i>Cập nhật Dịch Vụ
                        </h4>
                        <span class="badge badge-id px-3 py-2 rounded-pill" th:text="'ID: #' + ${dichVu.maDV}">
                            ID: #0
                        </span>
                    </div>
                    <div class="card-body p-5">
                        <form th:action="@{/admin/services/edit}" method="post">
                            <input type="hidden" name="maDV" th:value="${dichVu.maDV}" />

                            <div class="mb-4">
                                <label class="form-label fw-bold text-navy">Tên dịch vụ <span class="text-danger">*</span></label>
                                <input type="text" name="tenDV" th:value="${dichVu.tenDV}" class="form-control form-control-lg" required />
                            </div>

                            <div class="row mb-4">
                                <div class="col-md-6 mb-3 mb-md-0">
                                    <label class="form-label fw-bold text-navy">Giá tiền (VNĐ) <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <input type="number" name="giaTien" th:value="${dichVu.giaTien}" class="form-control" min="0" required />
                                        <span class="input-group-text bg-light text-secondary">VNĐ</span>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold text-navy">Đơn vị tính <span class="text-danger">*</span></label>
                                    <input type="text" name="donVi" th:value="${dichVu.donVi}" class="form-control" required />
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-2 border-top pt-4 mt-3">
                                <a th:href="@{/admin/services}" class="btn btn-outline-secondary px-4 fw-bold">
                                    <i class="bi bi-x-lg me-2"></i>Hủy bỏ
                                </a>
                                <button type="submit" class="btn btn-gold px-4 fw-bold">
                                    <i class="bi bi-check-lg me-2"></i>Lưu thay đổi
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:fragment="extra_js"></div>
</html>
