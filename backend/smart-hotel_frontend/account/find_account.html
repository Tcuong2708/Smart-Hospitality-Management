<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tìm tài khoản - MAY HOTEL</title>
    <!-- Kế thừa chung css từ login -->
    <link rel="stylesheet" href="css/login.css" />

  <!-- CÁC FILE CSS ĐƯỢC CHÈN SẴN ĐỂ TRÁNH FOUC (FLASH OF UNSTYLED CONTENT) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../style.css" />
  <style>
    .navbar-nav .nav-link.active-menu {
      font-weight: 700 !important;
      color: #d4af37 !important; /* Màu vàng Gold */
      background-color: rgba(212, 175, 55, 0.1); /* Nền mờ */
      border-radius: 8px; /* Bo tròn góc */
      padding: 8px 16px !important; /* Tạo khoảng trống xung quanh chữ */
      transition: 0.3s all ease-in-out;
    }
  </style>

</head>
<body>

    <div class="login-wrapper py-5 fade-in-box">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-5">
                    <div class="card card-login shadow-lg border-0">
                        <div class="card-header-login text-center py-4 text-white" style="background-color: var(--navy-color);">
                            <h3 class="fw-bold text-white">Tìm tài khoản của bạn</h3>
                            <p class="mb-0 small opacity-75">Vui lòng nhập Email hoặc Số điện thoại để tìm kiếm</p>
                        </div>
                        <div class="card-body p-4 p-md-5">
                            
                            <div id="error-message" class="alert alert-danger text-center mb-4" style="display: none;">
                                <i class="bi bi-exclamation-triangle-fill me-2"></i><span></span>
                            </div>

                            <form id="find-account-form">
                                <div class="mb-4">
                                    <input type="text" id="keyword" class="form-control form-control-lg" placeholder="Email hoặc Số điện thoại" required />
                                </div>
                                <button type="submit" id="btn-submit" class="btn w-100 py-3 fw-bold text-white shadow-sm" style="background-color: var(--gold-color);">
                                    <i class="bi bi-search me-2"></i> TÌM KIẾM
                                </button>
                            </form>

                            <div class="text-center mt-4">
                                <a href="login.html" class="text-decoration-none" style="color: var(--navy-color);">Hủy</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script src="../layout.js"></script>
<script src="../app.js"></script>
<script src="js/find_account.js"></script>
</body>
</html>
