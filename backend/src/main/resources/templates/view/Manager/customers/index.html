<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head>
<th:block th:fragment="extra_css"><style>
.customer-page .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}.customer-page .summary article{background:#fff;border:1px solid #e2e7ec;border-radius:10px;padding:18px 20px;box-shadow:0 4px 14px rgba(15,41,66,.06)}.customer-page .summary span{display:block;color:#70808d;font-size:.78rem;font-weight:700;text-transform:uppercase}.customer-page .summary strong{font-size:1.65rem;color:#0f2942}.customer-page .panel{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 5px 20px rgba(15,41,66,.08)}.customer-page .panel-head{background:#0f2942;border-bottom:3px solid #c5a017;padding:18px 22px}.customer-page td small{display:block;color:#7f8b95}@media(max-width:700px){.customer-page .summary{grid-template-columns:1fr}}
</style></th:block></head><body>
<div th:fragment="body_content" class="manager-page-shell"><div class="container py-4 customer-page manager-fill-page">
<div th:if="${success}" class="alert alert-success" th:text="${success}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
<div class="summary"><article><span>Tổng khách hàng</span><strong th:text="${totalCustomers}"></strong></article><article><span>Có điểm thành viên</span><strong th:text="${loyalCustomers}"></strong></article><article><span>Đã liên kết tài khoản</span><strong th:text="${linkedCustomers}"></strong></article></div>
<div class="panel manager-fill-card"><div class="panel-head d-flex justify-content-between align-items-center gap-3 flex-wrap"><h3 class="m-0 text-white fw-bold text-uppercase"><i class="bi bi-people-fill text-warning me-2"></i>Quản lý khách hàng</h3><div class="d-flex gap-2"><input id="customerSearch" class="form-control" style="width:300px" placeholder="Tìm tên, SĐT, email..."><button id="addCustomer" class="btn btn-gold"><i class="bi bi-plus-lg"></i> Thêm mới</button></div></div>
<div class="table-responsive manager-fill-body"><table class="table table-hover mb-0"><thead class="table-dark"><tr><th>Mã</th><th>Khách hàng</th><th>Liên hệ</th><th>CCCD/Hộ chiếu</th><th>Quốc tịch</th><th class="text-end">Điểm</th><th class="text-center">Thao tác</th></tr></thead><tbody>
<tr th:if="${customers.isEmpty()}"><td colspan="7" class="text-center py-5 text-muted">Chưa có khách hàng</td></tr>
<tr th:each="c:${customers}" class="customer-row"><td class="fw-bold" th:text="${c.id}"></td><td><strong th:text="${c.fullName}"></strong><small th:text="${c.dob.isEmpty() ? '' : 'Sinh: '+c.dob}"></small></td><td><span th:text="${c.phone}"></span><small th:text="${c.email}"></small></td><td th:text="${c.maskedCccd}"></td><td th:text="${c.nationality}"></td><td class="text-end fw-bold" th:text="${c.points}"></td><td class="text-center text-nowrap"><button class="btn btn-action btn-edit edit-customer" th:attr="data-id=${c.id},data-name=${c.fullName},data-phone=${c.phone},data-email=${c.email},data-cccd=${c.cccd},data-address=${c.address},data-nationality=${c.nationality},data-gender=${c.gender},data-dob=${c.dob}"><i class="bi bi-pencil"></i></button><form class="d-inline" th:action="@{/manager/customers/{id}/delete(id=${c.id})}" method="post" onsubmit="return confirm('Xóa khách hàng này?')"><button class="btn btn-action btn-delete"><i class="bi bi-trash"></i></button></form></td></tr>
</tbody></table></div></div></div>
<div class="modal fade" id="customerModal" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content"><div class="modal-header text-white" style="background:#0f2942;border-bottom:4px solid #c5a017"><h5 id="customerTitle" class="modal-title fw-bold">Thêm khách hàng</h5><button class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><form id="customerForm" method="post" th:action="@{/manager/customers/create}"><input type="hidden" name="id" id="customer-id"><div class="modal-body p-4"><div class="row g-3">
<div class="col-md-6"><label class="form-label fw-bold">Họ và tên *</label><input class="form-control" name="fullName" id="customer-name" maxlength="100" required></div><div class="col-md-6"><label class="form-label fw-bold">Số điện thoại *</label><input class="form-control" name="phone" id="customer-phone" pattern="\+?[0-9]{9,15}" required></div>
<div class="col-md-6"><label class="form-label fw-bold">Email</label><input type="email" class="form-control" name="email" id="customer-email"></div><div class="col-md-6"><label class="form-label fw-bold">CCCD/Hộ chiếu</label><input class="form-control" name="cccd" id="customer-cccd" maxlength="20"></div>
<div class="col-md-4"><label class="form-label fw-bold">Ngày sinh</label><input class="form-control" name="dob" id="customer-dob" placeholder="dd-MM-yyyy"></div><div class="col-md-4"><label class="form-label fw-bold">Quốc tịch</label><input class="form-control" name="nationality" id="customer-nationality" maxlength="100"></div><div class="col-md-4"><label class="form-label fw-bold">Giới tính</label><select class="form-select" name="gender" id="customer-gender"><option value="">Chưa xác định</option><option>Nam</option><option>Nữ</option><option>Khác</option></select></div>
<div class="col-12"><label class="form-label fw-bold">Địa chỉ</label><input class="form-control" name="address" id="customer-address" maxlength="300"></div>
</div></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button><button class="btn btn-gold">Lưu thông tin</button></div></form></div></div></div>
</div>
<th:block th:fragment="extra_js"><script>document.addEventListener('DOMContentLoaded',()=>{const el=document.getElementById('customerModal'),modal=new bootstrap.Modal(el),form=document.getElementById('customerForm'),get=id=>document.getElementById(id);document.getElementById('addCustomer').onclick=()=>{form.reset();form.action='/manager/customers/create';get('customer-id').value='';get('customerTitle').textContent='Thêm khách hàng';modal.show()};document.querySelectorAll('.edit-customer').forEach(b=>b.onclick=()=>{form.reset();form.action='/manager/customers/edit';get('customerTitle').textContent='Cập nhật khách hàng';['id','name','phone','email','cccd','address','nationality','gender','dob'].forEach(k=>get('customer-'+k).value=b.dataset[k]||'');modal.show()});get('customerSearch').oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('.customer-row').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}});</script></th:block>
</body></html>
