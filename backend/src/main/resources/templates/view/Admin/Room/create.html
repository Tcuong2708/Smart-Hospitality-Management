<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:fragment="extra_css"></th:block>
</head>
<body>
<div th:fragment="body_content">
    <div class="container py-5">
        <a th:href="@{/manager/rooms}" class="text-decoration-none text-muted mb-3 d-inline-block">
            <i class="bi bi-arrow-left me-1"></i> Trở về Quản lý phòng
        </a>

        <div class="card border-0 shadow-sm admin-card">
            <div class="admin-header d-flex justify-content-between align-items-center" style="background-color: #0F2942; color: white; padding: 1rem 1.5rem; border-bottom: 3px solid #C5A017;">
                <h4 class="mb-0 fw-bold text-uppercase" style="letter-spacing: 1px;">
                    <i class="bi bi-plus-square-fill me-2" style="color: #C5A017;"></i>Thêm Phòng Mới
                </h4>
            </div>

            <div class="card-body p-4 p-md-5">
                <form th:action="@{/manager/rooms/create}" method="post" th:object="${room}">
                    <div class="row g-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Tên Phòng <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{name}" required placeholder="Ví dụ: P101">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Giá Phòng (VNĐ) <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" th:field="*{price}" required placeholder="Ví dụ: 500000">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">URL Hình ảnh</label>
                            <input type="text" class="form-control" th:field="*{imageUrl}" placeholder="Ví dụ: /images/r1.jpg">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Trạng Thái</label>
                            <select class="form-select" th:field="*{status}">
                                <option value="Trống">Trống</option>
                                <option value="Đang ở">Đang ở</option>
                                <option value="Bảo trì">Bảo trì</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Số Giường Phụ Tối Đa</label>
                            <input type="number" class="form-control" th:field="*{maxExtraBeds}" value="0" min="0">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Loại Phòng</label>
                            <select class="form-select" th:field="*{roomTypeId}">
                                <option th:each="type : ${roomTypes}" th:value="${type.id}" th:text="${type.name}"></option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold">Chi Tiết (Mô tả)</label>
                            <textarea class="form-control" th:field="*{detail}" rows="3" placeholder="Mô tả về phòng..."></textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold">Ghi Chú Nội Bộ</label>
                            <input type="text" class="form-control" th:field="*{note}" placeholder="Ghi chú thêm...">
                        </div>
                    </div>
                    
                    <div class="mt-5 d-flex justify-content-end gap-3 border-top pt-4">
                        <a th:href="@{/manager/rooms}" class="btn btn-secondary px-4 fw-bold">Hủy</a>
                        <button type="submit" class="btn btn-warning text-white px-4 fw-bold" style="background-color: #C5A017; border:none;">
                            Lưu Thông Tin
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<th:block th:fragment="extra_js"></th:block>
</body>
</html>
