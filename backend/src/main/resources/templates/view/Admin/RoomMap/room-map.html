<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:fragment="extra_css">
        <style>
            .room-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; padding: 20px 0; }
            .room-card { border: 2px solid #1A1A1A; border-radius: 12px; background: #FFFFFF; transition: all 0.2s ease; }
            .room-card:hover { transform: translateY(-3px); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }

            /* Màu trạng thái viền trái phòng vật lý */
            .status-empty { border-left: 8px solid #198754; }    /* Xanh - Trống */
            .status-occupied { border-left: 8px solid #DC3545; } /* Đỏ - Có khách */
            .status-dirty { border-left: 8px solid #FFC107; }    /* Vàng - Chờ dọn dẹp */

            .btn-action { font-size: 0.85rem; font-weight: bold; border-radius: 6px; width: 100%; text-align: center; }
        </style>
    </th:block>
</head>
<body>

<div th:fragment="body_content" class="container-fluid py-4">
    <div class="admin-card mb-4">
        <div class="admin-header d-flex justify-content-between align-items-center">
            <h3 class="fw-bold text-uppercase mb-0">
                <i class="bi bi-grid-3x3-gap-fill me-2" style="color: #ffc107;"></i>SƠ ĐỒ PHÒNG NGHỈ TRỰC QUAN
            </h3>
            <a th:href="@{/receptionist/check-in}" class="btn btn-gold px-4 shadow-sm text-white" style="background: #C5A017;">
                <i class="bi bi-journal-bookmark-fill me-2"></i>Xem danh sách Chờ Check-in
            </a>
        </div>

        <div class="card-body p-4">
            <div class="d-flex gap-4 p-3 bg-white rounded shadow-sm border mb-4" style="font-size: 0.9rem;">
                <span class="fw-bold"><i class="bi bi-square-fill text-success me-1"></i>Phòng trống</span>
                <span class="fw-bold"><i class="bi bi-square-fill text-danger me-1"></i>Đang ở (Check-in)</span>
                <span class="fw-bold"><i class="bi bi-square-fill text-warning me-1"></i>Chờ dọn dẹp (Sau Check-out)</span>
            </div>

    <div class="room-grid">
        <th:block th:each="room : ${rooms}">
            <div class="room-card p-3 d-flex flex-column justify-content-between"
                 th:classappend="${room.maTrangThai == 1 ? 'status-empty' : (room.maTrangThai == 2 ? 'status-occupied' : 'status-dirty')}">

                <div>
                    <div class="d-flex justify-content-between align-items-start">
                        <h5 class="fw-bold text-dark m-0" th:text="${'Phòng ' + room.id}">Phòng 101</h5>
                        <span class="badge bg-light text-dark border fw-bold" th:text="${room.maLoai}">Hạng phòng</span>
                    </div>
                    <p class="text-muted small mt-1 mb-2" th:text="${#numbers.formatDecimal(room.price, 0, 'COMMA', 0, 'POINT') + ' VNĐ'}">0 VNĐ</p>
                </div>

                <div class="mt-3">
                    <a th:if="${room.maTrangThai == 1}"
                       th:href="@{/receptionist/check-in(roomId=${room.id})}"
                       class="btn btn-success btn-action py-1">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Check-In
                    </a>

                    <a th:if="${room.maTrangThai == 2}"
                       th:href="@{/receptionist/check-out(roomId=${room.id})}"
                       class="btn btn-danger btn-action py-1">
                        <i class="bi bi-box-arrow-left me-1"></i>Check-Out
                    </a>

                    <button th:if="${room.maTrangThai == 3}"
                            class="btn btn-warning text-dark btn-action py-1" disabled>
                        <i class="bi bi-hourglass-split me-1"></i>Chờ dọn dẹp...
                    </button>
                </div>

            </div>
        </th:block>
        </div>
    </div>
</div>

<th:block th:fragment="extra_js"></th:block>

</body>
</html>
