<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:fragment="extra_css"></th:block>
</head>
<body>
<div th:fragment="body_content">
    <div class="container py-5">
        <a th:href="@{/manager/rooms}" class="text-decoration-none text-muted mb-3 d-inline-block">
            <i class="bi bi-arrow-left me-1"></i> Trở về Quản lý phòng
        </a>

        <div class="card border-0 shadow-sm admin-card" th:if="${room != null}">
            <div class="admin-header d-flex justify-content-between align-items-center" style="background-color: #0F2942; color: white; padding: 1rem 1.5rem; border-bottom: 3px solid #C5A017;">
                <h4 class="mb-0 fw-bold text-uppercase" style="letter-spacing: 1px;">
                    <i class="bi bi-info-circle-fill me-2" style="color: #C5A017;"></i>Chi Tiết Phòng
                </h4>
            </div>

            <div class="card-body p-4 p-md-5">
                <div class="row">
                    <div class="col-md-5 mb-4 mb-md-0 text-center">
                        <img loading="lazy" th:src="${room.imageUrl != null and !room.imageUrl.isEmpty() ? room.imageUrl : (room.roomType != null ? room.roomType.imageUrl : '/images/room-placeholder.jpg')}" alt="Room Image" class="img-fluid rounded shadow-sm" style="max-height: 300px; object-fit: cover; width: 100%;">
                    </div>
                    <div class="col-md-7">
                        <h3 class="fw-bold mb-3" style="color: #0F2942;" th:text="${room.name}"></h3>
                        
                        <table class="table table-bordered">
                            <tbody>
                                <tr>
                                    <th class="bg-light" style="width: 30%;">Mã Phòng (ID)</th>
                                    <td th:text="${room.id}"></td>
                                </tr>
                                <tr>
                                    <th class="bg-light">Giá Phòng</th>
                                    <td class="text-danger fw-bold fs-5" th:text="${#numbers.formatDecimal(room.price, 0, 'COMMA', 0, 'POINT') + ' VNĐ'}"></td>
                                </tr>
                                <tr>
                                    <th class="bg-light">Trạng Thái</th>
                                    <td>
                                        <span class="badge" th:classappend="${room.status == 'Trống' ? 'bg-success' : (room.status == 'Đang ở' ? 'bg-danger' : 'bg-warning')}" th:text="${room.status}"></span>
                                    </td>
                                </tr>
                                <tr>
                                    <th class="bg-light">Loại Phòng</th>
                                    <td th:text="${room.roomType != null ? room.roomType.name : 'Chưa phân loại'}"></td>
                                </tr>
                                <tr>
                                    <th class="bg-light">Số Giường Phụ Tối Đa</th>
                                    <td th:text="${room.maxExtraBeds + ' giường'}"></td>
                                </tr>
                                <tr>
                                    <th class="bg-light">Mô tả chi tiết</th>
                                    <td th:text="${room.detail}"></td>
                                </tr>
                                <tr>
                                    <th class="bg-light">Ghi chú nội bộ</th>
                                    <td class="fst-italic text-muted" th:text="${room.note}"></td>
                                </tr>
                            </tbody>
                        </table>

                        <div class="mt-4 text-end">
                            <a th:href="@{/manager/rooms}" class="btn btn-secondary px-4 me-2">Đóng</a>
                            <a th:href="@{/manager/rooms/edit/{id}(id=${room.id})}" class="btn btn-primary px-4 border-0" style="background-color: #0F2942;">
                                <i class="bi bi-pencil-square me-1"></i> Chỉnh sửa
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="alert alert-danger" th:if="${room == null}">
            Không tìm thấy thông tin phòng này.
        </div>
    </div>
</div>
<th:block th:fragment="extra_js"></th:block>
</body>
</html>
