spring.application.name=mayhotel

# ==========================================
# MONGODB (Sử dụng URI và 127.0.0.1 để tránh lỗi phân giải DNS IPv6 gây delay 10-20s)
# ==========================================
spring.data.mongodb.uri=mongodb://127.0.0.1:27017/MayHotelDB?minPoolSize=2&maxPoolSize=20&maxIdleTimeMS=60000


# ==========================================
# Xác thực OTP dùng mật khẩu ứng dụng và email của Google
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=cuongvoit2407@gmail.com
spring.mail.password=ijhx dvzx asou quii
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# Cấu hình Đường dẫn AI API Server (Colab Ngrok)
# Dùng để Backend Java gọi qua AI kiểm tra CCCD, No-show
# ==========================================
ai.server.url=https://espresso-shock-reenact.ngrok-free.dev/

# ==========================================
# TỐI ƯU HÓA SERVER YẾU (1GB RAM) VÀ TĂNG TỐC TẢI TRANG
# ==========================================
# 1. Bật nén GZIP để giảm dung lượng tải xuống (Tải web nhanh hơn đáng kể)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# 2. Giới hạn số luồng (Threads) của Tomcat để tiết kiệm RAM
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=5
server.tomcat.max-connections=500
server.tomcat.accept-count=50

# 3. Bật Cache Thymeleaf (Tránh việc render lại HTML mỗi lần load gây tốn CPU)
spring.thymeleaf.cache=true

# 4. Khởi tạo trễ (Lazy Init) giúp giảm RAM tiêu thụ khi khởi động
spring.main.lazy-initialization=true

# 5. Tối ưu hóa Cache cho tài nguyên tĩnh (Static resources như CSS, JS, Image)
spring.web.resources.cache.period=31536000
spring.web.resources.cache.cachecontrol.max-age=31536000
spring.web.resources.cache.cachecontrol.must-revalidate=true

# 6. Tối ưu bộ đệm (Buffer) cho các truy vấn DB và Response HTTP
server.tomcat.max-http-form-post-size=2MB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
