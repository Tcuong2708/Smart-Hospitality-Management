<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}">
<head>
    <title th:text="${pageTitle}">Đặt Phòng Thành Công - MAY HOTEL</title>
</head>
<body class="bg-light">

<th:block th:fragment="extra_css">
    <link rel="stylesheet" th:href="@{/frontend/home/booking/checkout.css}">
</th:block>

<div th:fragment="body_content">
    <div class="container py-5 text-center" style="margin-top: 100px; margin-bottom: 100px;">
        <div class="mb-4">
            <i class="bi bi-check-circle-fill text-success" style="font-size: 6rem; drop-shadow: 0 10px 10px rgba(25,135,84,0.2);"></i>
        </div>
        <h2 class="fw-bold text-navy mb-3">Đặt Phòng Thành Công!</h2>
        <p class="text-muted mb-5 fs-5">Cảm ơn bạn đã lựa chọn MAY HOTEL. Chúng tôi đã nhận được yêu cầu đặt phòng của bạn.<br>Nhân viên lễ tân sẽ sớm liên hệ xác nhận.</p>
        
        <div class="d-flex justify-content-center gap-3">
            <a th:href="@{/booking/history}" class="btn btn-outline-secondary py-3 px-5 fw-bold rounded-pill">Xem Lịch Sử</a>
            <a th:href="@{/rooms}" class="btn btn-gold py-3 px-5 fw-bold rounded-pill shadow-sm">Tiếp Tục Chọn Phòng</a>
        </div>
    </div>
</div>

<th:block th:fragment="extra_js">
</th:block>

</body>
</html>
