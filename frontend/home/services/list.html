<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAY HOTEL - Đặt Dịch Vụ Khách Sạn</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Custom CSS chung cho layout -->
    <link rel="stylesheet" href="../../style.css" />
    <style>
        .service-card {
            transition: all 0.3s ease;
            border-radius: 12px;
            overflow: hidden;
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            height: 100%;
        }
        .service-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        .service-img {
            height: 200px;
            object-fit: cover;
            width: 100%;
        }
        .price-tag {
            background: rgba(15, 41, 66, 0.85); /* Navy with opacity */
            backdrop-filter: blur(5px);
            color: #C5A017; /* Gold */
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.95rem;
            position: absolute;
            top: 15px;
            right: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border: 1px solid rgba(197, 160, 23, 0.4);
        }
        .btn-gold {
            background-color: #C5A017;
            color: white;
            border: none;
            transition: 0.3s;
        }
        .btn-gold:hover {
            background-color: #a68512;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(197, 160, 23, 0.3);
        }
        .filter-btn {
            border: 1px solid #0F2942;
            color: #0F2942;
            background: transparent;
            font-weight: 600;
            transition: 0.3s;
            letter-spacing: 0.5px;
        }
        .filter-btn:hover, .filter-btn.active {
            background: #0F2942;
            color: white;
            border-color: #0F2942;
            box-shadow: 0 4px 12px rgba(15,41,66,0.2);
        }
        .header-title {
            color: #0F2942;
            font-family: 'Playfair Display', serif;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="container py-5">
        <div class="text-center mb-5 position-relative">
            <h2 class="header-title mb-3 text-uppercase" style="letter-spacing: 1.5px; font-family: 'Playfair Display', serif;">Tận Hưởng Dịch Vụ Đẳng Cấp</h2>
            <div style="width: 80px; height: 3px; background-color: #C5A017; margin: 15px auto;"></div>
            <p class="text-muted mx-auto" style="max-width: 600px;">Nâng tầm kỳ nghỉ của bạn với các dịch vụ thượng hạng tại May Hotel. Đặt trước ngay hôm nay để nhận nhiều ưu đãi.</p>
        </div>

        <!-- Filter Categories -->
        <div class="d-flex justify-content-center mb-5 gap-3 flex-wrap" id="category-filters">
            <button class="btn filter-btn rounded-pill active px-4 py-2" data-category="all">Tất cả dịch vụ</button>
            <button class="btn filter-btn rounded-pill px-4 py-2" data-category="spa"><i class="bi bi-flower1 me-2 text-gold"></i>Spa & Thư giãn</button>
            <button class="btn filter-btn rounded-pill px-4 py-2" data-category="dining"><i class="bi bi-cup-hot me-2 text-gold"></i>Ẩm thực</button>
            <button class="btn filter-btn rounded-pill px-4 py-2" data-category="transport"><i class="bi bi-car-front me-2 text-gold"></i>Đưa đón</button>
        </div>

        <div class="row g-4" id="service-list">
            <!-- Rendered by JS -->
        </div>

    </div>

    <!-- Booking Modal -->
    <div class="modal fade" id="bookingServiceModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header text-white" style="background-color: #0F2942; border-bottom: 4px solid #C5A017; border-top-left-radius: calc(0.3rem - 1px); border-top-right-radius: calc(0.3rem - 1px);">
                    <h5 class="modal-title fw-bold text-uppercase d-flex align-items-center" style="letter-spacing: 1px;">
                        <i class="bi bi-stars me-2" style="color: #C5A017;"></i> <span id="modal-service-name">Tên dịch vụ</span>
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4 p-md-5">
                    <p class="text-muted small mb-4 text-center">Vui lòng điền thông tin để chúng tôi chuẩn bị dịch vụ tốt nhất cho bạn.</p>
                    
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold" style="color: #0F2942;">Ngày sử dụng <span class="text-danger">*</span></label>
                            <input type="date" class="form-control py-2" id="service-date" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold" style="color: #0F2942;">Giờ dự kiến</label>
                            <input type="time" class="form-control py-2" id="service-time">
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold" style="color: #0F2942;">Số lượng người / Khẩu phần</label>
                        <input type="number" class="form-control py-2" id="service-quantity" value="1" min="1">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold" style="color: #0F2942;">Ghi chú thêm</label>
                        <textarea class="form-control" rows="3" placeholder="Ví dụ: Dị ứng đậu phộng, yêu cầu ghế trẻ em..."></textarea>
                    </div>
                    
                    <div class="d-flex flex-column flex-md-row justify-content-between align-items-center mt-4 p-4 rounded-3 shadow-sm" style="background: linear-gradient(135deg, rgba(15,41,66,0.03) 0%, rgba(197,160,23,0.08) 100%); border-left: 5px solid #0F2942;">
                        <span class="fw-bold text-uppercase mb-2 mb-md-0" style="color: #0F2942; letter-spacing: 1px;">Tổng dự kiến:</span>
                        <h3 class="fw-bold text-danger m-0" id="modal-total-price">0 đ</h3>
                    </div>
                </div>
                <div class="modal-footer bg-light border-top-0 p-3">
                    <button type="button" class="btn btn-secondary rounded-pill px-4" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-gold rounded-pill fw-bold px-5" id="btn-confirm-book">Xác nhận Đặt</button>
                </div>
            </div>
        </div>
    </div>

<script src="../../layout.js"></script>
<script src="../../app.js"></script>
<script src="list.js"></script>
</body>
</html>
