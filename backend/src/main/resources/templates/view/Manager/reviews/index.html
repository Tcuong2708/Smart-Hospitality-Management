<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kiểm Duyệt Đánh Giá - Admin</title>
</head>
<body>

<th:block th:fragment="extra_css">
    <style>
        .bg-navy { background-color: #0F2942 !important; }
        .text-navy { color: #0F2942 !important; }
        .text-gold { color: #C5A017 !important; }
        .admin-card { border-radius: 12px; }
        .btn-gold { background-color: #C5A017 !important; color: white !important; border: none !important; }
    </style>
</th:block>

<div th:fragment="body_content">
    <div class="container py-5">
        
        <div th:if="${success}" class="alert alert-success border-0 shadow-sm text-center mb-4" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger border-0 shadow-sm text-center mb-4" th:text="${error}"></div>

        <div class="card shadow-sm border-0 admin-card">
            <div class="admin-header d-flex flex-wrap justify-content-between align-items-center gap-3 p-4" style="background-color: #0F2942; color: white; border-top-left-radius: 12px; border-top-right-radius: 12px;">
                <h3 class="fw-bold text-uppercase mb-0 text-white">
                    <i class="bi bi-chat-square-heart-fill me-2" style="color: #C5A017;"></i>Kiểm duyệt Đánh giá phản hồi
                </h3>
                
                <div class="d-flex flex-wrap align-items-center gap-3 flex-grow-1 justify-content-end">
                    <div class="input-group shadow-sm" style="max-width: 250px;">
                        <span class="input-group-text bg-white border-0"><i class="bi bi-search text-muted"></i></span>
                        <input type="text" class="form-control border-0" id="searchReview" placeholder="Tìm đánh giá...">
                    </div>
                </div>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-header-navy" style="background-color: #f8f9fa;">
                        <tr>
                            <th class="py-3 ps-4 text-uppercase small">Người dùng</th>
                            <th class="text-center text-uppercase small">Mức xếp hạng</th>
                            <th class="text-uppercase small" style="max-width: 350px;">Nội dung phản hồi</th>
                            <th class="text-center text-uppercase small">Trạng thái</th>
                            <th class="text-center text-uppercase small" style="width: 200px;">Thao tác kiểm duyệt</th>
                        </tr>
                        </thead>
                        <tbody id="review-table-body">
                            <tr th:if="${reviews == null or #lists.isEmpty(reviews)}">
                                <td colspan="5" class="text-center py-5 text-muted">
                                    Không có đánh giá nào.
                                </td>
                            </tr>
                            <tr th:each="r : ${reviews}" class="review-row">
                                <td class="ps-4">
                                    <h6 class="fw-bold text-navy mb-0" th:text="${r.hoTen}">Tên Khách</h6>
                                    <small class="text-muted" th:text="${r.ngayDanhGia}">10/10/2026</small>
                                </td>
                                <td class="text-center text-warning fs-5">
                                    <th:block th:each="i : ${#numbers.sequence(1, 5)}">
                                        <i class="bi" th:classappend="${i <= r.soSao} ? 'bi-star-fill' : 'bi-star'"></i>
                                    </th:block>
                                </td>
                                <td>
                                    <p class="mb-1 text-dark review-content-text" th:text="${r.noiDung}">Nội dung</p>
                                    <div th:if="${r.reply != null and !r.reply.isEmpty()}" class="p-2 bg-light rounded mt-2 small">
                                        <strong class="text-navy"><i class="bi bi-reply-fill text-gold"></i> MAY HOTEL:</strong>
                                        <span th:text="${r.reply}">Phản hồi</span>
                                    </div>
                                </td>
                                <td class="text-center">
                                    <span class="badge rounded-pill" th:classappend="${r.status == 'Hiện' ? 'bg-success' : 'bg-secondary'}" th:text="${r.status}">Hiện</span>
                                </td>
                                <td class="text-center">
                                    <div class="d-flex gap-2 justify-content-center">
                                        <button class="btn btn-sm btn-outline-primary btn-reply" 
                                                th:data-id="${r.id}" th:data-content="${r.noiDung}" 
                                                title="Phản hồi khách hàng">
                                            <i class="bi bi-reply-all-fill"></i>
                                        </button>
                                        <form th:action="@{/admin/reviews/toggle-status/{id}(id=${r.id})}" method="post" style="display:inline;">
                                            <button type="submit" class="btn btn-sm" th:classappend="${r.status == 'Hiện' ? 'btn-outline-secondary' : 'btn-outline-success'}"
                                                    th:title="${r.status == 'Hiện' ? 'Ẩn đánh giá' : 'Hiển thị đánh giá'}">
                                                <i class="bi" th:classappend="${r.status == 'Hiện' ? 'bi-eye-slash-fill' : 'bi-eye-fill'}"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Phản hồi đánh giá -->
    <div class="modal fade" id="replyModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header text-white" style="background-color: #0F2942; border-bottom: 4px solid #C5A017; border-top-left-radius: calc(0.3rem - 1px); border-top-right-radius: calc(0.3rem - 1px);">
                    <h5 class="modal-title fw-bold text-uppercase d-flex align-items-center" style="letter-spacing: 1px;">
                        <span class="d-inline-flex justify-content-center align-items-center me-2" style="background-color: #C5A017; color: #0F2942; width: 24px; height: 24px; border-radius: 4px; font-size: 14px; font-weight: 900; line-height: 1;"><i class="bi bi-reply-all-fill"></i></span>
                        Phản hồi từ Khách sạn
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="replyForm" th:action="@{/admin/reviews/reply/0}" method="post">
                    <div class="modal-body p-4">
                        <div class="p-3 bg-light rounded border mb-3">
                            <small class="text-muted fw-bold text-uppercase d-block mb-1">Nội dung đánh giá:</small>
                            <p class="mb-0 text-dark fst-italic" id="reply-review-content">"..."</p>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nhập nội dung phản hồi <span class="text-danger">*</span></label>
                            <textarea class="form-control" name="replyContent" id="reply-content" rows="4" placeholder="VD: Cảm ơn quý khách đã tin tưởng..." required></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="submit" class="btn btn-gold fw-bold px-4">Gửi phản hồi</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<th:block th:fragment="extra_js">
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Hiển thị modal phản hồi
            const replyButtons = document.querySelectorAll('.btn-reply');
            const replyForm = document.getElementById('replyForm');
            const replyContentDisplay = document.getElementById('reply-review-content');
            
            if (replyButtons && replyForm) {
                const modal = new bootstrap.Modal(document.getElementById('replyModal'));
                replyButtons.forEach(btn => {
                    btn.addEventListener('click', () => {
                        const id = btn.getAttribute('data-id');
                        const content = btn.getAttribute('data-content');
                        
                        replyContentDisplay.textContent = '"' + content + '"';
                        replyForm.action = '/admin/reviews/reply/' + id;
                        document.getElementById('reply-content').value = '';
                        
                        modal.show();
                    });
                });
            }

            // Tìm kiếm trực tiếp
            const searchInput = document.getElementById('searchReview');
            if (searchInput) {
                searchInput.addEventListener('keyup', (e) => {
                    const text = e.target.value.toLowerCase();
                    document.querySelectorAll('.review-row').forEach(row => {
                        const rowText = row.innerText.toLowerCase();
                        row.style.display = rowText.includes(text) ? '' : 'none';
                    });
                });
            }
        });
    </script>
</th:block>

</body>
</html>
