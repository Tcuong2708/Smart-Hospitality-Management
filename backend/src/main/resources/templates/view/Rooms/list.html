<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}">
<head>
    <title>MAY HOTEL - Danh Sách Phòng</title>
</head>
<body>

<th:block th:fragment="extra_css">
    <link rel="stylesheet" th:href="@{/frontend/home/rooms/list.css}">
</th:block>

<div th:fragment="body_content">
    <div class="container py-4">
        <div class="admin-card mb-4">
            <div class="admin-header d-flex justify-content-center align-items-center">
                <h3 class="fw-bold text-uppercase mb-0">
                    <i class="bi bi-grid-fill me-2"></i>Danh Sách Phòng Nghỉ
                </h3>
            </div>
            
            <div class="card-body p-4">
                <div class="card shadow-sm mb-4 border-0 bg-light">
                    <div class="card-body p-4">
                        <form th:action="@{/rooms}" method="get" id="search-form">
                            <!-- Retain filters when searching -->
                            <input type="hidden" name="maLoai" th:value="${currentMaLoai}" th:if="${currentMaLoai != null}" />
                            <input type="hidden" name="priceRange" th:value="${currentPriceRange}" th:if="${currentPriceRange != null && !currentPriceRange.isEmpty()}" />
                            
                            <div class="row gx-3 align-items-center justify-content-center">
                                <div class="col-md-8">
                                    <div class="input-group">
                                        <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                                        <input type="text" name="searchString" class="form-control border-start-0 py-2" placeholder="Tìm theo tên phòng..." th:value="${searchString}" />
                                        <button type="submit" class="btn btn-search fw-bold text-uppercase">TÌM KIẾM</button>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-3 order-md-1 order-2 mt-4 mt-md-0">
                        <div class="filter-card">
                            <div class="filter-header"><i class="bi bi-bookmark-star-fill me-2"></i>Loại Phòng</div>
                            <div class="list-group list-group-flush" id="category-filter">
                                <a th:href="@{/rooms(priceRange=${currentPriceRange}, searchString=${searchString})}" 
                                   th:classappend="${currentMaLoai == null ? 'active' : ''}" 
                                   class="list-group-item list-group-item-action">Tất cả</a>
                                
                                <a th:each="loai : ${listLoai}" 
                                   th:href="@{/rooms(maLoai=${loai.id}, priceRange=${currentPriceRange}, searchString=${searchString})}" 
                                   th:classappend="${currentMaLoai != null && currentMaLoai == loai.id ? 'active' : ''}"
                                   class="list-group-item list-group-item-action">
                                    <th:block th:text="${loai.name}"></th:block>
                                </a>
                            </div>
                        </div>

                        <div class="filter-card">
                            <div class="filter-header"><i class="bi bi-cash-stack me-2"></i>Khoảng Giá</div>
                            <div class="list-group list-group-flush" id="price-filter">
                                <a th:href="@{/rooms(maLoai=${currentMaLoai}, searchString=${searchString})}" 
                                   th:classappend="${currentPriceRange == null || currentPriceRange.isEmpty() ? 'active' : ''}" 
                                   class="list-group-item list-group-item-action">Tất cả mức giá</a>
                                
                                <a th:href="@{/rooms(priceRange='lt500', maLoai=${currentMaLoai}, searchString=${searchString})}" 
                                   th:classappend="${currentPriceRange == 'lt500' ? 'active' : ''}" 
                                   class="list-group-item list-group-item-action">Dưới 500k</a>
                                
                                <a th:href="@{/rooms(priceRange='500-1000', maLoai=${currentMaLoai}, searchString=${searchString})}" 
                                   th:classappend="${currentPriceRange == '500-1000' ? 'active' : ''}" 
                                   class="list-group-item list-group-item-action">500k - 1 Triệu</a>
                                
                                <a th:href="@{/rooms(priceRange='gt2000', maLoai=${currentMaLoai}, searchString=${searchString})}" 
                                   th:classappend="${currentPriceRange == 'gt2000' ? 'active' : ''}" 
                                   class="list-group-item list-group-item-action">Trên 2 triệu</a>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-9 order-md-2 order-1">
                        
                        <!-- List rooms -->
                        <div class="row gx-4 gy-4" id="room-list" th:if="${!#lists.isEmpty(listPhong)}">
                            
                            <!-- Bắt đầu vòng lặp hiển thị phòng -->
                            <div class="col-lg-4 col-md-6" th:each="p : ${listPhong}">
                                <div class="card h-100 room-card shadow-sm border" style="border-radius: 8px;">
                                    <div class="room-img-wrapper position-relative">
                                        <span class="badge bg-danger position-absolute top-0 start-0 m-3 px-2 py-1"><i class="bi bi-fire me-1"></i> HOT DEAL</span>
                                        <a th:href="@{/rooms/detail/{id}(id=${p.maLoai})}">
                                            <img th:src="${!#lists.isEmpty(p.phongs) && p.phongs[0].imageUrl != null && p.phongs[0].imageUrl.startsWith('http') ? p.phongs[0].imageUrl : (!#lists.isEmpty(p.phongs) && p.phongs[0].imageUrl != null && p.phongs[0].imageUrl.contains('.') ? '/frontend/images/' + p.phongs[0].imageUrl : '/frontend/images/default.jpg')}" class="card-img-top room-img" th:alt="${p.name}">
                                        </a>
                                    </div>
                                    <div class="card-body d-flex flex-column text-center p-4">
                                        <small class="text-muted text-uppercase fw-bold mb-3" style="font-size: 0.75rem;">
                                            <i class="bi bi-people-fill me-1 text-secondary"></i> Sức chứa: <th:block th:text="${p.soNguoi != null ? p.soNguoi : '2'}"></th:block> người
                                        </small>
                                        <h5 class="card-title fw-bold mb-3">
                                            <a th:href="@{/rooms/detail/{id}(id=${p.maLoai})}" class="text-decoration-none" style="color: var(--navy-color);" th:text="${p.name}">Tên Phòng</a>
                                        </h5>
                                        <p class="mb-4">
                                            <span class="fw-bold fs-5" style="color: #dc3545;" th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')}">500,000</span>
                                            <small class="text-muted fw-normal ms-1">đ/ đêm</small>
                                        </p>
                                        <div class="mt-auto row g-2 align-items-stretch">
                                            <div class="col-6">
                                                <a th:href="@{/rooms/detail/{id}(id=${p.maLoai})}" class="btn btn-outline-dark fw-bold w-100 h-100 d-flex align-items-center justify-content-center text-uppercase" style="border-radius: 4px; font-size: 0.85rem; min-height: 42px;">
                                                    Chi tiết
                                                </a>
                                            </div>
                                            <div class="col-6">
                                                <a th:href="@{/booking/book(maLoai=${p.maLoai})}" class="btn btn-gold text-white fw-bold w-100 h-100 d-flex align-items-center justify-content-center text-uppercase" style="background-color: #C5A017; border: none; border-radius: 4px; font-size: 0.85rem; min-height: 42px;">
                                                    <i class="bi bi-calendar-check-fill me-1"></i> Đặt ngay
                                                </a>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <!-- Kết thúc vòng lặp -->
                            
                        </div>

                        <!-- No results -->
                        <div id="no-results" class="text-center py-5" th:if="${#lists.isEmpty(listPhong)}">
                            <i class="bi bi-search display-1 text-muted opacity-25"></i>
                            <h3 class="mt-3 text-muted">Không tìm thấy phòng phù hợp.</h3>
                            <a th:href="@{/rooms}" class="btn btn-outline-secondary mt-2">Xóa bộ lọc</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block th:fragment="extra_js">
    <!-- No external JS needed because filters are SSR -->
</th:block>

</body>
</html>
