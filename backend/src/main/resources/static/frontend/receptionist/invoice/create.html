<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo Đơn Đặt Phòng - MAY HOTEL</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/create.css" />

  <!-- CÁC FILE CSS ĐƯỢC CHÈN SẴN ĐỂ TRÁNH FOUC (FLASH OF UNSTYLED CONTENT) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../../style.css" />
  <style>
    .navbar-nav .nav-link.active-menu {
      font-weight: 700 !important;
      color: #d4af37 !important; /* Màu vàng Gold */
      background-color: rgba(212, 175, 55, 0.1); /* Nền mờ */
      border-radius: 8px; /* Bo tròn góc */
      padding: 8px 16px !important; /* Tạo khoảng trống xung quanh chữ */
      transition: 0.3s all ease-in-out;
    }
  </style>

</head>
<body>
    <div class="container py-4">
        <div class="card shadow border-0 mb-4 rounded-3 overflow-hidden">
            <div class="card-header py-3 bg-navy text-white">
                <h6 class="m-0 font-weight-bold text-uppercase">
                    <i class="bi bi-plus-circle-fill me-2 text-gold"></i>Tạo đơn đặt phòng (Khách lẻ / Điện thoại)
                </h6>
            </div>
            <div class="card-body p-4">
                <div id="alert-container"></div>
                
                <form id="create-form">
                    <div class="row">
                        <div class="col-md-6 border-end">
                            <h5 class="text-navy mb-3 border-bottom pb-2 fw-bold">
                                <i class="bi bi-person-lines-fill me-2"></i>1. Thông tin khách hàng
                            </h5>
                            <div class="mb-3">
                                <label class="form-label">Họ và tên khách (*)</label>
                                <input type="text" id="hoTen" name="hoTen" class="form-control border-2" placeholder="Nhập tên khách..." required />
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Số điện thoại (*)</label>
                                <input type="text" id="sdt" name="sdt" class="form-control border-2" placeholder="Số điện thoại..." required />
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Địa chỉ khách trú ngụ</label>
                                <textarea id="diaChi" name="diaChi" class="form-control border-2" rows="3" placeholder="Nhập địa chỉ..."></textarea>
                            </div>
                        </div>

                        <div class="col-md-6 ps-md-4">
                            <h5 class="text-navy mb-3 border-bottom pb-2 fw-bold">
                                <i class="bi bi-calendar-check-fill me-2"></i>2. Chọn phòng & Thời gian
                            </h5>
                            <div class="mb-3">
                                <label class="form-label text-danger">Chọn Phòng Trống (*)</label>
                                <select id="maPhong" name="maPhong" class="form-select border-2 fw-bold text-navy" required>
                                    <option value="">-- Đang tải danh sách phòng trống --</option>
                                </select>
                                <small class="text-muted fst-italic">Hệ thống chỉ hiện các phòng đang ở trạng thái Trống (Sẵn sàng).</small>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Ngày nhận phòng</label>
                                    <input type="date" id="ngayCheckIn" name="ngayCheckIn" class="form-control border-2" required />
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Ngày trả phòng</label>
                                    <input type="date" id="ngayCheckOut" name="ngayCheckOut" class="form-control border-2" required />
                                </div>
                            </div>

                            <div class="alert alert-info border-0 mt-3 bg-light text-navy border-start border-4 border-navy shadow-sm">
                                <i class="bi bi-info-circle-fill me-1 text-gold"></i> Giá tiền sẽ được tự động hệ thống tính toán dựa trên <b>Giá phòng vật lý</b> x <b>Số ngày lưu trú thực tế</b>.
                            </div>

                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn btn-gold-action py-2 fw-bold rounded-pill">
                                    <i class="bi bi-check-circle me-2"></i>XÁC NHẬN ĐẶT PHÒNG KHÁCH SẠN
                                </button>
                                <a href="index.html" class="btn btn-secondary-custom py-2 fw-bold rounded-pill text-center">
                                    <i class="bi bi-x-circle me-1"></i>Hủy bỏ thao tác
                                </a>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/create.js"></script>
<script src="../../layout.js"></script>
<script src="../../app.js"></script>
</body>
</html>
