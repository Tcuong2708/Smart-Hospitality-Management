<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:fragment="extra_css">
        <link rel="stylesheet" th:href="@{/css/room-map.css}" />
        <style>
            .room-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; padding: 20px 0; }
            .room-card { border: 2px solid #1A1A1A; border-radius: 12px; background: #FFFFFF; transition: all 0.2s ease; }
            .room-card:hover { transform: translateY(-3px); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
            
            /* Màu trạng thái viền trái phòng vật lý */
            .status-empty { border-left: 8px solid #198754; }    /* Xanh - Trống */
            .status-occupied { border-left: 8px solid #DC3545; } /* Đỏ - Có khách */
            .status-dirty { border-left: 8px solid #FFC107; }    /* Vàng - Chờ dọn dẹp */

            .btn-action { font-size: 0.85rem; font-weight: bold; border-radius: 6px; width: 100%; text-align: center; }
            .btn-gold { background-color: #C5A017 !important; color: white !important; border: none !important; }
        </style>
    </th:block>
</head>
<body>

<div th:fragment="body_content" class="container-fluid py-4">
    <div class="admin-card mb-4">
        <div class="admin-header d-flex flex-wrap justify-content-between align-items-center gap-3">
            <h3 class="fw-bold text-uppercase mb-0">
                <i class="bi bi-grid-3x3-gap-fill me-2" style="color: #ffc107;"></i>Sơ đồ phòng nghỉ
            </h3>
            <div class="d-flex flex-wrap align-items-center gap-2 flex-grow-1 justify-content-end">
                <div class="dropdown">
                    <button class="btn bg-white border-0 shadow-sm dropdown-toggle text-muted fw-bold" type="button" data-bs-toggle="dropdown" aria-expanded="false" data-bs-auto-close="outside">
                        <i class="bi bi-building me-1"></i> Lọc Tầng
                    </button>
                    <ul class="dropdown-menu shadow p-2" id="filterFloorDropdown" style="min-width: 200px;">
                        <!-- Checkbox load từ JS -->
                    </ul>
                </div>

                <div class="dropdown">
                    <button class="btn bg-white border-0 shadow-sm dropdown-toggle text-muted fw-bold" type="button" data-bs-toggle="dropdown" aria-expanded="false" data-bs-auto-close="outside">
                        <i class="bi bi-tag me-1"></i> Lọc Loại Phòng
                    </button>
                    <ul class="dropdown-menu shadow p-2" id="filterTypeDropdown" style="min-width: 200px;">
                        <!-- Checkbox load từ JS -->
                    </ul>
                </div>

                <div class="dropdown">
                    <button class="btn bg-white border-0 shadow-sm dropdown-toggle text-muted fw-bold" type="button" data-bs-toggle="dropdown" aria-expanded="false" data-bs-auto-close="outside">
                        <i class="bi bi-people me-1"></i> Lọc Sức Chứa
                    </button>
                    <ul class="dropdown-menu shadow p-2" id="filterCapacityDropdown" style="min-width: 200px;">
                        <!-- Checkbox load từ JS -->
                    </ul>
                </div>

                <div class="dropdown">
                    <button class="btn bg-white border-0 shadow-sm dropdown-toggle text-muted fw-bold" type="button" data-bs-toggle="dropdown" aria-expanded="false" data-bs-auto-close="outside">
                        <i class="bi bi-funnel me-1"></i> Lọc Trạng Thái
                    </button>
                    <ul class="dropdown-menu shadow p-2" id="filterStatusDropdown" style="min-width: 200px;">
                        <!-- Checkbox load từ JS -->
                    </ul>
                </div>

                <a th:href="@{/receptionist/booking}" class="btn btn-navy text-white fw-bold shadow-sm" style="background-color: #0F2942;">
                    <i class="bi bi-plus-circle-fill me-2"></i>Thêm đặt phòng
                </a>
                <a th:href="@{/receptionist/check-in}" class="btn btn-gold px-4 shadow-sm text-white fw-bold" style="background: #C5A017;">
                    <i class="bi bi-journal-bookmark-fill me-2"></i>DS Chờ Check-in
                </a>
            </div>
        </div>

        <div class="card-body p-4">
            <div class="d-flex gap-4 p-3 bg-white rounded shadow-sm border mb-4" style="font-size: 0.9rem;">
                <span class="fw-bold"><i class="bi bi-square-fill text-success me-1"></i>Phòng trống</span>
                <span class="fw-bold"><i class="bi bi-square-fill text-danger me-1"></i>Đang ở (Check-in)</span>
                <span class="fw-bold"><i class="bi bi-square-fill text-warning me-1"></i>Chờ dọn dẹp (Sau Check-out)</span>
            </div>

    <th:block th:each="floorEntry : ${rooms}">
        <div class="floor-section mb-4 mt-2">
            <h4 class="fw-bold text-navy mb-3 pb-2 border-bottom border-warning border-2" style="color: #0F2942;" th:text="${'Tầng ' + floorEntry.key}">Tầng 1</h4>
            
            <div class="room-grid" style="padding: 10px 0;">
                <th:block th:each="room : ${floorEntry.value}">
                    <div class="room-card p-3 d-flex flex-column justify-content-between"
                         th:attr="data-type=${room.maLoai}, data-capacity=${room.sucChua}"
                         th:classappend="${room.maTrangThai == 1 ? 'status-empty' : (room.maTrangThai == 2 ? 'status-occupied' : 'status-dirty')}">

                        <div>
                            <div class="d-flex justify-content-between align-items-start">
                                <h5 class="fw-bold text-dark m-0" th:text="${'Phòng ' + #strings.replace(room.name, 'P', '')}">Phòng 101</h5>
                                <span class="badge bg-light text-dark border fw-bold" th:text="${room.maLoai}">Hạng phòng</span>
                            </div>
                            <p class="text-muted small mt-1 mb-2">
                                <i class="bi bi-people-fill me-1"></i>Tối đa: <span th:text="${room.sucChua}">2</span> người
                            </p>
                        </div>

                        <div class="mt-3">
                            <a th:if="${room.maTrangThai == 1}"
                               th:href="@{/receptionist/check-in(roomId=${room.id})}"
                               class="btn btn-success btn-action py-1">
                                <i class="bi bi-box-arrow-in-right me-1"></i>Check-In
                            </a>

                            <div th:if="${room.maTrangThai == 2}" class="d-flex gap-2">
                                <a th:href="@{/receptionist/check-out(roomId=${room.id})}"
                                   class="btn btn-danger btn-action py-1 flex-grow-1">
                                    <i class="bi bi-box-arrow-left me-1"></i>Check-Out
                                </a>
                                <button type="button" 
                                        class="btn btn-info text-white btn-action py-1 px-3 fw-bold"
                                        style="background-color: #0dcaf0; border-color: #0dcaf0;"
                                        th:attr="onclick=|openChangeRoomModal('${room.id}', '${room.name}')|">
                                    <i class="bi bi-arrow-left-right me-1"></i>Đổi
                                </button>
                            </div>

                            <button th:if="${room.maTrangThai == 3}"
                                    class="btn btn-warning text-dark btn-action py-1" disabled>
                                <i class="bi bi-hourglass-split me-1"></i>Chờ dọn dẹp...
                            </button>
                        </div>

                    </div>
                </th:block>
            </div>
        </div>
    </th:block>
    </div>
</div>

<th:block th:fragment="extra_js">
<!-- Modal Đổi Phòng -->
<div class="modal fade" id="changeRoomModal" tabindex="-1" aria-labelledby="changeRoomModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-header bg-navy text-white" style="background-color: #0F2942;">
        <h5 class="modal-title fw-bold" id="changeRoomModalLabel"><i class="bi bi-arrow-left-right me-2"></i>Đổi Phòng Lược Trú</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form th:action="@{/receptionist/change-room/execute}" method="post">
          <div class="modal-body p-4">
              <input type="hidden" name="oldRoomId" id="changeOldRoomId">
              
              <div class="mb-3">
                  <label class="form-label text-muted fw-bold small">Phòng hiện tại</label>
                  <input type="text" class="form-control bg-light fw-bold text-dark" id="changeOldRoomName" readonly disabled>
              </div>

              <div class="mb-3">
                  <label class="form-label text-navy fw-bold small" style="color: #0F2942;">Chọn phòng mới <span class="text-danger">*</span></label>
                  <select name="newRoomId" class="form-select border-warning shadow-sm" required>
                      <option value="" selected disabled>-- Vui lòng chọn phòng trống --</option>
                      <th:block th:each="er : ${emptyRooms}">
                          <option th:value="${er.id}" th:text="${'Phòng ' + #strings.replace(er.name, 'P', '') + ' - Giá: ' + #numbers.formatDecimal(er.price, 0, 'COMMA', 0, 'POINT') + ' VNĐ'}"></option>
                      </th:block>
                  </select>
                  <div class="form-text text-muted"><i class="bi bi-info-circle me-1"></i>Hóa đơn hiện tại sẽ được chuyển sang phòng mới.</div>
              </div>
          </div>
          <div class="modal-footer bg-light border-0">
            <button type="button" class="btn btn-secondary px-4 fw-bold" data-bs-dismiss="modal">Hủy</button>
            <button type="submit" class="btn btn-info text-white px-4 fw-bold" style="background-color: #0dcaf0; border-color: #0dcaf0;">Xác nhận đổi</button>
          </div>
      </form>
    </div>
  </div>
</div>

<script>
function openChangeRoomModal(roomId, roomName) {
    document.getElementById('changeOldRoomId').value = roomId;
    document.getElementById('changeOldRoomName').value = 'Phòng ' + roomName.replace('P', '');
    const modal = new bootstrap.Modal(document.getElementById('changeRoomModal'));
    modal.show();
}

document.addEventListener('DOMContentLoaded', () => {
    // Build Tầng Dropdown
    const floorDropdown = document.getElementById('filterFloorDropdown');
    const floors = document.querySelectorAll('.floor-section');
    floors.forEach(floor => {
        const floorName = floor.querySelector('h4').textContent.trim();
        const floorId = floorName;
        const safeId = floorId.replace(/\s+/g, '-');
        floor.setAttribute('data-floor', floorId);
        
        const li = document.createElement('li');
        li.innerHTML = `
            <div class="form-check px-3 py-1">
                <input class="form-check-input filter-floor-cb" type="checkbox" value="${floorId}" id="cb-floor-${safeId}" checked>
                <label class="form-check-label" style="cursor: pointer; width: 100%;" for="cb-floor-${safeId}">${floorName}</label>
            </div>
        `;
        floorDropdown.appendChild(li);
    });

    // Build Trạng Thái Dropdown
    const statusDropdown = document.getElementById('filterStatusDropdown');
    const statuses = [
        { val: 'status-empty', label: 'Phòng trống' },
        { val: 'status-occupied', label: 'Đang ở' },
        { val: 'status-dirty', label: 'Chờ dọn dẹp' }
    ];
    statuses.forEach(st => {
        const li = document.createElement('li');
        li.innerHTML = `
            <div class="form-check px-3 py-1">
                <input class="form-check-input filter-status-cb" type="checkbox" value="${st.val}" id="cb-st-${st.val}" checked>
                <label class="form-check-label" style="cursor: pointer; width: 100%;" for="cb-st-${st.val}">${st.label}</label>
            </div>
        `;
        statusDropdown.appendChild(li);
    });

    // Build Loại Phòng & Sức Chứa Dropdowns từ DOM
    const typeDropdown = document.getElementById('filterTypeDropdown');
    const capacityDropdown = document.getElementById('filterCapacityDropdown');
    const uniqueTypes = new Set();
    const uniqueCapacities = new Set();

    document.querySelectorAll('.room-card').forEach(room => {
        uniqueTypes.add(room.getAttribute('data-type'));
        uniqueCapacities.add(room.getAttribute('data-capacity'));
    });

    Array.from(uniqueTypes).sort().forEach(type => {
        const safeId = type.replace(/\s+/g, '-');
        const li = document.createElement('li');
        li.innerHTML = `
            <div class="form-check px-3 py-1">
                <input class="form-check-input filter-type-cb" type="checkbox" value="${type}" id="cb-type-${safeId}" checked>
                <label class="form-check-label" style="cursor: pointer; width: 100%;" for="cb-type-${safeId}">${type}</label>
            </div>
        `;
        typeDropdown.appendChild(li);
    });

    Array.from(uniqueCapacities).sort((a, b) => Number(a) - Number(b)).forEach(cap => {
        const li = document.createElement('li');
        li.innerHTML = `
            <div class="form-check px-3 py-1">
                <input class="form-check-input filter-capacity-cb" type="checkbox" value="${cap}" id="cb-cap-${cap}" checked>
                <label class="form-check-label" style="cursor: pointer; width: 100%;" for="cb-cap-${cap}">${cap} người</label>
            </div>
        `;
        capacityDropdown.appendChild(li);
    });

    // Event Listeners for Filters
    const applyFilters = () => {
        const activeFloors = Array.from(document.querySelectorAll('.filter-floor-cb:checked')).map(cb => cb.value);
        const activeStatuses = Array.from(document.querySelectorAll('.filter-status-cb:checked')).map(cb => cb.value);
        const activeTypes = Array.from(document.querySelectorAll('.filter-type-cb:checked')).map(cb => cb.value);
        const activeCapacities = Array.from(document.querySelectorAll('.filter-capacity-cb:checked')).map(cb => cb.value);

        document.querySelectorAll('.floor-section').forEach(floor => {
            const floorId = floor.getAttribute('data-floor');
            if (!activeFloors.includes(floorId)) {
                floor.style.display = 'none';
            } else {
                floor.style.display = '';
                let hasVisibleRoom = false;
                floor.querySelectorAll('.room-card').forEach(room => {
                    let roomStatus = '';
                    if (room.classList.contains('status-empty')) roomStatus = 'status-empty';
                    else if (room.classList.contains('status-occupied')) roomStatus = 'status-occupied';
                    else if (room.classList.contains('status-dirty')) roomStatus = 'status-dirty';

                    let roomType = room.getAttribute('data-type');
                    let roomCapacity = room.getAttribute('data-capacity');

                    if (activeStatuses.includes(roomStatus) && activeTypes.includes(roomType) && activeCapacities.includes(roomCapacity)) {
                        room.style.display = '';
                        hasVisibleRoom = true;
                    } else {
                        room.style.display = 'none';
                    }
                });
                
                // Ẩn luôn tầng nếu không có phòng nào hiển thị
                if (!hasVisibleRoom) {
                     floor.style.display = 'none';
                }
            }
        });
    };

    document.querySelectorAll('.filter-floor-cb, .filter-status-cb, .filter-type-cb, .filter-capacity-cb').forEach(cb => {
        cb.addEventListener('change', applyFilters);
    });
});
</script>
</th:block>

</body>
</html>
