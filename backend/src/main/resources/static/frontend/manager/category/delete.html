<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xóa Loại Phòng</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/delete.css">

  <!-- CÁC FILE CSS ĐƯỢC CHÈN SẴN ĐỂ TRÁNH FOUC (FLASH OF UNSTYLED CONTENT) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../../style.css" />
  <style>
    .navbar-nav .nav-link.active-menu {
      font-weight: 700 !important;
      color: #d4af37 !important; /* Màu vàng Gold */
      background-color: rgba(212, 175, 55, 0.1); /* Nền mờ */
      border-radius: 8px; /* Bo tròn góc */
      padding: 8px 16px !important; /* Tạo khoảng trống xung quanh chữ */
      transition: 0.3s all ease-in-out;
    }
  </style>

</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card delete-card shadow-lg border-0">
                    <div class="delete-header rounded-top">
                        <h3 class="mb-0 fw-bold text-uppercase" style="letter-spacing: 1px;">
                            <i class="bi bi-trash3-fill me-2 text-gold"></i>Xóa Loại Phòng
                        </h3>
                    </div>

                    <div class="card-body p-4 text-center">
                        <div id="alert-container"></div>
                        <p class="text-muted mb-4 fs-5">Bạn có chắc chắn muốn xóa danh mục này?</p>

                        <div class="py-2">
                            <h2 class="fw-bold text-navy mb-1" id="category-name">Đang tải...</h2>
                            <span class="badge bg-light text-dark border" id="category-id">Mã số: #...</span>
                        </div>

                        <div class="warning-box shadow-sm text-start mx-auto mt-4 mb-4">
                            <div class="d-flex align-items-center">
                                <i class="bi bi-exclamation-triangle-fill text-gold me-3 fs-3"></i>
                                <div>
                                    <strong>Lưu ý quan trọng:</strong><br />
                                    Hành động này <span class="text-danger fw-bold">không thể hoàn tác</span>. Tất cả các phòng thuộc loại này có thể bị ảnh hưởng dữ liệu.
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-center gap-3 mt-4 pt-3 border-top">
                            <a href="index.html" class="btn btn-outline-secondary px-4 py-2 fw-bold modern-btn">
                                <i class="bi bi-arrow-left me-1"></i> Hủy bỏ
                            </a>
                            <button type="button" id="btn-delete" class="btn btn-danger px-4 py-2 fw-bold shadow-sm modern-btn-danger">
                                <i class="bi bi-trash-fill me-1"></i> Xóa vĩnh viễn
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom JS -->
    <script src="js/delete.js"></script>
<script src="../../layout.js"></script>
<script src="../../app.js"></script>
</body>
</html>
