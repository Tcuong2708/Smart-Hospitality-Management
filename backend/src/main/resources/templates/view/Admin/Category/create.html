<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<th:block th:fragment="extra_css">
    <link rel="stylesheet" th:href="@{/css/Admin/Category/create.css}" />
</th:block>

<div th:fragment="body_content">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card admin-form-card">
                    <div class="admin-header">
                        <h3 class="mb-0 fw-bold text-uppercase" style="letter-spacing: 1px;">
                            <i class="bi bi-tags-fill me-2 text-gold"></i>Thêm Loại Phòng Mới
                        </h3>
                    </div>

                    <div class="card-body p-4">
                        <form th:action="@{/admin/categories/create}" th:object="${loaiPhong}" method="post">
                            <div class="mb-4">
                                <label class="form-label">Tên loại phòng <span class="text-danger">*</span></label>
                                <input type="text"
                                       name="name"
                                       th:value="${loaiPhong != null ? loaiPhong.name : ''}"
                                       class="form-control form-control-lg"
                                       placeholder="Ví dụ: Phòng đôi, Phòng đơn.."
                                       required />
                            </div>

                            <div class="d-flex justify-content-between align-items-center pt-3 border-top mt-4">
                                <a th:href="@{/admin/categories}" class="btn btn-outline-secondary px-4">
                                    <i class="bi bi-arrow-left"></i> Quay lại
                                </a>
                                <button type="submit" class="btn btn-gold px-4 shadow-sm">
                                    <i class="bi bi-plus-circle me-1"></i> THÊM MỚI
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:fragment="extra_js"></div>
</html>
