<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xóa Phòng - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="admin-room.css">

  <!-- CÁC FILE CSS ĐƯỢC CHÈN SẴN ĐỂ TRÁNH FOUC (FLASH OF UNSTYLED CONTENT) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../../style.css" />
  <style>
    .navbar-nav .nav-link.active-menu {
      font-weight: 700 !important;
      color: #d4af37 !important; /* Màu vàng Gold */
      background-color: rgba(212, 175, 55, 0.1); /* Nền mờ */
      border-radius: 8px; /* Bo tròn góc */
      padding: 8px 16px !important; /* Tạo khoảng trống xung quanh chữ */
      transition: 0.3s all ease-in-out;
    }
  </style>

</head>
<body>
    <div class="container py-5 mt-5">
        <a href="index.html" class="text-decoration-none text-muted mb-3 d-inline-block">
            <i class="bi bi-arrow-left me-1"></i> Trở về Quản lý phòng
        </a>

        <div class="admin-card text-center py-5 px-4 mx-auto" style="max-width: 550px;">
            <i class="bi bi-exclamation-triangle-fill text-danger mb-3 d-block" style="font-size: 5rem;"></i>
            <h3 class="fw-bold text-navy">Xác nhận xóa phòng?</h3>
            <p class="text-muted mt-3 fs-6">
                Bạn có chắc chắn muốn xóa phòng <strong id="room-name" class="text-danger fs-5">...</strong> không? <br>
                Hành động này không thể hoàn tác và sẽ xóa hoàn toàn khỏi CSDL.
            </p>
            
            <div class="mt-5">
                <a href="index.html" class="btn btn-secondary px-5 py-2 me-2 rounded-pill fw-bold">Hủy Bỏ</a>
                <button id="btn-confirm-delete" class="btn btn-danger px-5 py-2 rounded-pill fw-bold shadow-sm">
                    <i class="bi bi-trash-fill me-1"></i> Xóa Vĩnh Viễn
                </button>
            </div>
        </div>
    </div>
    <script src="delete.js"></script>
<script src="../../layout.js"></script>
<script src="../../app.js"></script>

</html>
