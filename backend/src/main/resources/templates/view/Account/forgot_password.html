0<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đặt lại mật khẩu mới</title>
</head>
<body>
<div th:fragment="body_content">
    <div class="login-wrapper py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-5">
                    <div class="card card-login shadow-lg border-0">
                        <div class="card-header-login text-center py-4 text-white" style="background-color: #001f3f;">
                            <h3 class="fw-bold text-white">Mật khẩu mới</h3>
                            <p class="mb-0 small opacity-75">Vui lòng thiết lập mật khẩu mới bảo mật hơn cho tài khoản</p>
                        </div>
                        <div class="card-body p-4 p-md-5">

                            <div th:if="${error != null}" class="alert alert-danger text-center mb-4">
                                <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
                            </div>

                            <form th:action="@{/account/reset_password}" method="post">
                                <div class="mb-4">
                                    <label class="form-label fw-bold" style="color: #001f3f;">Mật khẩu mới <span class="text-danger">*</span></label>
                                    <input type="password" name="newPassword" class="form-control form-control-lg" placeholder="Nhập mật khẩu mới" required />
                                </div>

                                <button type="submit" class="btn w-100 py-3 fw-bold text-white shadow-sm" style="background-color: #d4af37; border: none;">
                                    <i class="bi bi-check-circle-fill me-2"></i> HOÀN TẤT ĐỔI MẬT KHẨU
                                </button>
                            </form>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
