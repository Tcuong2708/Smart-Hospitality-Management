<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<body>

<th:block th:fragment="extra_css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <style>
        .form-label { font-weight: 600; color: var(--navy-color, #0F2942); font-size: 0.9rem; }
        .form-control, .form-select { border-radius: 8px; border: 1px solid #dee2e6; padding: 0.6rem 1rem; }
        .form-control:focus, .form-select:focus { border-color: var(--gold-color, #C5A017); box-shadow: 0 0 0 0.25rem rgba(197, 160, 23, 0.25); }
    </style>
</th:block>

<div th:fragment="body_content">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0 admin-card">
                    <div class="admin-header d-flex justify-content-between align-items-center">
                        <h3 class="fw-bold text-uppercase mb-0 text-navy">
                            <i class="bi bi-person-plus-fill me-2 text-gold"></i>Thêm Người Dùng
                        </h3>
                    </div>

                    <form th:action="@{/admin/users/create}" th:object="${user}" method="post" class="card-body p-4 p-md-5 bg-white">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Tên đăng nhập</label>
                                <input type="text" th:field="*{username}" class="form-control" required />
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Mật khẩu</label>
                                <input type="password" th:field="*{password}" class="form-control" required />
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" th:field="*{email}" class="form-control" required />
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Vai trò</label>
                                <select th:field="*{roleId}" class="form-select">
                                    <option value="1">Quản trị viên hệ thống (Admin)</option>
                                    <option value="2">Bộ phận quản lý (Manager)</option>
                                    <option value="3">Lễ tân</option>
                                    <option value="7">Kế toán</option>
                                    <option value="4">Nhân viên buồng phòng</option>
                                    <option value="6">Nhân viên dịch vụ</option>
                                    <option value="5">Khách hàng</option>
                                </select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Số điện thoại</label>
                                <input type="text" th:field="*{phone}" class="form-control" />
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Quốc tịch</label>
                                <input type="text" th:field="*{quocTich}" class="form-control" />
                            </div>
                        </div>

                        <div class="d-flex gap-3 justify-content-end mt-4 pt-4 border-top">
                            <a th:href="@{/admin/users}" class="btn btn-outline-secondary px-4 rounded-pill fw-bold">Hủy bỏ</a>
                            <button type="submit" class="btn btn-gold px-5 shadow-sm text-white rounded-pill fw-bold" style="background: linear-gradient(135deg, #C5A017, #d4af37);">
                                <i class="bi bi-check-circle-fill me-1"></i> THÊM MỚI
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block th:fragment="extra_js">
</th:block>

</body>
</html>
