<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Staff Demo</title>
    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #f4f6f9;
        }
        .main-content {
            flex: 1;
        }
    </style>

  <!-- CÁC FILE CSS ĐƯỢC CHÈN SẴN ĐỂ TRÁNH FOUC (FLASH OF UNSTYLED CONTENT) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../style.css" />
  <style>
    .navbar-nav .nav-link.active-menu {
      font-weight: 700 !important;
      color: #d4af37 !important; /* Màu vàng Gold */
      background-color: rgba(212, 175, 55, 0.1); /* Nền mờ */
      border-radius: 8px; /* Bo tròn góc */
      padding: 8px 16px !important; /* Tạo khoảng trống xung quanh chữ */
      transition: 0.3s all ease-in-out;
    }
  </style>

</head>
<body>

    <!-- NAVBAR STAFF -->
    <nav class="navbar navbar-expand-lg sticky-top navbar-dark shadow-sm" style="background-color: #0F2942;">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="#" style="color: #C5A017;">
                <i class="bi bi-person-badge me-2"></i>MAY STAFF
            </a>
            
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#staffNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="staffNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link text-white active" href="#"><i class="bi bi-map me-1"></i>Sơ đồ phòng</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="#"><i class="bi bi-box-arrow-in-right me-1"></i>Check-in</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="#"><i class="bi bi-box-arrow-right me-1"></i>Check-out</a></li>
                    
                    <li class="nav-item dropdown ms-3">
                        <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle fs-4" style="color: #C5A017;"></i>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end shadow border-0">
                            <li class="dropdown-header border-bottom pb-2">
                                <span class="fw-bold d-block">Receptionist</span>
                                <small class="text-muted">Nhân viên Lễ tân</small>
                            </li>
                            <li><a class="dropdown-item mt-2" href="#"><i class="bi bi-house me-2"></i>Xem trang khách</a></li>
                            <li><a class="dropdown-item text-danger" href="#"><i class="bi bi-box-arrow-right me-2"></i>Đăng xuất</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- KHU VỰC NỘI DUNG CHÍNH (CONTENT) -->
    <main class="main-content container-fluid py-4 px-4">
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-5 text-center">
                <i class="bi bi-map text-muted" style="font-size: 4rem;"></i>
                <h3 class="mt-3">Khu vực Nghiệp vụ Lễ tân (Staff)</h3>
                <p class="text-muted">Các trang như Sơ đồ phòng, Check-in, Check-out sẽ hiển thị nội dung tại vùng này.</p>
            </div>
        </div>
    </main>

    <!-- FOOTER STAFF -->
    <footer class="py-3 mt-auto text-center border-top" style="background-color: #e9ecef;">
        <div class="container-fluid">
            <span class="text-muted small">&copy; 2026 May Hotel Internal System. All rights reserved.</span>
        </div>
    </footer>

    <!-- Bootstrap JS (Cần thiết cho dropdown) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
