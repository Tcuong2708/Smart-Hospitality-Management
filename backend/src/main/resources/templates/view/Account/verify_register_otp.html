<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<head>
    <title>Xác thực OTP - MAY HOTEL</title>
</head>

<body>

    <th:block layout:fragment="additional-css">
        <link rel="stylesheet" th:href="@{/css/auth.css}" />
    </th:block>

    <div layout:fragment="content">

        <section class="mh-auth mh-auth--narrow">
            <aside class="mh-auth-visual">
                <div class="mh-auth-visual-overlay"></div>
                <div class="mh-auth-visual-content">
                    <div class="mh-auth-ornament">✦ ❦ ✦</div>
                    <h2>Xác thực<br>danh tính</h2>
                    <div class="mh-auth-rule"></div>
                    <p>Một mã 6 chữ số đã được gửi tới email của bạn. Vui lòng nhập để hoàn tất đăng ký.</p>
                </div>
            </aside>

            <div class="mh-auth-form-wrap">
                <div class="mh-auth-form-inner">

                    <a th:href="@{/}" class="mh-auth-logo">
                        <img th:src="@{/images/logo-web.png}" alt="MAY HOTEL">
                    </a>

                    <header class="mh-auth-header">
                        <span class="mh-auth-eyebrow">Xác thực OTP</span>
                        <h1>Nhập mã xác thực</h1>
                        <p>
                            Mã đã được gửi tới
                            <strong th:text="${email}">email@example.com</strong>
                        </p>
                    </header>

                    <div th:if="${error != null}" class="mh-auth-alert error">
                        <i class="fa-solid fa-circle-exclamation"></i>
                        <span th:text="${error}"></span>
                    </div>
                    <div th:if="${success != null}" class="mh-auth-alert success">
                        <i class="fa-solid fa-circle-check"></i>
                        <span th:text="${success}"></span>
                    </div>

                    <form th:action="@{/account/verify-otp}" method="post" class="mh-auth-form">
                        <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}"
                            th:value="${_csrf.token}" />
                        <input type="hidden" name="email" th:value="${email}" />

                        <div class="mh-field">
                            <label for="otp">Mã OTP (6 chữ số)</label>
                            <div class="mh-field-input">
                                <i class="fa-solid fa-key"></i>
                                <input id="otp" type="text" name="otp" required maxlength="6" pattern="\d{6}"
                                    autocomplete="one-time-code" inputmode="numeric" placeholder="• • • • • •"
                                    class="mh-input-otp" />
                            </div>
                        </div>

                        <button type="submit" class="mh-auth-submit">
                            <i class="fa-solid fa-shield-halved"></i>
                            Xác nhận
                        </button>
                    </form>

                    <p class="mh-auth-back">
                        <a th:href="@{/account/register}">
                            <i class="fa-solid fa-arrow-left"></i> Quay lại đăng ký
                        </a>
                    </p>
                </div>
            </div>
        </section>

    </div>

</body>

</html>
