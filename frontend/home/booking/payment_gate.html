<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cổng Thanh Toán - MAY HOTEL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="payment_gate.css">

  <!-- CÁC FILE CSS ĐƯỢC CHÈN SẴN ĐỂ TRÁNH FOUC (FLASH OF UNSTYLED CONTENT) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../../style.css" />
  <style>
    .navbar-nav .nav-link.active-menu {
      font-weight: 700 !important;
      color: #d4af37 !important; /* Màu vàng Gold */
      background-color: rgba(212, 175, 55, 0.1); /* Nền mờ */
      border-radius: 8px; /* Bo tròn góc */
      padding: 8px 16px !important; /* Tạo khoảng trống xung quanh chữ */
      transition: 0.3s all ease-in-out;
    }
  </style>

</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-5">
                <div class="card shadow border-0 overflow-hidden" style="border-radius: 15px;">
                    <div class="card-header bg-navy text-white text-center py-3">
                        <h5 class="mb-0 fw-bold"><i class="bi bi-shield-lock-fill text-gold me-2"></i>Thanh toán trực tuyến An Toàn</h5>
                    </div>
                    <div class="card-body p-4 text-center">
                        <div class="mb-4">
                            <span class="badge bg-danger fs-6 mb-2 px-3 py-2" id="countdown">10:00</span>
                            <p class="text-muted small mt-2">Vui lòng quét mã QR để hoàn tất thanh toán.<br>Giao dịch sẽ tự động hủy nếu quá thời gian.</p>
                        </div>
                        
                        <div class="qr-box mx-auto mb-4">
                            <img loading="lazy" src="https://api.vietqr.io/image/970415-0999999999-Ewv4X8M.jpg?amount=1000000&addInfo=MAYHOTEL" class="img-fluid rounded" alt="QR Code">
                        </div>

                        <div class="bg-light rounded p-3 text-start mb-4 border border-secondary-subtle">
                            <div class="d-flex justify-content-between mb-2">
                                <span class="text-muted">Mã đơn đặt:</span>
                                <span class="fw-bold" id="invoice-id">#0000</span>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span class="text-muted">Chủ tài khoản:</span>
                                <span class="fw-bold">MAY HOTEL VN</span>
                            </div>
                            <div class="d-flex justify-content-between mt-3 pt-2 border-top">
                                <span class="text-muted">Số tiền:</span>
                                <span class="fw-bold text-danger fs-4" id="invoice-total">0 đ</span>
                            </div>
                        </div>

                        <button id="btn-confirm-payment" class="btn btn-gold w-100 py-3 fw-bold text-uppercase shadow-sm">
                            <i class="bi bi-check-circle-fill me-2"></i>Đã thanh toán (Mô phỏng)
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="payment_gate.js"></script>
<script src="../../layout.js"></script>
<script src="../../app.js"></script>
</body>
</html>
