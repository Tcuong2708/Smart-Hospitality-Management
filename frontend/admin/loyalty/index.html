<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Chính Sách Tích Điểm - Bộ phận Quản lý</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../style.css" />
    <style>
      .navbar-nav .nav-link.active-menu { font-weight: 700 !important; color: #d4af37 !important; background-color: rgba(212, 175, 55, 0.1); border-radius: 8px; padding: 8px 16px !important; transition: 0.3s all ease-in-out; }
      .admin-card { background: white; border-radius: 8px; box-shadow: 0 5px 20px rgba(15,41,66,0.1); overflow: hidden; }
      .admin-header { background-color: var(--primary-color, #0F2942); color: white; padding: 20px 25px; border-bottom: 3px solid var(--accent-color, #C5A017); }
      .table-header-navy th { background-color: var(--primary-color, #0F2942) !important; color: white !important; border-bottom: 2px solid var(--accent-color, #C5A017) !important; padding: 15px 10px !important; text-transform: uppercase; font-size: 0.85rem; vertical-align: middle; }
    </style>
</head>
<body>

<div class="main-content">
    <div class="container py-5">
        <div class="card shadow-sm border-0 admin-card mb-4">
            <div class="admin-header d-flex justify-content-between align-items-center">
                <h3 class="fw-bold text-uppercase mb-0 text-white">
                    <i class="bi bi-star-fill me-2" style="color: var(--accent-color);"></i>Cấu hình Tích điểm & Thăng hạng
                </h3>
            </div>
            <div class="card-body p-4 bg-light">
                <div class="row text-center">
                    <div class="col-md-4">
                        <div class="p-4 bg-white rounded shadow-sm border-start border-4 border-warning">
                            <h5 class="fw-bold text-navy">Tỉ lệ quy đổi (Tích điểm)</h5>
                            <p class="fs-4 fw-bold text-danger mb-0">100.000 VNĐ = 1 Điểm</p>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="p-4 bg-white rounded shadow-sm border-start border-4 border-success">
                            <h5 class="fw-bold text-navy">Tỉ lệ thanh toán (Đổi điểm)</h5>
                            <p class="fs-4 fw-bold text-success mb-0">1 Điểm = 1.000 VNĐ</p>
                        </div>
                    </div>
                    <div class="col-md-4 d-flex align-items-center justify-content-center">
                        <button class="btn btn-lg btn-navy text-white fw-bold shadow-sm" style="background-color: var(--navy-color);"><i class="bi bi-gear-fill me-2"></i>Thay đổi quy định</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0 admin-card">
            <div class="admin-header d-flex justify-content-between align-items-center">
                <h4 class="fw-bold text-uppercase mb-0 text-white">
                    <i class="bi bi-award-fill me-2" style="color: var(--accent-color);"></i>Chính sách Hạng Thành Viên
                </h4>
                <a href="#" class="btn btn-gold px-4 shadow-sm text-white" style="background: #C5A017;">
                    <i class="bi bi-plus-circle-fill me-1"></i> Thêm Hạng
                </a>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-header-navy">
                        <tr>
                            <th class="text-center text-uppercase small text-white">Hạng Thành Viên</th>
                            <th class="text-center text-uppercase small text-white">Điểm Yêu Cầu</th>
                            <th class="text-center text-uppercase small text-white">Quyền lợi nổi bật</th>
                            <th class="text-center text-uppercase small text-white">Trạng thái</th>
                            <th class="text-center text-uppercase small text-white">Thao tác</th>
                        </tr>
                        </thead>
                        <tbody id="table-body">
                            <tr>
                                <td colspan="5" class="text-center py-5 text-muted">
                                    <div class="spinner-border text-primary"></div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="index.js"></script>
<script src="../../layout.js"></script>
<script src="../../app.js"></script>
</body>
</html>
