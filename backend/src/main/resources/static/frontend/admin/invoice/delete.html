<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xóa Đơn Đặt - MAY HOTEL</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/delete.css" />

  <!-- CÁC FILE CSS ĐƯỢC CHÈN SẴN ĐỂ TRÁNH FOUC (FLASH OF UNSTYLED CONTENT) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../../style.css" />
  <style>
    .navbar-nav .nav-link.active-menu {
      font-weight: 700 !important;
      color: #d4af37 !important; /* Màu vàng Gold */
      background-color: rgba(212, 175, 55, 0.1); /* Nền mờ */
      border-radius: 8px; /* Bo tròn góc */
      padding: 8px 16px !important; /* Tạo khoảng trống xung quanh chữ */
      transition: 0.3s all ease-in-out;
    }
  </style>

</head>
<body>
    <div class="container py-5">
        <div class="delete-card shadow-lg bg-white mx-auto">
            <div class="delete-header text-white text-center py-3">
                <h3 class="mb-0 fw-bold text-uppercase">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>Xóa Đơn Đặt
                </h3>
            </div>

            <div class="card-body p-4 text-center">
                <div id="alert-container"></div>
                
                <h5 class="text-muted mb-4">Bạn có chắc chắn muốn xóa đơn đặt này không?</h5>

                <div class="mb-3 text-danger" style="font-size: 50px;">
                    <i class="bi bi-receipt-cutoff"></i>
                </div>

                <h3 class="fw-bold text-dark mb-3" id="invoice-id-display">Đang tải...</h3>

                <div class="order-summary text-start border p-3 bg-light rounded mb-3">
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted"><i class="bi bi-person-fill me-1"></i>Khách hàng:</span>
                        <span class="fw-bold text-dark" id="invoice-customer">...</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted"><i class="bi bi-calendar3 me-1"></i>Ngày đặt:</span>
                        <span class="fw-bold text-dark" id="invoice-date">...</span>
                    </div>
                    <div class="d-flex justify-content-between border-top pt-2 mt-2">
                        <span class="text-muted">Tổng tiền:</span>
                        <span class="fw-bold text-danger fs-5" id="invoice-total">0 đ</span>
                    </div>
                </div>

                <div class="warning-box text-start p-3 rounded mb-4">
                    <strong><i class="bi bi-info-circle-fill"></i> Lưu ý quan trọng:</strong><br />
                    Hành động này sẽ xóa vĩnh viễn đơn đặt và giải phóng trạng thái phòng về trống. Không thể khôi phục dữ liệu sau khi xóa.
                </div>

                <div class="d-flex justify-content-center gap-3">
                    <a href="index.html" class="btn btn-secondary px-4">
                        <i class="bi bi-x-lg me-1"></i> Hủy bỏ
                    </a>
                    <button type="button" id="btn-delete" class="btn btn-danger px-4 fw-bold shadow-sm">
                        <i class="bi bi-trash-fill me-1"></i> Xác nhận xóa
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/delete.js"></script>
<script src="../../layout.js"></script>
<script src="../../app.js"></script>
</body>
</html>
