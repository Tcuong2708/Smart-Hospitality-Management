<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết Đơn Đặt - MAY HOTEL</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/details.css" />

  <!-- CÁC FILE CSS ĐƯỢC CHÈN SẴN ĐỂ TRÁNH FOUC (FLASH OF UNSTYLED CONTENT) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../../style.css" />
  <style>
    .navbar-nav .nav-link.active-menu {
      font-weight: 700 !important;
      color: #d4af37 !important; /* Màu vàng Gold */
      background-color: rgba(212, 175, 55, 0.1); /* Nền mờ */
      border-radius: 8px; /* Bo tròn góc */
      padding: 8px 16px !important; /* Tạo khoảng trống xung quanh chữ */
      transition: 0.3s all ease-in-out;
    }
  </style>

</head>
<body>
    <div class="container py-5">
        <div id="alert-container"></div>
        <div class="row justify-content-center" id="details-content" style="display: none;">
            <div class="col-lg-10">
                <div class="card order-card mb-4 shadow-sm">
                    <div class="order-header d-flex justify-content-between align-items-center flex-wrap gap-2 text-white">
                        <h4 class="mb-0 fw-bold text-uppercase">
                            <i class="bi bi-receipt me-2 text-gold"></i>Đơn Hàng #<span id="invoice-id"></span>
                        </h4>
                        <span class="badge badge-date fs-6 px-3 py-2">
                            <i class="bi bi-calendar3 me-1"></i> <span id="invoice-date"></span>
                        </span>
                    </div>
                    <div class="card-body p-4">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <div class="info-group">
                                    <label class="fw-bold text-navy"><i class="bi bi-person-fill me-2 text-muted"></i>Khách hàng:</label>
                                    <span class="fw-bold text-dark" id="customer-name"></span>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="info-group">
                                    <label class="fw-bold text-navy"><i class="bi bi-telephone-fill me-2 text-muted"></i>Số điện thoại:</label>
                                    <span id="customer-phone"></span>
                                </div>
                            </div>
                            <div class="col-md-12 border-top pt-3 mt-2">
                                <div class="info-group">
                                    <label class="fw-bold text-navy"><i class="bi bi-geo-alt-fill me-2 text-muted"></i>Địa chỉ:</label>
                                    <span id="customer-address"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <h5 class="mb-3 fw-bold text-uppercase ps-3 border-start border-5 border-warning text-navy">
                    Danh sách phòng đã đặt
                </h5>

                <div class="card order-card shadow-sm">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                            <tr>
                                <th class="ps-4 py-3">Tên phòng / Chi tiết</th>
                                <th class="text-center">Số lượng</th>
                                <th class="text-end">Đơn giá/Đêm</th>
                                <th class="text-end pe-4">Thành tiền</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr>
                                <td class="ps-4 fw-bold text-navy">
                                    <span id="room-name"></span>
                                    <div class="small text-muted fw-normal">
                                        Thời gian: <span id="time-range"></span>
                                    </div>
                                </td>
                                <td class="text-center">1</td>
                                <td class="text-end" id="room-price"></td>
                                <td class="text-end pe-4 fw-bold text-danger" id="room-total"></td>
                            </tr>
                            <tr style="background-color: #f8f9fa;">
                                <td colspan="3" class="text-end fw-bold py-3 fs-5 text-navy">TỔNG CỘNG:</td>
                                <td class="text-end pe-4 fw-bold fs-4 py-3 text-gold" id="invoice-total"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="mt-4 text-center">
                    <a href="index.html" class="btn btn-outline-secondary px-4 py-2 fw-bold">
                        <i class="bi bi-arrow-left me-2"></i> Quay lại danh sách
                    </a>
                </div>
            </div>
        </div>
        <div id="loading-spinner" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
    </div>

    <script src="js/details.js"></script>
<script src="../../layout.js"></script>
<script src="../../app.js"></script>
</body>
</html>
