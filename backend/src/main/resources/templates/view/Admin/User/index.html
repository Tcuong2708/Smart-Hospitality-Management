<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý người dùng - May Hotel</title>
</head>
<body>

<th:block th:fragment="extra_css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/Admin/User/index.css}">
</th:block>

<div th:fragment="body_content">
    <div class="container py-5">

        <div class="card shadow-sm border-0 admin-card">
            <div class="admin-header d-flex justify-content-between align-items-center p-4">
                <h3 class="fw-bold text-uppercase mb-0" style="color: var(--navy-color);">
                    <i class="bi bi-people-fill me-2 text-gold"></i>Quản Lý Người Dùng
                </h3>
                <a th:href="@{/admin/users/create}" class="btn btn-gold px-4 shadow-sm text-white">
                    <i class="bi bi-person-plus-fill me-1"></i> Thêm Người Dùng
                </a>
            </div>
            
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-header-navy">
                        <tr>
                            <th class="ps-4 py-3 text-uppercase small">Tên đăng nhập</th>
                            <th class="text-uppercase small">Họ và Tên</th>
                            <th class="text-uppercase small">Quốc tịch</th>
                            <th class="text-center text-uppercase small">Vai trò</th>
                            <th class="text-center text-uppercase small">Trạng thái</th>
                            <th class="text-center text-uppercase small" style="width: 220px;">Thao tác</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${users == null or #lists.isEmpty(users)}">
                            <td colspan="6" class="text-center py-5 text-muted">
                                <i class="bi bi-inbox fs-1 d-block mb-2 opacity-25"></i>
                                Chưa có dữ liệu người dùng.
                            </td>
                        </tr>

                        <tr th:unless="${users == null or #lists.isEmpty(users)}" th:each="u : ${users}">
                            <td class="ps-4 fw-bold" style="color: var(--navy-color);">
                                <i class="bi bi-person-badge me-2 text-gold opacity-75"></i>
                                <span th:text="${u.username}">admin</span>
                            </td>

                            <td th:text="${u.fullName != null ? u.fullName : (u.email != null ? u.email : 'Chưa cập nhật')}">Email</td>

                            <td th:text="${u.quocTich != null ? u.quocTich : 'Việt Nam'}">SĐT</td>

                            <td class="text-center">
                                <th:block th:switch="${u.roleId}">
                                    <span th:case="1" class="badge rounded-pill badge-custom badge-role-admin">Quản trị viên</span>
                                    <span th:case="2" class="badge rounded-pill badge-custom badge-role-staff">Quản lý</span>
                                    <span th:case="3" class="badge rounded-pill badge-custom badge-role-staff">Lễ tân</span>
                                    <span th:case="7" class="badge rounded-pill badge-custom badge-role-staff">Kế toán</span>
                                    <span th:case="4" class="badge rounded-pill badge-custom badge-role-staff">NV Buồng phòng</span>
                                    <span th:case="6" class="badge rounded-pill badge-custom badge-role-staff">NV Dịch vụ</span>
                                    <span th:case="*" class="badge rounded-pill badge-custom badge-role-user">Khách hàng</span>
                                </th:block>
                            </td>

                            <td class="text-center">
                                <span th:if="${u.status == 'Hoạt động' or u.status == 'Active'}"
                                      class="badge bg-success rounded-pill px-3 py-2 text-white small fw-bold">Hoạt động</span>

                                <span th:if="${u.status != 'Hoạt động' and u.status != 'Active'}"
                                      class="badge bg-secondary rounded-pill px-3 py-2 text-white small fw-bold">Bị khóa</span>
                            </td>

                            <td class="text-center">
                                <a th:href="@{/admin/users/edit/{id}(id=${u.id})}"
                                   class="btn btn-action btn-edit shadow-sm"
                                   title="Sửa thông tin">
                                    <i class="bi bi-pencil"></i>
                                </a>

                                <a th:href="@{/admin/users/toggle-status/{id}(id=${u.id})}"
                                   th:class="${u.status != 'Hoạt động'} ? 'btn btn-action btn-success shadow-sm mx-1' : 'btn btn-action btn-dark shadow-sm mx-1'"
                                   th:title="${u.status != 'Hoạt động'} ? 'Mở khóa tài khoản' : 'Khóa tài khoản'"
                                   th:onclick="return confirm('Bạn có chắc chắn muốn thay đổi trạng thái hoạt động của tài khoản [[${u.username}]] không?')">
                                    <i th:class="${u.status != 'Hoạt động'} ? 'bi bi-unlock-fill' : 'bi bi-lock-fill'"></i>
                                </a>

                                <a th:href="@{/admin/users/delete/{id}(id=${u.id})}"
                                   class="btn btn-action btn-delete shadow-sm"
                                   title="Xóa"
                                   th:onclick="return confirm('Bạn có chắc chắn muốn xóa tài khoản [[${u.username}]] không?')">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block th:fragment="extra_js">

</th:block>

</body>
</html>
