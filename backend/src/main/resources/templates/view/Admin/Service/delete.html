<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<th:block th:fragment="extra_css">
    <link rel="stylesheet" th:href="@{/css/Admin/Service/delete.css}" />
</th:block>

<div th:fragment="body_content">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card border-0 shadow-lg form-card">
                    <div class="card-header bg-danger text-white py-3 text-center">
                        <h4 class="mb-0 fw-bold text-uppercase">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>Xác nhận xóa
                        </h4>
                    </div>
                    <div class="card-body p-5 text-center">
                        <div class="mb-4 text-danger opacity-75">
                            <i class="bi bi-trash3" style="font-size: 5rem;"></i>
                        </div>

                        <h5 class="text-navy fw-bold mb-3">Bạn có chắc chắn muốn xóa dịch vụ này?</h5>
                        <p class="text-muted mb-4">
                            Hành động này sẽ xóa vĩnh viễn dữ liệu khỏi hệ thống và <br />
                            <strong>không thể hoàn tác</strong>.
                        </p>

                        <div class="info-box text-start px-4 py-3 mb-4 shadow-sm">
                            <div class="row mb-2">
                                <div class="col-4 text-muted">ID Dịch vụ:</div>
                                <div class="col-8 fw-bold text-dark" th:text="'#' + ${dichVu.maDV}">#0</div>
                            </div>
                            <div class="row mb-2">
                                <div class="col-4 text-muted">Tên dịch vụ:</div>
                                <div class="col-8 fw-bold text-navy text-uppercase" th:text="${dichVu.tenDV}">TÊN DỊCH VỤ</div>
                            </div>
                            <div class="row mb-2">
                                <div class="col-4 text-muted">Đơn giá:</div>
                                <div class="col-8 fw-bold text-warning fs-5"
                                     th:text="${#numbers.formatDecimal(dichVu.giaTien, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">0 VNĐ</div>
                            </div>
                            <div class="row">
                                <div class="col-4 text-muted">Đơn vị tính:</div>
                                <div class="col-8" th:text="${dichVu.donVi}">Lần</div>
                            </div>
                        </div>

                        <form th:action="@{/admin/services/delete/{id}(id=${dichVu.maDV})}" method="post">
                            <div class="d-flex justify-content-center gap-3 mt-4 border-top pt-4">
                                <a th:href="@{/admin/services}" class="btn btn-outline-secondary px-4 fw-bold">
                                    <i class="bi bi-x-lg me-2"></i>Hủy bỏ
                                </a>
                                <button type="submit" class="btn btn-danger px-4 fw-bold">
                                    <i class="bi bi-trash-fill me-2"></i>Xóa vĩnh viễn
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:fragment="extra_js"></div>
</html>
