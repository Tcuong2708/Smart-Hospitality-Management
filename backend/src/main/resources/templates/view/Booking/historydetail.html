<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}">
<head>
    <title th:text="${pageTitle}">Chi Tiết Đơn Đặt Phòng - MAY HOTEL</title>
</head>
<body>

<th:block th:fragment="extra_css">
  <style>
    .navbar-nav .nav-link.active-menu {
      font-weight: 700 !important;
      color: #d4af37 !important; /* Màu vàng Gold */
      background-color: rgba(212, 175, 55, 0.1); /* Nền mờ */
      border-radius: 8px; /* Bo tròn góc */
      padding: 8px 16px !important; /* Tạo khoảng trống xung quanh chữ */
      transition: 0.3s all ease-in-out;
    }
    .text-navy { color: #0F2942 !important; }
    .text-gold { color: #C5A017 !important; }
  </style>
</th:block>

<div th:fragment="body_content">
    <div class="container py-5">
        <a th:href="@{/booking/history}" class="btn btn-outline-secondary btn-sm mb-4 fw-bold px-3 shadow-sm rounded-pill">
            <i class="bi bi-arrow-left me-1"></i> Trở về Lịch sử
        </a>

        <div class="card shadow-sm border-0 p-4 p-md-5 mx-auto" style="max-width: 800px; border-radius: 15px;">
            
            <div id="detail-content">
                <div class="text-center pb-3 mb-4 position-relative">
                    <h3 class="fw-bold text-navy text-uppercase mb-2" style="font-family: 'Playfair Display', serif; letter-spacing: 1px;">Chi Tiết Đơn Đặt Phòng</h3>
                    <div style="width: 60px; height: 3px; background-color: #C5A017; margin: 10px auto;"></div>
                    <div class="text-muted small fw-medium" th:text="'#' + ${order.id}">#0000</div>
                    <div class="mt-3">
                        <span class="badge rounded-pill bg-warning text-dark fs-6 px-3 py-2 border border-warning shadow-sm" th:if="${order.status == 'Pending'}">Chờ duyệt</span>
                        <span class="badge rounded-pill bg-success fs-6 px-3 py-2 shadow-sm" th:if="${order.status == 'Hoàn tất'}">Hoàn tất</span>
                        <span class="badge rounded-pill bg-secondary fs-6 px-3 py-2 shadow-sm" th:if="${order.status == 'Đã Hủy'}">Đã Hủy</span>
                        <span class="badge rounded-pill bg-info fs-6 px-3 py-2 shadow-sm text-dark" th:if="${order.status != 'Pending' and order.status != 'Hoàn tất' and order.status != 'Đã Hủy'}" th:text="${order.status}"></span>
                    </div>
                </div>

                <div class="row g-4 mb-4">
                    <div class="col-md-6">
                        <h6 class="fw-bold text-navy border-bottom pb-2 mb-3"><i class="bi bi-person-badge text-gold me-2 fs-5 align-middle"></i>Thông tin Khách Hàng</h6>
                        <div class="small text-muted mb-2">Họ tên: <strong class="text-dark fs-6" th:text="${customer.fullName}"></strong></div>
                        <div class="small text-muted mb-2">SĐT: <strong class="text-dark fs-6" th:text="${customer.phone}"></strong></div>
                    </div>
                    <div class="col-md-6">
                        <h6 class="fw-bold text-navy border-bottom pb-2 mb-3"><i class="bi bi-calendar-check text-gold me-2 fs-5 align-middle"></i>Thông tin Lưu Trú</h6>
                        <div class="small text-muted mb-2">Ngày nhận: <strong class="text-dark fs-6" th:text="${order.expectedIn != null ? #dates.format(order.expectedIn, 'dd/MM/yyyy') : 'Chưa rõ'}"></strong></div>
                        <div class="small text-muted mb-2">Ngày trả: <strong class="text-dark fs-6" th:text="${order.expectedOut != null ? #dates.format(order.expectedOut, 'dd/MM/yyyy') : 'Chưa rõ'}"></strong></div>
                    </div>
                </div>

                <div class="p-3 rounded-3 mb-4" style="background-color: rgba(197, 160, 23, 0.05); border: 1px dashed rgba(197, 160, 23, 0.4);">
                    <h6 class="fw-bold text-navy mb-3"><i class="bi bi-journal-text text-gold me-2 fs-5 align-middle"></i>Ghi chú & Dịch vụ</h6>
                    <p class="small text-muted m-0 fst-italic lh-lg" th:if="${order.notes != null and !order.notes.isEmpty()}" th:text="${order.notes}"></p>
                    <p class="small text-muted m-0 fst-italic lh-lg" th:unless="${order.notes != null and !order.notes.isEmpty()}">Không có ghi chú nào từ khách hàng.</p>
                </div>

                <div class="d-flex flex-column flex-md-row justify-content-between align-items-center rounded-3 p-4 mb-3 shadow-sm" style="background: linear-gradient(135deg, rgba(15,41,66,0.03) 0%, rgba(197,160,23,0.08) 100%); border-left: 5px solid #0F2942;">
                    <span class="text-navy fw-bold text-uppercase mb-2 mb-md-0" style="letter-spacing: 1px;">Tổng tiền thanh toán:</span>
                    <span class="fs-2 fw-bold text-danger">Chờ nhận phòng</span>
                </div>
                
                <div class="text-end">
                    <small class="text-muted"><i class="bi bi-credit-card-2-front text-gold me-1"></i>Phương thức: <span class="fw-bold text-navy">Thanh toán tại quầy</span></small>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block th:fragment="extra_js">
</th:block>

</body>
</html>
