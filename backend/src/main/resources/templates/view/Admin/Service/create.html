<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<th:block th:fragment="extra_css">
    <link rel="stylesheet" th:href="@{/css/Admin/Service/create.css}" />
</th:block>

<div th:fragment="body_content">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card border-0 shadow-lg form-card">
                    <div class="card-header bg-navy text-white py-3">
                        <h4 class="mb-0 fw-bold text-uppercase fs-5">
                            <i class="bi bi-plus-lg me-2"></i>Thêm Dịch Vụ Mới
                        </h4>
                    </div>
                    <div class="card-body p-5">
                        <form th:action="@{/admin/services/create}" method="post">

                            <div class="mb-4">
                                <label class="form-label fw-bold text-navy">Tên dịch vụ <span class="text-danger">*</span></label>
                                <input type="text" name="tenDV" class="form-control form-control-lg" placeholder="Ví dụ: Ăn sáng, Giặt ủi..." required />
                            </div>

                            <div class="row mb-4">
                                <div class="col-md-6 mb-3 mb-md-0">
                                    <label class="form-label fw-bold text-navy">Giá tiền (VNĐ) <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <input type="number" name="giaTien" class="form-control" min="0" placeholder="0" required />
                                        <span class="input-group-text bg-light text-secondary">VNĐ</span>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold text-navy">Đơn vị tính <span class="text-danger">*</span></label>
                                    <input type="text" name="donVi" class="form-control" placeholder="Lần, Suất, Kg..." required />
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-2 border-top pt-4 mt-3">
                                <a th:href="@{/admin/services}" class="btn btn-outline-secondary px-4 fw-bold">
                                    <i class="bi bi-arrow-left me-2"></i>Quay lại
                                </a>
                                <button type="submit" class="btn btn-gold px-4 fw-bold">
                                    <i class="bi bi-save me-2"></i>Lưu Dịch Vụ
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:fragment="extra_js"></div>
</html>
