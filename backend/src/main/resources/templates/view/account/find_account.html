<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/auth}">

<head>
    <title layout:fragment="content-title">Tìm tài khoản</title>
</head>

<body>
    <div layout:fragment="content">

        <section class="mh-auth mh-auth--narrow">
            <aside class="mh-auth-visual">
                <div class="mh-auth-visual-overlay"></div>
                <div class="mh-auth-visual-content">
                    <div class="mh-auth-ornament">✦ ❦ ✦</div>
                    <h2>Khôi phục<br>tài khoản</h2>
                    <div class="mh-auth-rule"></div>
                    <p>Nhập email hoặc số điện thoại đã đăng ký. Chúng tôi sẽ gửi mã xác thực để đặt lại mật khẩu.</p>
                </div>
            </aside>

            <div class="mh-auth-form-wrap">
                <div class="mh-auth-form-inner">

                    <a th:href="@{/}" class="mh-auth-logo">
                        <img th:src="@{/images/logo-web.png}" alt="MAY HOTEL">
                    </a>

                    <header class="mh-auth-header">
                        <span class="mh-auth-eyebrow">Quên mật khẩu</span>
                        <h1>Tìm tài khoản</h1>
                        <p>Nhập email hoặc SĐT để nhận mã khôi phục.</p>
                    </header>

                    <div th:if="${error != null}" class="mh-auth-alert error">
                        <i class="fa-solid fa-circle-exclamation"></i>
                        <span th:text="${error}"></span>
                    </div>

                    <form th:action="@{/account/find_account}" method="post" class="mh-auth-form">
                        <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}"
                            th:value="${_csrf.token}" />

                        <div class="mh-field">
                            <label for="keyword">Email hoặc Số điện thoại</label>
                            <div class="mh-field-input">
                                <i class="fa-solid fa-magnifying-glass"></i>
                                <input id="keyword" type="text" name="keyword" required autofocus
                                    placeholder="email@example.com / 0901234567" />
                            </div>
                        </div>

                        <button type="submit" class="mh-auth-submit">
                            <i class="fa-solid fa-paper-plane"></i>
                            Gửi mã xác thực
                        </button>
                    </form>

                    <p class="mh-auth-back">
                        <a th:href="@{/account/login}">
                            <i class="fa-solid fa-arrow-left"></i> Quay lại đăng nhập
                        </a>
                    </p>
                </div>
            </div>
        </section>

    </div>

</body>

</html>
