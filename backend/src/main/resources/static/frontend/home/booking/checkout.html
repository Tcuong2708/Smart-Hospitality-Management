<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh Toán Đặt Phòng - MAY HOTEL</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="checkout.css">

  <!-- CÁC FILE CSS ĐƯỢC CHÈN SẴN ĐỂ TRÁNH FOUC (FLASH OF UNSTYLED CONTENT) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../../style.css" />
  <style>
    .navbar-nav .nav-link.active-menu {
      font-weight: 700 !important;
      color: #d4af37 !important; /* Màu vàng Gold */
      background-color: rgba(212, 175, 55, 0.1); /* Nền mờ */
      border-radius: 8px; /* Bo tròn góc */
      padding: 8px 16px !important; /* Tạo khoảng trống xung quanh chữ */
      transition: 0.3s all ease-in-out;
    }
  </style>

</head>
<body class="bg-light">

    <div class="container py-5">
        <!-- Nút Back -->
        <a href="javascript:history.back()" class="text-decoration-none text-muted mb-4 d-inline-block">
            <i class="bi bi-arrow-left me-1"></i> Quay lại
        </a>

        <div class="text-center mb-5">
            <h2 class="fw-bold text-uppercase" style="color: var(--navy-color); letter-spacing: 1px;">
                <i class="bi bi-shield-check me-2" style="color: var(--gold-color);"></i>Xác nhận đơn đặt
            </h2>
            <div style="width: 60px; height: 3px; background-color: var(--gold-color); margin: 10px auto;"></div>
        </div>

        <div class="row g-4">
            <!-- Cột trái: Form Thông tin đặt phòng & Thanh toán -->
            <div class="col-lg-7 order-2 order-lg-1">
                
                <!-- Bảng chọn ngày và số lượng -->
                <div class="card shadow-sm border-0 mb-4 form-card">
                    <div class="card-body p-4">
                        <h5 class="fw-bold text-navy border-bottom pb-2 mb-4">
                            <i class="bi bi-calendar-check text-gold me-2"></i>Thông tin lưu trú
                        </h5>
                        
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label small fw-bold text-muted">Ngày nhận phòng <span class="text-danger">*</span></label>
                                <input type="date" id="checkin-date" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-bold text-muted">Ngày trả phòng <span class="text-danger">*</span></label>
                                <input type="date" id="checkout-date" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-bold text-muted">Số lượng phòng <span class="text-danger">*</span></label>
                                <input type="number" id="room-quantity" class="form-control" value="1" min="1" required>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Bảng chọn dịch vụ đi kèm -->
                <div class="card shadow-sm border-0 mb-4 form-card">
                    <div class="card-body p-4">
                        <h5 class="fw-bold text-navy border-bottom pb-2 mb-4">
                            <i class="bi bi-stars text-gold me-2"></i>Dịch vụ đi kèm
                        </h5>
                        <div id="services-container" class="row g-3">
                            <!-- Dịch vụ load bằng JS -->
                        </div>
                    </div>
                </div>

                <!-- Bảng ghi chú và phương thức thanh toán -->
                <div class="card shadow-sm border-0 mb-4 form-card">
                    <div class="card-body p-4">
                        <h5 class="fw-bold text-navy border-bottom pb-2 mb-4">
                            <i class="bi bi-credit-card-2-front text-gold me-2"></i>Thanh toán
                        </h5>
                        
                        <div class="mb-4">
                            <label class="form-label small fw-bold text-muted">Yêu cầu đặc biệt (Ghi chú)</label>
                            <textarea id="booking-note" class="form-control" rows="3" placeholder="Nhập yêu cầu đặc biệt của bạn..."></textarea>
                        </div>

                        <label class="form-label small fw-bold text-muted mb-3">Phương thức thanh toán <span class="text-danger">*</span></label>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <input type="radio" name="paymentMethod" value="COD" id="payCOD" class="payment-radio d-none" checked>
                                <label for="payCOD" class="payment-method-card d-block p-3 h-100 position-relative">
                                    <div class="d-flex align-items-center mb-2">
                                        <i class="bi bi-cash-coin text-gold fs-3 me-2"></i>
                                        <h6 class="fw-bold text-navy m-0">Thanh toán tại quầy</h6>
                                    </div>
                                    <p class="text-muted small m-0 card-text" style="font-size: 0.8rem;">Thanh toán bằng tiền mặt/thẻ khi nhận phòng.</p>
                                    <i class="bi bi-check-circle-fill text-navy position-absolute top-0 end-0 m-2 fs-5 check-icon"></i>
                                </label>
                            </div>
                            <div class="col-md-6">
                                <input type="radio" name="paymentMethod" value="ONLINE" id="payOnline" class="payment-radio d-none">
                                <label for="payOnline" class="payment-method-card d-block p-3 h-100 position-relative">
                                    <div class="d-flex align-items-center mb-2">
                                        <i class="bi bi-qr-code-scan text-gold fs-3 me-2"></i>
                                        <h6 class="fw-bold text-navy m-0">Thanh toán Online</h6>
                                    </div>
                                    <p class="text-muted small m-0 card-text" style="font-size: 0.8rem;">Quét mã QR qua ví điện tử/ngân hàng.</p>
                                    <i class="bi bi-check-circle-fill text-navy position-absolute top-0 end-0 m-2 fs-5 check-icon"></i>
                                </label>
                            </div>
                        </div>

                        <button id="btn-submit-booking" class="btn btn-gold w-100 py-3 fw-bold text-uppercase shadow-sm">
                            Xác nhận đặt phòng <i class="bi bi-arrow-right-short fs-5 ms-1"></i>
                        </button>
                    </div>
                </div>

            </div>

            <!-- Cột phải: Tóm tắt đơn đặt (Sticky) -->
            <div class="col-lg-5 order-1 order-lg-2">
                <div class="card shadow-sm border-0 p-4 sticky-top form-card" style="top: 20px;">
                    <h5 class="fw-bold text-navy border-bottom pb-3 mb-4">
                        <i class="bi bi-receipt text-gold me-2"></i>Tóm tắt hóa đơn
                    </h5>

                    <!-- Loading -->
                    <div id="summary-loading" class="text-center py-3">
                        <div class="spinner-border text-warning" role="status"></div>
                        <p class="small text-muted mt-2">Đang lấy dữ liệu phòng...</p>
                    </div>

                    <div id="summary-content" class="d-none">
                        <!-- Thông tin phòng -->
                        <div class="d-flex mb-3">
                            <img loading="lazy" id="sum-room-img" src="" class="rounded shadow-sm" style="width: 80px; height: 80px; object-fit: cover;">
                            <div class="ms-3 w-100">
                                <h6 class="fw-bold text-navy mb-1" id="sum-room-name">...</h6>
                                <div class="small text-muted mb-1" id="sum-room-cat">...</div>
                                <div class="d-flex justify-content-between">
                                    <span class="small fw-bold text-gold" id="sum-room-price">0 đ</span>
                                    <span class="small text-muted">/ đêm</span>
                                </div>
                            </div>
                        </div>

                        <hr class="text-muted opacity-25">

                        <!-- Chi tiết tính toán -->
                        <div class="d-flex justify-content-between mb-2 small">
                            <span class="text-muted">Tổng số đêm:</span>
                            <span class="fw-bold" id="sum-nights">0 đêm</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2 small">
                            <span class="text-muted">Số lượng phòng:</span>
                            <span class="fw-bold" id="sum-rooms">1 phòng</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2 small">
                            <span class="text-muted">Tiền phòng gốc:</span>
                            <span class="fw-bold" id="sum-base-total">0 đ</span>
                        </div>
                        <div class="d-flex justify-content-between mb-3 small" id="sum-services-row">
                            <span class="text-muted">Dịch vụ đi kèm:</span>
                            <span class="fw-bold text-secondary" id="sum-services-total">0 đ</span>
                        </div>

                        <div class="p-3 bg-light rounded d-flex justify-content-between align-items-center mt-4 border border-warning-subtle">
                            <span class="fw-bold text-navy">TỔNG CỘNG</span>
                            <span class="fs-4 fw-bold text-danger" id="sum-final-total">0 đ</span>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="checkout.js"></script>
<script src="../../layout.js"></script>
<script src="../../app.js"></script>
</body>
</html>
