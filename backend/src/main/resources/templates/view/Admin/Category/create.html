<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:fragment="extra_css"></th:block>
</head>
<body>
<div th:fragment="body_content">
    <div class="container py-5">
        <a th:href="@{/manager/categories}" class="text-decoration-none text-muted mb-3 d-inline-block">
            <i class="bi bi-arrow-left me-1"></i> Trở về Quản lý Loại phòng
        </a>

        <div class="card border-0 shadow-sm admin-card">
            <div class="admin-header d-flex justify-content-between align-items-center" style="background-color: #0F2942; color: white; padding: 1rem 1.5rem; border-bottom: 3px solid #C5A017;">
                <h4 class="mb-0 fw-bold text-uppercase" style="letter-spacing: 1px;">
                    <i class="bi bi-plus-square-fill me-2" style="color: #C5A017;"></i>Thêm Loại Phòng Mới
                </h4>
            </div>

            <div class="card-body p-4 p-md-5">
                <form th:action="@{/manager/categories/create}" method="post" th:object="${category}">
                    <div class="row g-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Tên Loại Phòng <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{name}" required placeholder="Ví dụ: Phòng Standard">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Số Lượng Người Tối Đa</label>
                            <input type="number" class="form-control" th:field="*{maxOccupancy}" value="2" min="1">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">URL Hình Ảnh Đại Diện</label>
                            <input type="text" class="form-control" th:field="*{imageUrl}" placeholder="Ví dụ: /images/c1.jpg">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Số lượng phòng (mặc định)</label>
                            <input type="number" class="form-control" th:field="*{quantity}" value="0" min="0">
                        </div>
                    </div>
                    
                    <div class="mt-5 d-flex justify-content-end gap-3 border-top pt-4">
                        <a th:href="@{/manager/categories}" class="btn btn-secondary px-4 fw-bold">Hủy</a>
                        <button type="submit" class="btn btn-warning text-white px-4 fw-bold" style="background-color: #C5A017; border:none;">
                            Lưu Thông Tin
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<th:block th:fragment="extra_js"></th:block>
</body>
</html>
