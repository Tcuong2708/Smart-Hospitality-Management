<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Quản lý hóa đơn - MAY HOTEL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <th:block th:fragment="extra_css">
        <link rel="stylesheet" th:href="@{/frontend/receptionist/invoice/css/index.css}" />
        <link rel="stylesheet" th:href="@{/frontend/style.css}" />
    </th:block>
</head>

<body>
    <div th:fragment="body_content">
        <div class="container py-4">
            <div th:if="${success}" class="alert alert-success border-0 shadow-sm text-center mb-4"
                th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger border-0 shadow-sm text-center mb-4" th:text="${error}">
            </div>

            <div class="card shadow-sm border-0 admin-card">
                <div class="admin-header d-flex justify-content-between align-items-center p-4"
                    style="background-color: #0F2942; color: white;">
                    <h3 class="fw-bold text-uppercase mb-0 text-white">
                        <i class="bi bi-receipt-cutoff me-2 text-gold" style="color: #C5A017;"></i>Quản lý hóa đơn
                    </h3>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-header-navy" style="background-color: #0F2942; color: white;">
                                <tr>
                                    <th class="py-3 text-center text-uppercase small text-white">Mã HĐ</th>
                                    <th class="text-center text-uppercase small text-white">Khách hàng</th>
                                    <th class="text-center text-uppercase small text-white">Ngày đặt</th>
                                    <th class="text-center text-uppercase small text-white">Thời gian lưu trú</th>
                                    <th class="text-center text-uppercase small text-white">Tổng tiền</th>
                                    <th class="text-center text-uppercase small text-white">Trạng thái</th>
                                    <th class="text-center text-uppercase small text-white">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${invoices == null or #lists.isEmpty(invoices)}">
                                    <td colspan="7" class="text-center py-5 text-muted">
                                        <i class="bi bi-clipboard-x text-muted" style="font-size: 2rem;"></i>
                                        <p class="text-muted mt-2 mb-0">Chưa có dữ liệu hóa đơn nào.</p>
                                    </td>
                                </tr>
                                <tr th:unless="${invoices == null or #lists.isEmpty(invoices)}"
                                    th:each="item : ${invoices}">
                                    <td class="text-center fw-bold" th:text="'#' + ${item.id}">#1</td>
                                    <td>
                                        <div class="d-flex flex-column text-center">
                                            <span class="fw-bold text-navy" th:text="${item.hoTen}">Tên Khách</span>
                                            <small class="text-muted"><i class="bi bi-telephone-fill me-1"></i>
                                                <th:block th:text="${item.sdt}"></th:block>
                                            </small>
                                        </div>
                                    </td>
                                    <td class="text-center text-muted small"
                                        th:text="${#dates.format(item.ngayDat, 'dd/MM/yyyy HH:mm')}">01/01/2026 12:00
                                    </td>
                                    <td class="text-center small">
                                        <span><i class="bi bi-box-arrow-in-right text-success me-1"></i>
                                            <th:block th:text="${#dates.format(item.ngayCheckIn, 'dd/MM/yyyy')}">
                                            </th:block>
                                        </span> -
                                        <span><i class="bi bi-box-arrow-left text-danger me-1"></i>
                                            <th:block th:text="${#dates.format(item.ngayCheckOut, 'dd/MM/yyyy')}">
                                            </th:block>
                                        </span>
                                    </td>
                                    <td class="text-center fw-bold text-gold"
                                        th:text="${#numbers.formatDecimal(item.totalPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                                        0 đ</td>
                                    <td class="text-center">
                                        <span th:if="${item.invoiceStatus == 'Completed'}"
                                            class="badge bg-success px-3 py-2 rounded-pill">Đã trả phòng</span>
                                        <span th:if="${item.invoiceStatus == 'In Use'}"
                                            class="badge bg-primary px-3 py-2 rounded-pill">Đang lưu trú</span>
                                        <span
                                            th:if="${item.invoiceStatus == 'Reserved' or item.invoiceStatus == 'Pending'}"
                                            class="badge bg-warning text-dark px-3 py-2 rounded-pill">Đã đặt
                                            trước</span>
                                    </td>
                                    <td class="text-center">
                                        <div class="btn-group" role="group">
                                            <a th:href="@{/receptionist/invoices/details/{id}(id=${item.id})}"
                                                class="btn btn-sm btn-outline-primary border-0" title="Xem chi tiết">
                                                <i class="bi bi-eye-fill fs-5"></i>
                                            </a>
                                            <a th:href="@{/receptionist/invoices/print/{id}(id=${item.id})}"
                                                target="_blank" class="btn btn-sm btn-outline-success border-0"
                                                title="In hóa đơn">
                                                <i class="bi bi-printer-fill fs-5"></i>
                                            </a>
                                            <a th:href="@{/receptionist/invoices/delete/{id}(id=${item.id})}"
                                                class="btn btn-sm btn-outline-danger border-0" title="Xóa vĩnh viễn"
                                                onclick="return confirm('Bạn có chắc chắn muốn xóa hóa đơn này?')">
                                                <i class="bi bi-trash-fill fs-5"></i>
                                            </a>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
