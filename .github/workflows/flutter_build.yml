name: Build Flutter Mobile App

on:
  push:
    branches:
      - main
      - master
      - integration/member3-cloudinary
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter_build.yml'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Đặt chính xác phiên bản Flutter bạn đang dùng dưới Local (ví dụ: '3.24.3' hoặc '3.24.x')
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Install Dependencies
        run: flutter pub get

      # Bỏ comment dòng dưới nếu app có sử dụng build_runner (JsonSerializable, Freezed, Hive, v.v.)
      # - name: Run Code Generation
      #   run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build APK (Release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MayHotel-App-Android-Release
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
