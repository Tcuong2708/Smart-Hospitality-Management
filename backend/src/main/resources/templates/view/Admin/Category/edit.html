<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<th:block th:fragment="extra_css">
    <link rel="stylesheet" th:href="@{/css/Admin/Category/edit.css}" />
</th:block>

<div th:fragment="body_content">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card admin-form-card">
                    <div class="admin-header">
                        <h3 class="mb-1 fw-bold text-uppercase" style="letter-spacing: 1px;">
                            <i class="bi bi-pencil-square me-2 text-gold"></i>Cập Nhật Loại Phòng
                        </h3>
                        <p class="mb-0 small text-white-50">Mã số: #<th:block th:text="${loaiPhong.maLoai}"></th:block></p>
                    </div>

                    <div class="card-body p-4">
                        <form th:action="@{/admin/categories/edit}" th:object="${loaiPhong}" method="post">
                            <input type="hidden" th:field="*{maLoai}" />

                            <div class="mb-4">
                                <label class="form-label">Tên loại phòng <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{name}" class="form-control form-control-lg" placeholder="Nhập tên loại phòng..." required />
                            </div>

                            <div class="d-flex justify-content-between align-items-center pt-3 border-top mt-4">
                                <a th:href="@{/admin/categories}" class="btn btn-outline-secondary px-4">
                                    <i class="bi bi-arrow-left me-1"></i> Hủy bỏ
                                </a>
                                <button type="submit" class="btn btn-gold px-4 shadow-sm">
                                    <i class="bi bi-check-lg me-1"></i> LƯU THAY ĐỔI
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:fragment="extra_js"></div>
</html>
