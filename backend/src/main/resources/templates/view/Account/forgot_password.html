<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<head>
    <title>Đặt lại mật khẩu - MAY HOTEL</title>
</head>

<body>

    <th:block layout:fragment="additional-css">
        <link rel="stylesheet" th:href="@{/css/auth.css}" />
    </th:block>

    <div layout:fragment="content">

        <section class="mh-auth mh-auth--narrow">
            <aside class="mh-auth-visual">
                <div class="mh-auth-visual-overlay"></div>
                <div class="mh-auth-visual-content">
                    <div class="mh-auth-ornament">✦ ❦ ✦</div>
                    <h2>Mật khẩu<br>mới</h2>
                    <div class="mh-auth-rule"></div>
                    <p>Đặt mật khẩu mới an toàn hơn để bảo vệ tài khoản May Hotel của bạn.</p>
                </div>
            </aside>

            <div class="mh-auth-form-wrap">
                <div class="mh-auth-form-inner">

                    <a th:href="@{/}" class="mh-auth-logo">
                        <img th:src="@{/images/logo-web.png}" alt="MAY HOTEL">
                    </a>

                    <header class="mh-auth-header">
                        <span class="mh-auth-eyebrow">Đổi mật khẩu</span>
                        <h1>Đặt mật khẩu mới</h1>
                        <p>Chọn mật khẩu an toàn, ít nhất 6 ký tự.</p>
                    </header>

                    <div th:if="${error != null}" class="mh-auth-alert error">
                        <i class="fa-solid fa-circle-exclamation"></i>
                        <span th:text="${error}"></span>
                    </div>

                    <form th:action="@{/account/reset_password}" method="post" class="mh-auth-form">
                        <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}"
                            th:value="${_csrf.token}" />

                        <div class="mh-field">
                            <label for="newPassword">Mật khẩu mới</label>
                            <div class="mh-field-input">
                                <i class="fa-solid fa-lock"></i>
                                <input id="newPassword" type="password" name="newPassword" required minlength="6"
                                    placeholder="Ít nhất 6 ký tự" />
                            </div>
                        </div>

                        <button type="submit" class="mh-auth-submit">
                            <i class="fa-solid fa-check"></i>
                            Hoàn tất đổi mật khẩu
                        </button>
                    </form>
                </div>
            </div>
        </section>

    </div>

</body>

</html>
