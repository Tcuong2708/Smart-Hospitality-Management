<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Người Dùng</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .admin-header-navy { background: #001f3f; color: white; padding: 20px; border-radius: 10px 10px 0 0; text-align: center;}
        .admin-card-custom { background: white; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        .avatar-circle { width: 80px; height: 80px; background: #eee; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto; font-size: 40px; color: #001f3f; }
        .info-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed #eee; }
        .info-label { color: #666; font-weight: bold; }
        .btn-gold { background: #C5A059; color: white; border: none; }
        .btn-gold:hover { background: #A68546; color: white; }
    </style>

  <!-- CÁC FILE CSS ĐƯỢC CHÈN SẴN ĐỂ TRÁNH FOUC (FLASH OF UNSTYLED CONTENT) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../../style.css" />
  <style>
    .navbar-nav .nav-link.active-menu {
      font-weight: 700 !important;
      color: #d4af37 !important; /* Màu vàng Gold */
      background-color: rgba(212, 175, 55, 0.1); /* Nền mờ */
      border-radius: 8px; /* Bo tròn góc */
      padding: 8px 16px !important; /* Tạo khoảng trống xung quanh chữ */
      transition: 0.3s all ease-in-out;
    }
  </style>

</head>
<body>

<div class="main-content">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="admin-card-custom">
                    <div class="admin-header-navy">
                        <h3 class="mb-1 fw-bold text-uppercase">Thông Tin Chi Tiết</h3>
                        <p class="mb-0 small text-white-50">ID Tài khoản: #1</p>
                    </div>
                    <div class="card-body p-4">
                        <div class="text-center mb-5">
                            <div class="avatar-circle mb-3"><i class="bi bi-person-fill"></i></div>
                            <h4 class="text-dark fw-bold mb-2">Nguyễn Văn A</h4>
                            <span class="badge bg-secondary">Khách Hàng</span>
                        </div>

                        <div class="px-md-4">
                            <div class="info-row"><span class="info-label">Tên đăng nhập:</span> <span class="fw-bold">nguyenvan_a</span></div>
                            <div class="info-row"><span class="info-label">Số điện thoại:</span> <span>0987654321</span></div>
                            <div class="info-row"><span class="info-label">Quốc tịch:</span> <span>Việt Nam</span></div>
                            <div class="info-row"><span class="info-label">Địa chỉ:</span> <span>123 Trần Duy Hưng, Hà Nội</span></div>
                        </div>

                        <div class="d-flex justify-content-center gap-3 mt-5 pt-3 border-top">
                            <a href="index.html" class="btn btn-outline-secondary px-4">Quay lại</a>
                            <a href="edit.html" class="btn btn-gold px-4 shadow-sm">Chỉnh sửa</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Layout chung -->
<script src="../../layout.js"></script>
<script src="../../app.js"></script>
</body>
</html>
